  $('mS').textContent=S.sc[0]+' - '+S.sc[1];$('mT').textContent=S.pen?'Penales '+S.pen.sc[0]+' - '+S.pen.sc[1]+(S.fin?' · FINAL':''):(S.fin?'FINAL':"Min "+Math.round(S.m)+"'");
}
$('sP').onclick=()=>{if(SIM&&!SIM.busy){SIM.run=!SIM.run;$('sP').textContent=SIM.run?'Pausar':'Continuar'}};
$('sV').onclick=salirPartido;
$('sR').onclick=()=>{if(!SIM||SIM.busy)return;const id=SIM.p.ID_Partido;salirPartido();jugarPartido(id)};
$('sX').onclick=()=>{simSp=simSp==1?2:simSp==2?4:1;$('sX').textContent='×'+simSp};

/* ---------- porra: aficionados a los lados de la cancha ---------- */
const cheerG=[0,0],porra=(()=>{
 const pos=[];let sd=991;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;
 for(let x=-31;x<=31;x+=2)pos.push({x:x+(rn()-.5)*.5,y:0,z:-28.4+(rn()-.5)*.3});
 for(let x=-30;x<=30;x+=2)pos.push({x:x+(rn()-.5)*.5,y:.55,z:-30.6+(rn()-.5)*.3});
 for(let x=-26;x<=26;x+=2.2)pos.push({x:x+(rn()-.5)*.5,y:0,z:30.4+(rn()-.5)*.3});
 const n=pos.length;pos.forEach(p=>{p.ph=rn()*6.28;p.r=rn();p.r2=rn()});
 const grada=new THREE.Mesh(new THREE.BoxGeometry(66,.55,1.8),new THREE.MeshStandardMaterial({color:0x6b6458,roughness:1}));grada.position.set(0,.275,-30.6);grada.receiveShadow=true;scene.add(grada);
 const mk=(g,c)=>{const m=new THREE.InstancedMesh(g,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),c);m.frustumCulled=false;m.castShadow=true;scene.add(m);return m};
 const cuerpo=mk(new THREE.CylinderGeometry(.3,.32,1.2,10),n),cab=mk(new THREE.SphereGeometry(.21,10,8),n),
   brazos=mk((()=>{const g=new THREE.CylinderGeometry(.07,.06,.8,6);g.translate(0,-.4,0);return g})(),n*2);
 const pal=[0xd62828,0x1d4ed8,0xf4c20d,0xf2f2f2,0x16a34a,0x7c3aed,0xf97316,0x2b2b2b],sk=pieles,cc=new THREE.Color(),dm=new THREE.Object3D();
 function colores(c0,c1){for(let i=0;i<n;i++){const p=pos[i],own=p.x<0?c0:c1;
   if(c0&&p.r<.78)cc.copy(own);else cc.setHex(pal[Math.floor(p.r2*pal.length)%pal.length]);cuerpo.setColorAt(i,cc);
   cc.setHex(sk[Math.floor(p.r*97)%sk.length]);cab.setColorAt(i,cc);brazos.setColorAt(i*2,cc);brazos.setColorAt(i*2+1,cc)}
   cuerpo.instanceColor.needsUpdate=cab.instanceColor.needsUpdate=brazos.instanceColor.needsUpdate=true}
 function anim(t,dt){cheerG[0]=Math.max(0,cheerG[0]-dt);cheerG[1]=Math.max(0,cheerG[1]-dt);
   for(let i=0;i<n;i++){const p=pos[i],ch=cheerG[p.x<0?0:1]>0,s=Math.sin(t*(ch?7:1.6)+p.ph),y=p.y+(ch?Math.abs(s)*.38:Math.abs(Math.sin(t*1.1+p.ph))*.03);
     dm.rotation.set(0,0,0);dm.position.set(p.x,y+.6,p.z);dm.updateMatrix();cuerpo.setMatrixAt(i,dm.matrix);
     dm.position.set(p.x,y+1.48,p.z);dm.updateMatrix();cab.setMatrixAt(i,dm.matrix);
     for(let k=0;k<2;k++){const sg=k?1:-1;dm.position.set(p.x+sg*.34,y+1.18,p.z);dm.rotation.set(0,0,sg*(ch?2.7+s*.35:.18));dm.updateMatrix();brazos.setMatrixAt(i*2+k,dm.matrix)}}
   cuerpo.instanceMatrix.needsUpdate=cab.instanceMatrix.needsUpdate=brazos.instanceMatrix.needsUpdate=true}
 colores(null,null);anim(0,0);
 return{colores,anim}})();

/* ---------- animación ---------- */
const reloj=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function animar(){
  requestAnimationFrame(animar);const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  if(SIM&&SIM.run)simStep(dt);
  porra.anim(reduce?0:t,reduce?0:dt);
  if(!reduce&&!SIM)anim.forEach(j=>{j.fase+=dt*2.4;const s=Math.sin(j.fase);
    if(j.sentado){j.cab.position.y=j.cy+Math.sin(t*1.2+j.fase)*.012;j.rodillas[0].rotation.x=j.rodillas[1].rotation.x=1.5;j.up.rotation.x=-.06+Math.sin(t*1.1+j.fase)*.015;return}
    j.pI.rotation.x=s*.07;j.pD.rotation.x=-s*.07;j.rodillas[0].rotation.x=.05+Math.max(0,-Math.cos(j.fase))*.12;j.rodillas[1].rotation.x=.05+Math.max(0,Math.cos(j.fase))*.12;j.codos[0].rotation.x=j.codos[1].rotation.x=-.2;j.up.rotation.z=s*.025;j.up.rotation.y=s*.04;j.cab.position.y=j.cy+Math.abs(Math.cos(j.fase))*.015;
    if(j.res===1){j.bI.rotation.z=-2.6-s*.3;j.bD.rotation.z=2.6+s*.3;j.g.position.y=Math.abs(Math.sin(j.fase*1.5))*.5;j.up.rotation.x=-.1}
    else if(j.res===0){j.cab.rotation.x=.45;j.up.rotation.x=.22;j.bI.rotation.x=.1;j.bD.rotation.x=.1}
    else{j.bI.rotation.z=-.16;j.bD.rotation.z=.16;j.bI.rotation.x=-s*.2;j.bD.rotation.x=s*.2}});
  if(sel){const j=anim.find(x=>x.t===sel);if(j)objetivo.set(j.g.position.x,0,j.g.position.z)}
  idle+=dt;if(!sel&&!reduce&&idle>4&&!ptr.size)meta.th+=dt*.05;
  const k=Math.min(1,dt*4);cam.th+=(meta.th-cam.th)*k;cam.ph+=(meta.ph-cam.ph)*k;cam.d+=(meta.d-cam.d)*k;cam.o.lerp(objetivo,k);
  camera.position.set(cam.o.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.d*Math.cos(cam.ph)+1.5,cam.o.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.o.x,sel?2:0,cam.o.z);renderer.render(scene,camera);
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    const [te,tp]=await Promise.all([fetch(SHEET+GID_EQ).then(r=>r.text()),fetch(SHEET+GID_PA).then(r=>r.text())]);
    teams=csv(te).filter(e=>(e.Status||'').trim().toLowerCase()==='activo'&&!['11','15'].includes(String(e.ID_Equipo))).map(e=>({...e,id:e.ID_Equipo}));teams.forEach(t=>T[t.id]=t);
    csv(te).forEach(e=>{if(!T[e.ID_Equipo])T[e.ID_Equipo]={...e,id:e.ID_Equipo,baja:true}});   // equipos en baja: sus partidos ya jugados se siguen mostrando
    const PALL=NL7Juegos.correcciones(csv(tp));P=PALL;calcDescansos();   // descansos con TODOS los partidos, como partidos.js
    /* igual que partidos.js: los jugados siempre se ven; los pendientes/programados solo si los dos equipos están activos */
    const act=new Set(teams.map(t=>String(t.id).trim())),ok=x=>{x=String(x||'').trim();return !x||act.has(x)};
    P=PALL.filter(p=>!NL7Juegos.estado(p).includes('cancel')&&!NL7Juegos.esCubierto(p,Object.values(T))&&(NL7Juegos.estado(p)==='jugado'||ok(p.Equipo_Local)&&ok(p.Equipo_Visita))); 
    fechas=[...new Set(P.map(p=>p.Fecha).filter(Boolean))].sort((a,b)=>tf(a)-tf(b));
    $('fechas').innerHTML=fechas.map(f=>{const ms=P.filter(p=>p.Fecha==f),pen=ms.some(p=>p.Estado!='Jugado');return `<button data-f="${f}" class="${pen?'pen':''}">${f.slice(0,5)}<small>${ms.length} · ${pen?'pendientes':'jugados'}</small></button>`}).join('');
    document.querySelectorAll('#fechas button').forEach(b=>b.onclick=()=>dibujar(b.dataset.f).then(panel));
    $('tabs').innerHTML=[['dom','Domingo'],['jug','Jugados'],['pen','Pendientes'],['des','Control']].map(([k,n])=>`<button data-k="${k}">${n}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;panel()});
    const hoy=new Date().setHours(0,0,0,0),prox=fechas.find(f=>tf(f)>=hoy)||fechas[fechas.length-1];
    await dibujar(prox);panel();$('msg').remove();animar();
    document.querySelector(`#fechas button[data-f="${prox}"]`).scrollIntoView({inline:'center',block:'nearest'});
  }catch(e){$('msg').textContent='No se pudo cargar la hoja: '+e.message}
})();
