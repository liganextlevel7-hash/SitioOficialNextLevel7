<script>
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub?single=true&output=csv&gid=';

/* Reglas de descanso: Galácticos descansó en la jornada 1; Deportivo Azul no jugó la J1 pero se toma como jugada (no es descanso). */

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const tf=s=>{const p=(s||'').split('/');return p.length==3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0};

/* ---------- escena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<=760?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);

Object.assign(sun.shadow.camera,{left:-45,right:45,top:35,bottom:-35,near:10,far:130});scene.add(sun);
const PW=74,PH=48.6;
(function(){
  const c=document.createElement('canvas');c.width=1400;c.height=920;const x=c.getContext('2d');
  for(let i=0;i<14;i++){x.fillStyle=i%2?'#2a7a2d':'#348a3a';x.fillRect(i*100,0,100,920)}
  x.strokeStyle='rgba(255,255,255,.9)';x.fillStyle='#fff';x.lineWidth=5;const m=40;
  x.strokeRect(m,m,1320,840);x.beginPath();x.moveTo(700,m);x.lineTo(700,880);x.stroke();x.beginPath();x.arc(700,460,95,0,7);x.stroke();
  [[m,1],[1360,-1]].forEach(([px,s])=>{x.strokeRect(s>0?px:px-230,250,230,420);x.strokeRect(s>0?px:px-95,360,95,200)});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const f=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshStandardMaterial({map:t,roughness:.95}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
  const s=new THREE.Mesh(new THREE.CircleGeometry(230,48),new THREE.MeshStandardMaterial({color:0x08170d,roughness:1}));s.rotation.x=-Math.PI/2;s.position.y=-.05;scene.add(s);
  [-1,1].forEach(d=>{const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xffffff});
    [[.3,3.8,.3,0,1.9,-4.2],[.3,3.8,.3,0,1.9,4.2],[.3,.3,8.7,0,3.8,0]].forEach(a=>{const b=new THREE.Mesh(new THREE.BoxGeometry(a[0],a[1],a[2]),m);b.position.set(a[3],a[4],a[5]);g.add(b)});
    g.position.x=d*(PW/2-1.6);scene.add(g)});
  /* banca para los equipos sin partido */
  const ban=new THREE.Mesh(new THREE.BoxGeometry(60,.6,1.4),new THREE.MeshStandardMaterial({color:0x5a3b1c}));ban.position.set(0,.5,PH/2+3.4);scene.add(ban);
})();

/* Entorno aproximado inspirado en la foto: vegetación, mallas, luminarias y juegos. */
const entorno=new THREE.Group();scene.add(entorno);
const madera=new THREE.MeshStandardMaterial({color:0x65513b,roughness:1});
function cilindro(r,h,material,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,7),material);m.position.set(x,y,z);entorno.add(m);return m;}
const metal=new THREE.MeshStandardMaterial({color:0x798a83,roughness:.65});
// Malla perimetral: líneas compartidas para mantener ligero el modelo.
const netPoints=[];
function tramoMalla(x1,z1,x2,z2){
 const w=Math.hypot(x2-x1,z2-z1),h=5.2,dx=(x2-x1)/w,dz=(z2-z1)/w;
 for(let q=0;q<=w;q+=.9)netPoints.push(x1+dx*q,0,z1+dz*q,x1+dx*q,h,z1+dz*q);
 for(let y=0;y<=h;y+=.75)netPoints.push(x1,y,z1,x2,y,z2);
 for(let q=0;q<=w;q+=6)cilindro(.07,h,metal,x1+dx*q,h/2,z1+dz*q);
 netPoints.push(x1,h,z1,x2,h,z2);
}

const canas=[];for(let i=0;i<190;i++){const z=-22+azar()*44,x=-43-azar()*2,h=4+azar()*4;canas.push(x,0,z,x+(azar()-.5),h,z+(azar()-.5));}
const caneGeo=new THREE.BufferGeometry();caneGeo.setAttribute('position',new THREE.Float32BufferAttribute(canas,3));entorno.add(new THREE.LineSegments(caneGeo,new THREE.LineBasicMaterial({color:0xb0a260})));
// Postes rectos con dos reflectores.
[[-35,-27],[0,-27],[35,-27],[-35,27],[0,27],[35,27]].forEach(([x,z])=>{
 cilindro(.12,10,metal,x,5,z);
 for(const a of [-1,1]){const box=new THREE.Mesh(new THREE.BoxGeometry(.85,.65,.2),new THREE.MeshStandardMaterial({color:0x45554e}));box.position.set(x+a*.48,10,z);box.rotation.x=.3;entorno.add(box);const face=new THREE.Mesh(new THREE.PlaneGeometry(.68,.48),new THREE.MeshBasicMaterial({color:0xe4eeee}));face.position.set(x+a*.48,10,z+.12);face.rotation.x=.3;entorno.add(face);}
});
// Juego infantil azul con techo rojo, al costado de la cancha.
const azul=new THREE.MeshStandardMaterial({color:0x0877c9,roughness:.6}),amarillo=new THREE.MeshStandardMaterial({color:0xe8ba29,roughness:.6});

const slide=pieza(new THREE.BoxGeometry(1,.12,3.8),azul,0,1.15,2.5);slide.rotation.x=.5;
for(const x of [-.45,.45]){const rail=pieza(new THREE.BoxGeometry(.1,.35,3.8),azul,x,1.3,2.5);rail.rotation.x=.5;}

/* ---------- jugadores ---------- */
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const fb=(txt,col)=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(64,64,58,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=6;x.stroke();

const cargar=(u,f)=>new Promise(ok=>{if(!u)return ok(f());loader.load(u,t=>{t.encoding=THREE.sRGBEncoding;ok(t)},undefined,()=>ok(f()))});
function prom(tex,def){try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(tex.image,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;
  for(let i=0;i<d.length;i+=4)if(d[i+3]>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++}return n>8?new THREE.Color(r/n/255,g/n/255,b/n/255):def}catch(e){return def}}
const cache={};
function textura(t,i){return cache[t.id]||(cache[t.id]=(async()=>{const def=new THREE.Color().setHSL((i*.137)%1,.55,.42);

function salirPartido(){if(!SIM)return;SIM.run=false;SIM=null;while(sg.children.length)sg.remove(sg.children[0]);balon.visible=false;grupo.visible=true;
  document.body.classList.remove('sim');$('gol').classList.remove('on');objetivo.set(0,0,innerWidth<=760?0:5);meta.d=innerWidth<=760?100:70;meta.ph=1}
function nuevaJugada(){
  const S=SIM,q=S.pl[S.idx];if(!q)return final();
  S.idx++;S.atk=q.e;const E=S.eq[q.e],O=S.eq[1-q.e],d=E.dir,r=S.rnd;
  if(S.centro){balon.position.set(0,.17,0);S.centro=false}
  const mids=[3,4,5].sort(()=>r()-.5),same=S.hold&&S.hold.e==q.e,st=same?S.hold:E.pj[Math.floor(r()*3)];
  const ch=[st,E.pj[mids[0]],E.pj[mids[1]],E.pj[6]].filter((j,i,a)=>a.indexOf(j)==i);S.hold=null;
  const seg=(to,dur,arc,fin,ini)=>S.q.push({to,dur,arc,fin,ini});
  ch.forEach((j,i)=>{if(!i&&same)return;const dist=Math.hypot(balon.position.x-j.g.position.x,balon.position.z-j.g.position.z);
    seg(j,i?.7+r()*.3:.5+dist/35,1.2+r(),null)});
  const sh=ch[ch.length-1],gk=O.pj[0];
  if(q.r=='gol'){const z=(r()<.5?-1:1)*(1.2+r()*2.6),y=.6+r()*2.4;
    seg({x:d*36.3,y,z},.75,.4,()=>gol(q.e),()=>{gk.dv={t:0,s:Math.sign(z)}})}
  else if(q.r=='atajada'){seg(gk,.75,.3,()=>{S.hold=gk;S.q.push({to:null,dur:.9})},()=>{gk.dv={t:0,s:Math.sign(sh.g.position.z-gk.g.position.z)||1}})}
  else if(q.r=='fuera'){seg({x:d*39,y:r()<.5?5:1,z:(r()<.5?-1:1)*(6+r()*3)},.8,.5,()=>{S.pausa=.7})}
  else{const it=O.pj[3+Math.floor(r()*3)];seg(it,.7,1,()=>{S.hold=it})}
}
function gol(e){const S=SIM;S.sc[e]++;S.hold=null;S.pausa=3;S.centro=true;
  S.eq[e].pj.forEach((j,i)=>{if(i)j.cel=2.6});S.eq[1-e].pj.forEach(j=>j.cel=0);
  aviso('¡GOOOL!<br><small>'+esc(S.eq[e].t.Nombre)+'</small>',2400)}
function final(){const S=SIM,[a,b]=S.sc;let w=a>b?0:b>a?1:-1,n='';
  if(w<0&&S.p.Ganado_Por=='Penales'&&S.p.Penales){w=S.p.Penales==S.p.Equipo_Local?0:1;n='<br><small>Gana en penales: '+esc(S.eq[w].t.Nombre)+'</small>'}
  S.fin=true;S.finT=0;S.hold=null;S.m=60;
  S.eq.forEach(E=>E.pj.forEach(j=>{if(E.e==w)j.cel=1e9;else if(w>=0)j.lose=true}));
  aviso('FINAL '+a+' - '+b+(w>=0&&!n?'<br><small>Gana '+esc(S.eq[w].t.Nombre)+'</small>':n||'<br><small>Empate</small>'))}
function simStep(dt){
  const S=SIM;dt*=simSp;if(S.fin)S.finT+=dt;
  if(!S.fin){
    if(S.seg){const g=S.seg;g.t+=dt;const k=Math.min(1,g.t/g.dur);
      if(g.to){const e=g.to.g?g.to.g.position:g.to,y1=g.to.g?.17:g.to.y;
        balon.position.set(g.f.x+(e.x-g.f.x)*k,g.f.y+(y1-g.f.y)*k+Math.sin(k*Math.PI)*g.arc,g.f.z+(e.z-g.f.z)*k);balon.rotation.x+=dt*9}
      else if(S.hold){const h=S.hold.g.position;balon.position.set(h.x,1.3,h.z)}
      if(k>=1){S.seg=null;g.fin&&g.fin()}}
    else if(S.q.length){S.seg=S.q.shift();S.seg.t=0;S.seg.f=balon.position.clone();S.seg.ini&&S.seg.ini()}
    else if(S.pausa>0)S.pausa-=dt;else nuevaJugada();
  }
  S.m+=((S.fin?60:S.idx/S.pl.length*60)-S.m)*Math.min(1,dt*1.2);
  const all=S.eq[0].pj.concat(S.eq[1].pj),bp=balon.position;
  all.forEach(j=>{const g=j.g,p=g.position;
    if(j.dv){j.dv.t+=dt;const t=j.dv.t,a=Math.min(1,t/.3)*(t>1.3?Math.max(0,1-(t-1.3)/.4):1);
      g.rotation.z=j.dv.s*j.dir*1.25*a;if(t<.4)p.z=Math.max(-5.5,Math.min(5.5,p.z+j.dv.s*dt*7));if(t>1.7){j.dv=null;g.rotation.z=0}return}
    if(j.cel>0){j.cel-=dt;j.fase+=dt*8;const s=Math.sin(j.fase);j.bI.rotation.z=-2.6-s*.3;j.bD.rotation.z=2.6+s*.3;g.position.y=Math.abs(Math.sin(j.fase*.75))*.5;return}
    g.position.y=0;j.bI.rotation.z=-.16;j.bD.rotation.z=.16;
    let tx,tz;
    if(!j.i){tx=j.bx;tz=Math.max(-3.5,Math.min(3.5,bp.z*.35))}
    else{tx=j.bx+j.dir*(S.atk==j.e&&!S.fin?9:-3);tx+=(bp.x-tx)*.22;tz=j.bz+(bp.z-j.bz)*.3}
    if(S.fin){if(j.lose&&S.finT>2.2){tx=p.x;tz=(j.bz>=0?1:-1)*26.2}else[tx,tz]=[p.x,p.z]}
    const dx=tx-p.x,dz=tz-p.z,dist=Math.hypot(dx,dz),v=dist>.4?Math.min(dist*2.5,j.lose?3.2:(j.i?8.5:3)):0;
    if(v>0){p.x+=dx/dist*v*dt;p.z+=dz/dist*v*dt}
    all.forEach(o=>{if(o!==j){const a=p.x-o.g.position.x,b=p.z-o.g.position.z,l=Math.hypot(a,b);if(l<2&&l>.01){p.x+=a/l*(2-l)*dt*4;p.z+=b/l*(2-l)*dt*4}}});
    p.x=Math.max(-36,Math.min(36,p.x));const zl=j.lose?27:23;p.z=Math.max(-zl,Math.min(zl,p.z));
    const ang=j.i?(v>.5?Math.atan2(dx,dz):Math.atan2(bp.x-p.x,bp.z-p.z)):j.dir*Math.PI/2;let da=ang-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*Math.min(1,dt*8);
    j.fase+=dt*(2+v*1.1);const sw=Math.sin(j.fase*1.6)*(v>.5?.75:.08);
    j.pI.rotation.x=sw;j.pD.rotation.x=-sw;j.bI.rotation.x=-sw*.8;j.bD.rotation.x=sw*.8;
    j.cab.position.y=2.30+Math.abs(Math.cos(j.fase))*.08;j.cab.rotation.x=j.lose?.45:0});
  $('mS').textContent=S.sc[0]+' - '+S.sc[1];$('mT').textContent=S.fin?'FINAL':"Min "+Math.round(S.m)+"'";
}
$('sP').onclick=()=>{if(SIM&&!SIM.busy){SIM.run=!SIM.run;$('sP').textContent=SIM.run?'Pausar':'Continuar'}};
$('sV').onclick=salirPartido;
$('sR').onclick=()=>{if(!SIM||SIM.busy)return;const id=SIM.p.ID_Partido;salirPartido();jugarPartido(id)};
$('sX').onclick=()=>{simSp=simSp==1?2:simSp==2?4:1;$('sX').textContent='×'+simSp};

/* ---------- animación ---------- */
const reloj=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function animar(){
  requestAnimationFrame(animar);const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  if(SIM&&SIM.run)simStep(dt);
  if(!reduce&&!SIM)anim.forEach(j=>{j.fase+=dt*2.4;const s=Math.sin(j.fase);
    if(j.sentado){j.cab.position.y=2.30+Math.sin(t*1.2+j.fase)*.04;return}
    j.pI.rotation.x=s*.18;j.pD.rotation.x=-s*.18;j.cab.position.y=2.30+Math.abs(Math.cos(j.fase))*.06;
    if(j.res===1){j.bI.rotation.z=-2.6-s*.3;j.bD.rotation.z=2.6+s*.3;j.g.position.y=Math.abs(Math.sin(j.fase*1.5))*.5}
    else if(j.res===0){j.cab.rotation.x=.45;j.bI.rotation.x=.1;j.bD.rotation.x=.1}
    else{j.bI.rotation.z=-.16;j.bD.rotation.z=.16;j.bI.rotation.x=-s*.2;j.bD.rotation.x=s*.2}});
  if(sel){const j=anim.find(x=>x.t===sel);if(j)objetivo.set(j.g.position.x,0,j.g.position.z)}
  idle+=dt;if(!sel&&!reduce&&idle>4&&!ptr.size)meta.th+=dt*.05;
  const k=Math.min(1,dt*4);cam.th+=(meta.th-cam.th)*k;cam.ph+=(meta.ph-cam.ph)*k;cam.d+=(meta.d-cam.d)*k;cam.o.lerp(objetivo,k);
  camera.position.set(cam.o.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.d*Math.cos(cam.ph)+1.5,cam.o.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.o.x,sel?2:0,cam.o.z);renderer.render(scene,camera);
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    const [te,tp]=await Promise.all([fetch(SHEET+GID_EQ).then(r=>r.text()),fetch(SHEET+GID_PA).then(r=>r.text())]);
    teams=csv(te).filter(e=>(e.Status||'').trim().toLowerCase()==='activo'&&!['11','15'].includes(String(e.ID_Equipo))).map(e=>({...e,id:e.ID_Equipo}));teams.forEach(t=>T[t.id]=t);
    csv(te).forEach(e=>{if(!T[e.ID_Equipo])T[e.ID_Equipo]={...e,id:e.ID_Equipo,baja:true}});   // equipos en baja: sus partidos ya jugados se siguen mostrando
    const PALL=NL7Juegos.correcciones(csv(tp));P=PALL;calcDescansos();   // descansos con TODOS los partidos, como partidos.js
    /* igual que partidos.js: los jugados siempre se ven; los pendientes/programados solo si los dos equipos están activos */
    const act=new Set(teams.map(t=>String(t.id).trim())),ok=x=>{x=String(x||'').trim();return !x||act.has(x)};
    P=PALL.filter(p=>!NL7Juegos.estado(p).includes('cancel')&&!NL7Juegos.esCubierto(p,Object.values(T))&&(NL7Juegos.estado(p)==='jugado'||ok(p.Equipo_Local)&&ok(p.Equipo_Visita))); 
    fechas=[...new Set(P.map(p=>p.Fecha).filter(Boolean))].sort((a,b)=>tf(a)-tf(b));
    $('fechas').innerHTML=fechas.map(f=>{const ms=P.filter(p=>p.Fecha==f),pen=ms.some(p=>p.Estado!='Jugado');return `<button data-f="${f}" class="${pen?'pen':''}">${f.slice(0,5)}<small>${ms.length} · ${pen?'pendientes':'jugados'}</small></button>`}).join('');
    document.querySelectorAll('#fechas button').forEach(b=>b.onclick=()=>dibujar(b.dataset.f).then(panel));
    $('tabs').innerHTML=[['dom','Domingo'],['jug','Jugados'],['pen','Pendientes'],['des','Control']].map(([k,n])=>`<button data-k="${k}">${n}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;panel()});
    const hoy=new Date().setHours(0,0,0,0),prox=fechas.find(f=>tf(f)>=hoy)||fechas[fechas.length-1];
    await dibujar(prox);panel();$('msg').remove();animar();
    document.querySelector(`#fechas button[data-f="${prox}"]`).scrollIntoView({inline:'center',block:'nearest'});
  }catch(e){$('msg').textContent='No se pudo cargar la hoja: '+e.message}
})();
