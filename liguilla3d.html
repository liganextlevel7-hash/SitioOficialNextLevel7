<script>
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub?single=true&output=csv&gid=';
const GID={eq:'1894947293',li:'1783955716',es:'979195152'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const esPD=v=>!norm(v)||['tbd','por definir','por confirmar','pendiente','-'].includes(norm(v))||/^p+or\s+definir$/.test(norm(v));
function filas(t){const r=[];let f='',row=[],q=false;t=String(t||'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f.trim());f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f.trim());f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f.trim());r.push(row)}return r}
const objetos=t=>{const r=filas(t),h=r.shift()||[];return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,a[i]||''])))};

/* ---------- datos ---------- */
let T={},TN={},tabla=[],B=[],clas=[],sel=null,ronda='Completa',tab='cla',liguillaRaw=[];
const PD={id:'pd',Nombre:'Por definir',Descripción:'',URL:'',Color_Playera:''};
function armar(eqTxt,liTxt,esTxt){
  T={};TN={};
  const eqs=objetos(eqTxt).map(e=>({...e,id:e.ID_Equipo}));
  eqs.forEach(e=>{T[e.id]=e;TN[norm(e.Nombre)]=e});
  const activo=e=>norm(e.Status)==='activo';
  /* tabla de clasificación = misma hoja de estadísticas que usa la tabla general */
  const est=filas(esTxt).slice(1).map(c=>({nombre:c[1],jj:+c[2]||0,jg:+c[3]||0,je:+c[4]||0,jp:+c[5]||0,gf:+c[6]||0,gc:+c[7]||0,dg:+c[8]||0,pts:+c[9]||0,rk:Number(c[10])||999}))
    .filter(r=>r.nombre&&r.nombre!=='Descansa'&&TN[norm(r.nombre)]&&activo(TN[norm(r.nombre)]));
  est.sort((a,b)=>a.rk-b.rk);
  tabla=est.map((r,i)=>({t:TN[norm(r.nombre)],r,pos:i+1}));
  clas=tabla.slice(0,8);
  /* partidos de la liguilla (mismas columnas que liguilla.js) */
  liguillaRaw=filas(liTxt).slice(1).map(c=>({id:c[0]||'',il:c[2]||'',iv:c[5]||'',ronda:norm(c[1]),nl:c[3],gl:c[4],nv:c[6],gv:c[7],gan:c[8],rl:Number(c[11])||0,rv:Number(c[12])||0,estado:(c[13]||'').toLowerCase(),fecha:c[14]||''}));
  const sacar=(rn,n)=>liguillaRaw.filter(p=>p.ronda==rn).slice(0,n);
  const eq=nom=>esPD(nom)?null:(TN[norm(nom)]||null);
  const asiento=n=>n>0&&tabla[n-1]?tabla[n-1].t:null;
  B=[];
  const Q=sacar('cuartos',4);
  for(let i=0;i<4;i++){
    const p=Q[i]||{},sl=p.rl||i+1,sv=p.rv||8-i;
    let l=eq(p.nl),v=eq(p.nv),pl=false,pv=false;
    if(!l){l=asiento(sl);pl=!!l}if(!v){v=asiento(sv);pv=!!v}
    B.push({r:'Cuartos',i,loc:l,vis:v,pl,pv,sl,sv,...resultado(p,l,v)});
  }
  sacar('semifinal',2).concat([{},{}]).slice(0,2).forEach((p,i)=>{const l=eq(p.nl),v=eq(p.nv);B.push({r:'Semifinal',i,loc:l,vis:v,...resultado(p,l,v)})});
  const F=sacar('final',1)[0]||{};{const l=eq(F.nl),v=eq(F.nv);B.push({r:'Final',i:0,loc:l,vis:v,...resultado(F,l,v)})}
}
function resultado(p,l,v){
  const jug=(p.estado||'')=='jugado'&&p.gl!==''&&p.gl!=null&&p.gv!==''&&p.gv!=null,gl=+p.gl,gv=+p.gv;
  let gan=null;if(jug&&l&&v){const registrado=esPD(p.gan)?null:(TN[norm(p.gan)]||T[String(p.gan).trim()]||null);gan=registrado&&(registrado===l||registrado===v)?registrado:gl>gv?l:gl<gv?v:null;}
  return {id:p.id||'',jug,gl:jug?gl:null,gv:jug?gv:null,gan,fecha:p.fecha||'',estado:norm(p.estado)};
}
const posDe=t=>t?tabla.findIndex(x=>x.t===t)+1:0;

/* ---------- escena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<=760?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x81b9df);scene.fog=new THREE.Fog(0x81b9df,160,350);
const camera=new THREE.PerspectiveCamera(innerWidth<=760?60:46,innerWidth/innerHeight,.5,600);
camera.setViewOffset(innerWidth,innerHeight,innerWidth>760?-155:0,0,innerWidth,innerHeight);
scene.add(new THREE.HemisphereLight(0xbfe8c0,0x0a1d10,.9));
const sun=new THREE.DirectionalLight(0xfff4d6,.95);sun.position.set(-25,55,25);sun.castShadow=true;sun.shadow.mapSize.set(innerWidth<=760?512:1024,innerWidth<=760?512:1024);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:35,bottom:-35,near:10,far:140});scene.add(sun);
const PW=104,PH=56;
(function(){
  const c=document.createElement('canvas');c.width=1560;c.height=840;const x=c.getContext('2d');
  for(let i=0;i<16;i++){x.fillStyle=i%2?'#2a7a2d':'#348a3a';x.fillRect(i*97.5,0,98,840)}
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=5;x.strokeRect(40,40,1480,760);x.beginPath();x.moveTo(780,40);x.lineTo(780,800);x.stroke();x.beginPath();x.arc(780,420,95,0,7);x.stroke();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const f=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshStandardMaterial({map:t,roughness:.95}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
  const s=new THREE.Mesh(new THREE.CircleGeometry(260,48),new THREE.MeshStandardMaterial({color:0x08170d,roughness:1}));s.rotation.x=-Math.PI/2;s.position.y=-.05;scene.add(s);

})();

/* Entorno aproximado inspirado en la foto: vegetación, mallas, luminarias y juegos. */
const entorno=new THREE.Group();scene.add(entorno);
const madera=new THREE.MeshStandardMaterial({color:0x65513b,roughness:1});
function cilindro(r,h,material,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,7),material);m.position.set(x,y,z);entorno.add(m);return m;}
const metal=new THREE.MeshStandardMaterial({color:0x798a83,roughness:.65});
// Malla perimetral: líneas compartidas para mantener ligero el modelo.
const netPoints=[];
function tramoMalla(x1,z1,x2,z2){
 const w=Math.hypot(x2-x1,z2-z1),h=5.2,dx=(x2-x1)/w,dz=(z2-z1)/w;
 for(let q=0;q<=w;q+=.9)netPoints.push(x1+dx*q,0,z1+dz*q,x1+dx*q,h,z1+dz*q);
 for(let y=0;y<=h;y+=.75)netPoints.push(x1,y,z1,x2,y,z2);
 for(let q=0;q<=w;q+=6)cilindro(.07,h,metal,x1+dx*q,h/2,z1+dz*q);
 netPoints.push(x1,h,z1,x2,h,z2);
}
tramoMalla(-55,-31,55,-31);tramoMalla(-55,31,55,31);tramoMalla(-55,-31,-55,31);tramoMalla(55,-31,55,31);
const netGeo=new THREE.BufferGeometry();netGeo.setAttribute('position',new THREE.Float32BufferAttribute(netPoints,3));entorno.add(new THREE.LineSegments(netGeo,new THREE.LineBasicMaterial({color:0x355443,transparent:true,opacity:.42})));
let semilla=1287;function azar(){semilla=(semilla*1664525+1013904223)>>>0;return semilla/4294967296;}
// Carrizos altos detrás de una portería, como en la referencia.
const canas=[];for(let i=0;i<190;i++){const z=-22+azar()*44,x=-58-azar()*2,h=4+azar()*4;canas.push(x,0,z,x+(azar()-.5),h,z+(azar()-.5));}
const caneGeo=new THREE.BufferGeometry();caneGeo.setAttribute('position',new THREE.Float32BufferAttribute(canas,3));entorno.add(new THREE.LineSegments(caneGeo,new THREE.LineBasicMaterial({color:0xb0a260})));
// Postes rectos con dos reflectores.
[[-47,-32],[0,-32],[47,-32],[-47,32],[0,32],[47,32]].forEach(([x,z])=>{
 cilindro(.12,10,metal,x,5,z);
 for(const a of [-1,1]){const box=new THREE.Mesh(new THREE.BoxGeometry(.85,.65,.2),new THREE.MeshStandardMaterial({color:0x45554e}));box.position.set(x+a*.48,10,z);box.rotation.x=.3;entorno.add(box);const face=new THREE.Mesh(new THREE.PlaneGeometry(.68,.48),new THREE.MeshBasicMaterial({color:0xe4eeee}));face.position.set(x+a*.48,10,z+.12);face.rotation.x=.3;entorno.add(face);}
});
// Juego infantil azul con techo rojo, al costado de la cancha.
const azul=new THREE.MeshStandardMaterial({color:0x0877c9,roughness:.6}),amarillo=new THREE.MeshStandardMaterial({color:0xe8ba29,roughness:.6});
const juegos=new THREE.Group();juegos.position.set(-37,0,-35);entorno.add(juegos);
function pieza(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);juegos.add(m);return m;}
for(const x of [-.9,.9])for(const z of [-.9,.9])pieza(new THREE.CylinderGeometry(.06,.06,3.5,6),amarillo,x,1.75,z);
pieza(new THREE.BoxGeometry(2,.12,2),azul,0,2.1,0);const roof=pieza(new THREE.ConeGeometry(1.7,.9,4),new THREE.MeshStandardMaterial({color:0xb42d25}),0,4,0);roof.rotation.y=Math.PI/4;
const slide=pieza(new THREE.BoxGeometry(1,.12,3.8),azul,0,1.15,2.5);slide.rotation.x=.5;
for(const x of [-.45,.45]){const rail=pieza(new THREE.BoxGeometry(.1,.35,3.8),azul,x,1.3,2.5);rail.rotation.x=.5;}
for(let i=0;i<6;i++)pieza(new THREE.BoxGeometry(1.1,.07,.18),amarillo,0,.25+i*.31,-2.6+i*.26);


/* ---------- jugadores ---------- */
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const fb=(txt,col)=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(64,64,58,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=6;x.stroke();
  x.fillStyle='#fff';x.font='bold 64px Roboto,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,64,68);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t};
const cargar=(u,f)=>new Promise(ok=>{if(!u)return ok(f());const lim=setTimeout(()=>ok(f()),6000);loader.load(u,t=>{clearTimeout(lim);t.encoding=THREE.sRGBEncoding;ok(t)},undefined,()=>{clearTimeout(lim);ok(f())})});
function prom(tex,def){try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(tex.image,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;
  for(let i=0;i<d.length;i+=4)if(d[i+3]>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++}return n>8?new THREE.Color(r/n/255,g/n/255,b/n/255):def}catch(e){return def}}
const cacheT={};
function textura(t){return cacheT[t.id]||(cacheT[t.id]=(async()=>{const idx=Object.keys(T).indexOf(String(t.id));const def=t.id=='pd'?new THREE.Color(0x6b7a70):new THREE.Color().setHSL((Math.max(idx,0)*.137)%1,.55,.42);
  const [esc,pla]=await Promise.all([cargar(t.URL,()=>fb(t.id=='pd'?'?':(t.Nombre||'?').charAt(0),'#'+def.getHexString())),cargar(t.Color_Playera,()=>null)]);

    $('rondas').innerHTML=[['Completa','Completa'],['Cuartos','Cuartos'],['Semifinal','Semifinales'],['Final','Final']].map(([k,n])=>`<button data-r="${k}">${n}</button>`).join('');
    document.querySelectorAll('#rondas button').forEach(b=>b.onclick=()=>enfocar(b.dataset.r));
    $('tabs').innerHTML=[['cla','Clasificados'],['par','Partidos']].map(([k,n])=>`<button data-k="${k}">${n}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;panel()});
    await dibujar();panel();enfocar('Completa');$('msg').remove();animar();
    if(!tabla.length)$('top').querySelector('p').textContent='No pude leer la tabla de clasificación; revisa la hoja de estadísticas';
  }catch(e){$('msg').textContent='No se pudo cargar la hoja: '+e.message}
})();
</script>
</body>
</html>
