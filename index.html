/* ==================== ANIMACIÓN TÍTULO Y BALÓN (INTACTO) ==================== */
#titulo-letras { display:inline; }
.titulo-letra { display: inline-block; opacity: 0; }
.titulo-letra.animar { animation: letraCae 0.5s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }
@keyframes letraCae {
  0%   { transform: translateY(-50px) scale(1.3); opacity:0; }
  50%  { transform: translateY(6px) scale(0.96); opacity:1; }
  70%  { transform: translateY(-3px) scale(1.01); }
  100% { transform: translateY(0) scale(1); opacity:1; }
}
.titulo-espacio { display:inline-block; width:0.4em; }
.balon-container { position: absolute; pointer-events: none; z-index: 10; display: none; }
.balon-emoji { font-size: clamp(18px, 4vw, 36px); display: block; animation: balonSube 0.55s cubic-bezier(0.36,0.07,0.19,0.97) infinite alternate, balonGira 0.55s linear infinite; }
@keyframes balonSube { 0% { transform: translateY(-30px) scaleX(1) scaleY(1); } 85% { transform: translateY(-2px) scaleX(1.15) scaleY(0.85); } 100% { transform: translateY(2px) scaleX(1) scaleY(1); } }
@keyframes balonGira { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
.balon-sombra { width: 20px; height: 5px; background: rgba(94,181,13,0.4); border-radius: 50%; margin: 0 auto; animation: sombraBalon 0.55s ease infinite alternate; }
@keyframes sombraBalon { 0% { transform: scaleX(0.3); opacity: 0.1; } 100% { transform: scaleX(1); opacity: 0.5; } }

}
