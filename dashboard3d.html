<div id="msg">Cargando la liga…</div>
<div id="top"><h1>Liga Next Level 7</h1><p>Cada jugador representa un equipo. Tócalo para ver sus estadísticas.</p></div>
<nav id="nav"><a class="nb" href="tablaGeneral.html" title="Volver a la tabla general"><svg viewBox="0 0 32 40" aria-hidden="true"><rect x="4" y="15" width="4" height="11" rx="2" fill="#f1c9a0"/><rect x="24" y="15" width="4" height="11" rx="2" fill="#f1c9a0"/><rect x="10" y="27" width="5" height="11" rx="2" fill="#f3f5ee"/><rect x="17" y="27" width="5" height="11" rx="2" fill="#f3f5ee"/><rect x="9" y="14" width="14" height="14" rx="2" fill="#5eb50d"/><circle cx="16" cy="7" r="6" fill="#f1c9a0"/><path d="M10 6a6 6 0 0 1 12 0z" fill="#1a1410"/></svg><span class="l">← Tabla general</span><span class="c">← Tabla</span></a><a class="nb" href="index.html" title="Ir al inicio del portal"><span aria-hidden="true">🏠</span><span>Inicio</span></a></nav>

<script>
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub?single=true&output=csv&gid=';
const GID_EQ='1894947293',GID_PA='1362473459',GID_ES='979195152'; /* GID_ES = hoja de estadísticas: la misma de la tabla general */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift().map(x=>x.trim());return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
const fecha=s=>{const p=(s||'').split('/');return p.length==3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- datos y estadísticas ---------- */
let teams=[],partidos=[],S={},orden=[];
function calcular(){
  S={};teams.forEach(t=>S[t.id]={pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,forma:[]});
  partidos.filter(p=>p.Estado=='Jugado'&&p.Goles_Local!==''&&p.Goles_Visita!=='')
    .sort((a,b)=>fecha(a.Fecha)-fecha(b.Fecha)||a.ID_Partido-b.ID_Partido)
    .forEach(p=>{const gl=+p.Goles_Local,gv=+p.Goles_Visita;
      [[S[p.Equipo_Local],gl,gv],[S[p.Equipo_Visita],gv,gl]].forEach(([s,a,b])=>{if(!s)return;
        s.pj++;s.gf+=a;s.gc+=b;
        if(a>b){s.g++;s.pts+=3;s.forma.push('G')}else if(a<b){s.p++;s.forma.push('P')}else{s.e++;s.pts++;s.forma.push('E')}})});
  orden=[...teams].sort((a,b)=>S[b.id].pts-S[a.id].pts||(S[b.id].gf-S[b.id].gc)-(S[a.id].gf-S[a.id].gc)||S[b.id].gf-S[a.id].gf);
  aplicarTablaGeneral();
}
/* Puntos, partidos, goles y posición se toman de la hoja de estadísticas, igual que tablaGeneral.js
   (columnas: equipo, JJ, JG, JE, JP, GF, GC, DG, PTS, ranking). Los últimos resultados se siguen sacando de los partidos. */
let EST=null;
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
function leerEstadisticas(texto){
  const f=String(texto||'').replace(/\r/g,'').trim().split('\n').slice(1).map(l=>l.split(',')).map(c=>({equipo:(c[1]||'').trim(),
    jj:Number(c[2])||0,jg:Number(c[3])||0,je:Number(c[4])||0,jp:Number(c[5])||0,gf:Number(c[6])||0,gc:Number(c[7])||0,dg:Number(c[8])||0,pts:Number(c[9])||0,rank:Number(c[10])||999}))
    .filter(r=>r.equipo&&r.equipo!=='Descansa');
  return f.length?f:null;
}
function aplicarTablaGeneral(){
  if(!EST)return;
  const por={};EST.forEach(r=>por[norm(r.equipo)]=r);
  teams.forEach(t=>{const r=por[norm(t.Nombre)];if(!r)return;const s=S[t.id];
    s.pj=r.jj;s.g=r.jg;s.e=r.je;s.p=r.jp;s.gf=r.gf;s.gc=r.gc;s.dg=r.dg;s.pts=r.pts;s.rank=r.rank});
  const pos=t=>S[t.id].rank!=null?S[t.id].rank:999;
  orden=[...orden].sort((a,b)=>pos(a)-pos(b));
}
function proximo(id){
  const hoy=new Date().setHours(0,0,0,0);
  return partidos.filter(p=>p.Estado!='Jugado'&&p.Fecha&&fecha(p.Fecha)>=hoy&&(p.Equipo_Local==id||p.Equipo_Visita==id))
    .sort((a,b)=>fecha(a.Fecha)-fecha(b.Fecha)||a.Hora.localeCompare(b.Hora))[0];
}

/* ---------- escena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<=760?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x85bfea);scene.fog=new THREE.Fog(0x9ac5dd,110,240);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.5,400);
scene.add(new THREE.HemisphereLight(0xbfe8c0,0x0a1d10,.9));
const sun=new THREE.DirectionalLight(0xfff4da,.95);sun.position.set(-25,50,20);sun.castShadow=true;
const shadowSize=innerWidth<=760?512:1024;sun.shadow.mapSize.set(shadowSize,shadowSize);Object.assign(sun.shadow.camera,{left:-45,right:45,top:35,bottom:-35,near:10,far:120});scene.add(sun);

const PW=74,PH=48.6;
function campoTex(){
  const K=1.5,c=document.createElement('canvas');c.width=1400*K;c.height=920*K;const x=c.getContext('2d');x.scale(K,K);
  for(let i=0;i<14;i++){const gr=x.createLinearGradient(0,0,0,920);const a1=i%2?'#2a7a2d':'#348a3a',a2=i%2?'#276f2a':'#30823a';gr.addColorStop(0,a1);gr.addColorStop(.5,a2);gr.addColorStop(1,a1);x.fillStyle=gr;x.fillRect(i*100,0,100,920)}
  let sd=7;const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let n=0;n<9000;n++){x.fillStyle=rr()<.5?'rgba(255,255,255,.05)':'rgba(0,30,0,.08)';x.fillRect(rr()*1400,rr()*920,1+rr()*2,3+rr()*7)}
  x.strokeStyle='rgba(255,255,255,.92)';x.fillStyle='rgba(255,255,255,.95)';x.lineWidth=5;x.lineJoin='round';const m=40;
  x.strokeRect(m,m,1320,840);x.beginPath();x.moveTo(700,m);x.lineTo(700,880);x.stroke();x.beginPath();x.arc(700,460,95,0,7);x.stroke();
  x.beginPath();x.arc(700,460,7,0,7);x.fill();
  [[m,1],[1360,-1]].forEach(([px,s])=>{x.strokeRect(s>0?px:px-230,250,230,420);x.strokeRect(s>0?px:px-95,360,95,200);

  elbow.rotation.x=-.18;codos.push(elbow);return shoulder;
 }
 const brazoI=brazo(-1),brazoD=brazo(1);
 // Cabeza: mandíbula, nariz, orejas, ojos discretos y cabello en varios estilos.
 const cabeza=new THREE.Group();cabeza.position.set(0,1.15,0);up.add(cabeza);
 const crane=new THREE.Mesh(geo('cabeza',()=>new THREE.SphereGeometry(1,22,16)),piel);crane.position.y=.04;crane.scale.set(.165,.215,.175);cabeza.add(crane);
 volumen(cabeza,piel,0,-.1,.02,.125,.115,.135);volumen(cabeza,piel,0,.01,.17,.027,.04,.04);

 volumen(cabeza,ojo,-.06,.075,.158,.017,.013,.012);volumen(cabeza,ojo,.06,.075,.158,.017,.013,.012);
 const cap=(sx,sy,sz,y,z,tl)=>{const m=new THREE.Mesh(geo('cap'+tl,()=>new THREE.SphereGeometry(1,18,10,0,Math.PI*2,0,tl)),pelo);m.position.set(0,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;cabeza.add(m)};
 if(estilo==0)cap(.172,.222,.182,.045,0,1.1);
 else if(estilo==1||estilo==2){cap(.18,.23,.19,.06,-.005,1.28);if(estilo==2){volumen(cabeza,pelo,0,-.05,-.11,.15,.21,.1);volumen(cabeza,pelo,-.14,-.02,-.04,.04,.15,.09);volumen(cabeza,pelo,.14,-.02,-.04,.04,.15,.09)}}
 else if(estilo==3){cap(.2,.235,.205,.085,-.01,1.38);}
 if(!pla){const badge=new THREE.Mesh(new THREE.PlaneGeometry(.115,.135),new THREE.MeshStandardMaterial({map:escudo,transparent:true,roughness:.8}));badge.position.set(-.16,.62,.2);up.add(badge);}
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:escudo,transparent:true,depthTest:false}));sp.scale.set(.95,.95,1);sp.position.y=3.25;sp.renderOrder=2;g.add(sp);
 const nom=placa(t.Nombre);nom.scale.set(3.6,.67,1);nom.position.y=4;nom.renderOrder=3;g.add(nom);
 const hit=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,4.4,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=2.1;g.add(hit);
 const groups=[];g.traverse(o=>{if(o.isGroup)groups.push(o)});groups.reverse().forEach(fusionarMallas);
 g.position.set((Math.random()-.5)*50,0,(Math.random()-.5)*30);scene.add(g);
 const j={t,g,piernaI,piernaD,brazoI,brazoD,cabeza,up,cy:1.15,bz:[-.16,.16],nom,rodillas,codos,fase:Math.random()*9,obj:null,espera:Math.random()*2,vel:.75+Math.random()*.45,sp};
 hit.userData.j=j;hits.push(hit);jugadores.push(j);

function nuevoDestino(j){j.obj=new THREE.Vector3((Math.random()-.5)*62,0,(Math.random()-.5)*38)}
const aro=new THREE.Mesh(new THREE.RingGeometry(1.4,1.8,48),new THREE.MeshBasicMaterial({color:0x5eb50d,transparent:true,opacity:.95,side:THREE.DoubleSide}));
aro.rotation.x=-Math.PI/2;aro.position.y=.08;aro.visible=false;scene.add(aro);
const balon=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));balon.castShadow=true;scene.add(balon);
let pase={de:null,a:null,k:1,t:0};

/* ---------- cámara y controles ---------- */
const cam={th:.6,ph:.95,d:78,obj:new THREE.Vector3(0,0,0)},goal={th:.6,ph:.95,d:78,obj:new THREE.Vector3()};
let idle=0,sel=null;
const ptr=new Map();let mov=0,pinch=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});mov=0;idle=0;if(ptr.size==2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;idle=0;
  if(ptr.size==2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptr.values()],n=Math.hypot(a.x-b.x,a.y-b.y);goal.d=Math.min(110,Math.max(9,goal.d*pinch/n));pinch=n;mov=99;return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;mov+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;
  goal.th-=dx*.006;goal.ph=Math.min(1.45,Math.max(.25,goal.ph-dy*.005))});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(mov<8&&!ptr.size)tocar(e.clientX,e.clientY)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();idle=0;goal.d=Math.min(110,Math.max(9,goal.d*(1+e.deltaY*.001)))},{passive:false});
const ray=new THREE.Raycaster();
function tocar(x,y){
  ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);
  const h=ray.intersectObjects(hits)[0];h?elegir(h.object.userData.j):elegir(null);
}

/* ---------- interfaz ---------- */
function elegir(j){
  sel=j;document.body.classList.toggle('sel',!!j);aro.visible=!!j;
  document.querySelectorAll('#lista li').forEach(li=>li.classList.toggle('on',!!j&&li.dataset.id==j.t.id));
  ajustarEncuadre();
  if(!j){goal.d=Math.max(goal.d,60);goal.obj.set(0,0,0);return}
  goal.d=12;goal.ph=1.1;
  const t=j.t,s=S[t.id],pos=orden.indexOf(t)+1;
  j.mood=pos==1&&s.p==0&&s.pj>0?'jubilo':pos<=8?'feliz':'triste';j.k=pos<=8?(9-pos)/8:0;
  const dg=s.dg!=null?s.dg:s.gf-s.gc,pr=proximo(t.ID_Equipo);
  const rival=pr?teams.find(e=>e.id==(pr.Equipo_Local==t.id?pr.Equipo_Visita:pr.Equipo_Local)):null;
  $('card').innerHTML=`<button id="x" aria-label="Cerrar">×</button>
   <div class="cab">${t.URL?`<img class="esc" src="${esc(t.URL)}" alt="">`:''}<div><h2>${esc(t.Nombre)}</h2><div class="desc">${esc(t.Descripción||'')}</div><div class="pos">Puesto ${pos} de ${teams.length} · ${j.mood=='jubilo'?'¡Líder invicto! 🏆':pos<=8?'Zona de liguilla':'Fuera de liguilla'}</div></div></div>
   <div class="pts"><b>${s.pts}</b><span>puntos</span></div>
   <div class="grid">${[['PJ',s.pj],['G',s.g],['E',s.e],['P',s.p],['GF',s.gf],['GC',s.gc],['DG',(dg>0?'+':'')+dg],['Efect.',s.pj?Math.round(s.pts/(s.pj*3)*100)+'%':'—']].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
   <div class="forma">Últimos:${s.forma.slice(-5).map(f=>`<i class="${f}">${f}</i>`).join('')||' sin partidos jugados'}</div>
   <div class="prox">${pr?`${rival&&rival.URL?`<img src="${esc(rival.URL)}" alt="">`:''}Próximo: <b>${esc(rival?rival.Nombre:'Por definir')}</b><br>${esc(pr.Fecha)}${pr.Hora?' · '+esc(pr.Hora.slice(0,-3)):''}${pr.Cancha?' · '+esc(pr.Cancha):''}`:'Sin próximo partido programado'}</div>
   ${t.Color_Playera?`<div class="prox"><img src="${esc(t.Color_Playera)}" alt="" style="height:70px"> Playera oficial</div>`:''}`;
  $('x').onclick=()=>elegir(null);
}
function lista(){
  $('lista').innerHTML=orden.map((t,i)=>`<li data-id="${t.id}" role="button" tabindex="0"><span class="n">${i+1}</span>${t.URL?`<img src="${esc(t.URL)}" alt="">`:'<span style="width:26px"></span>'}<b>${esc(t.Nombre)}</b><em>${S[t.id].pts}</em></li>`).join('');
  document.querySelectorAll('#lista li').forEach(li=>{li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();li.click()}};li.onclick=()=>{const j=jugadores.find(x=>x.t.id==li.dataset.id);if(j){elegir(j);document.body.classList.remove('tab')}};});
}
function vistaGeneral(){elegir(null);document.body.classList.remove('tab');goal.th=.6;goal.ph=.95;goal.d=78;goal.obj.set(0,0,0);idle=0;}
function zoomCamara(dir){goal.d=Math.min(110,Math.max(9,goal.d*(dir<0?.84:1.19)));idle=0;}
function ajustarEncuadre(){
 if(innerWidth<=760&&sel)camera.setViewOffset(innerWidth,innerHeight,0,Math.round(innerHeight*.16),innerWidth,innerHeight);
 else camera.clearViewOffset();

$('btnT').onclick=()=>document.body.classList.toggle('tab');
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;ajustarEncuadre()});

/* ---------- animación ---------- */
/* ánimo del equipo seleccionado según su puesto: 1.º invicto = jubiloso, 2.º-8.º = contento (liguilla), 9.º+ = cabizbajo */
function reposo(j){j.moodOn=false;j.g.position.y=0;j.brazoI.rotation.z=j.bz[0];j.brazoD.rotation.z=j.bz[1];j.cabeza.position.set(0,j.cy,0);j.up.rotation.x=0;j.up.rotation.z=0}
function animo(j,t,dt){
  j.moodOn=true;const m=j.mood,k=j.k,s=Math.sin(t*(m=='jubilo'?7:4)+j.fase),p=j.g.position;
  const giro=Math.atan2(camera.position.x-p.x,camera.position.z-p.z);let da=giro-j.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));j.g.rotation.y+=da*Math.min(1,dt*5);
  [j.piernaI,j.piernaD,j.brazoI,j.brazoD].forEach(b=>b.rotation.x*=.8);j.rodillas.forEach(k=>k.rotation.x*=.8);j.up.rotation.z*=.8;const kk=Math.min(1,dt*5);
  if(m=='triste'){j.brazoI.rotation.z=j.bz[0]*.5;j.brazoD.rotation.z=j.bz[1]*.5;p.y=0;j.cabeza.position.set(0,j.cy-.06,.06);j.up.rotation.x+=(.22-j.up.rotation.x)*kk;return}
  j.cabeza.position.set(0,j.cy,0);j.up.rotation.x+=((m=='jubilo'?-.12:-.03)-j.up.rotation.x)*kk;
  if(m=='jubilo'){j.brazoI.rotation.z=-2.55-s*.12;j.brazoD.rotation.z=2.55+s*.12;p.y=Math.abs(s)*.17}
  else{const a=(.35+1.45*k)*(.7+.3*s);j.brazoI.rotation.z=-a;j.brazoD.rotation.z=a;p.y=Math.abs(s)*(.025+.08*k)}
}
const reloj=new THREE.Clock();
function animar(){
  requestAnimationFrame(animar);
  const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  jugadores.forEach(j=>{
    const lento=j===sel?.35:1,p=j.g.position;
    if(j===sel&&j.mood){animo(j,t,dt);return}
    if(j.moodOn)reposo(j);
    if(j.espera>0){j.espera-=dt;j.fase+=dt*2;[j.piernaI,j.piernaD,j.brazoI,j.brazoD].forEach(m=>m.rotation.x*=.85);j.cabeza.position.y=j.cy+Math.sin(t*2+j.fase)*.008;j.rodillas.forEach(k=>k.rotation.x*=.85);j.up.rotation.x*=.9;j.up.rotation.z*=.9}
    else{
      if(!j.obj)nuevoDestino(j);
      const d=j.obj.clone().sub(p);d.y=0;const dist=d.length();
      if(dist<.6){j.obj=null;j.espera=1+Math.random()*3}
      else{d.normalize();
        jugadores.forEach(o=>{if(o!==j){const s=p.clone().sub(o.g.position);s.y=0;const l=s.length();if(l<3&&l>.01)d.add(s.multiplyScalar((3-l)/l*.5))}});
        d.normalize();
        const giro=Math.atan2(d.x,d.z);let da=giro-j.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));j.g.rotation.y+=da*Math.min(1,dt*6);
        const v=j.vel*lento*(reduce?.5:1);p.x=Math.max(-33,Math.min(33,p.x+d.x*v*dt*3));p.z=Math.max(-20.5,Math.min(20.5,p.z+d.z*v*dt*3));
        j.fase+=dt*v*7;const sw=Math.sin(j.fase)*.42;
        j.piernaI.rotation.x=sw;j.piernaD.rotation.x=-sw;j.brazoI.rotation.x=-sw*.8;j.brazoD.rotation.x=sw*.8;
        j.rodillas.forEach((k,i)=>k.rotation.x=Math.max(0,Math.sin(j.fase+(i?Math.PI:0)))*.65);
        j.codos.forEach(e=>e.rotation.x=-.22-Math.abs(sw)*.45);
        j.cabeza.position.y=j.cy+Math.abs(Math.cos(j.fase))*.025;j.up.rotation.x=.07;j.up.rotation.z=Math.sin(j.fase)*.03;
      }
    }
  });
  /* balón: pase de un jugador a otro */
  if(jugadores.length>1){
    if(pase.k>=1){pase.de=pase.a||jugadores[0];do{pase.a=jugadores[Math.floor(Math.random()*jugadores.length)]}while(pase.a===pase.de);pase.k=0;pase.t=1.4+Math.random()*1.6;pase.i=pase.de.g.position.clone()}
    pase.k=Math.min(1,pase.k+dt/pase.t);const dst=pase.a.g.position;
    balon.position.set(pase.i.x+(dst.x-pase.i.x)*pase.k,.17+Math.sin(pase.k*Math.PI)*2.2,pase.i.z+(dst.z-pase.i.z)*pase.k);balon.rotation.x+=dt*8;
  }
  if(sel){aro.position.x=sel.g.position.x;aro.position.z=sel.g.position.z;aro.scale.setScalar(1+Math.sin(t*4)*.08);goal.obj.copy(sel.g.position)}
  idle+=dt;if(!sel&&!reduce&&idle>3&&!ptr.size)goal.th+=dt*.08;
  const k=Math.min(1,dt*4);cam.th+=(goal.th-cam.th)*k;cam.ph+=(goal.ph-cam.ph)*k;cam.d+=(goal.d-cam.d)*k;cam.obj.lerp(goal.obj,k);
  camera.position.set(cam.obj.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.obj.y+cam.d*Math.cos(cam.ph)+1.5,cam.obj.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.obj.x,cam.obj.y+(sel?2:0),cam.obj.z);
  renderer.render(scene,camera);
}
