<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partidos - Next Level 7</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      background: #142702;
      font-family: 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-top {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 14px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-top a {
      display: inline-block;
      padding: 8px 22px;
      background: rgba(0,0,0,.75);
      border: 1px solid #5eb50d;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: .3s;
    }
    .nav-top a:hover {
      background: #5eb50d;
      color: black;
      box-shadow: 0 0 10px #5eb50d, 0 0 20px #5eb50d;
    }
    .nav-top a.nav-admin {
      padding: 8px 12px;
      font-size: 17px;
    }

    .editor-panel {
      background: rgba(0,0,0,0.88);
      border: 1px solid #7f5f0d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      width: 100%;
      max-width: 700px;
    }
    .editor-panel h3 {
      color: #5eb50d; font-size: 16px; letter-spacing: 2px;
      margin: 0 0 12px; text-transform: uppercase; font-family: 'Bebas Neue', sans-serif;
    }
    .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group.full { grid-column: 1 / -1; }
    .field-group label { color: #d5a610; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .field-group select {
      background: rgba(255,255,255,0.07); border: 1px solid #7f5f0d; border-radius: 6px;
      color: #fff; font-size: 14px; padding: 8px 10px; outline: none;
    }
    .field-group select option { background: #111; color: #fff; }
    .load-btn {
      background: linear-gradient(135deg, #7f5f0d, #d5a610); border: none; border-radius: 8px;
      color: #fff; cursor: pointer; font-size: 14px; font-weight: 700;
      letter-spacing: 2px; padding: 10px 16px; text-transform: uppercase; width: 100%;
      touch-action: manipulation;
    }
    .status-msg { color: #5eb50d; font-size: 12px; margin-top: 8px; min-height: 18px; text-align: center; }
    .dl-btn {
      background: linear-gradient(135deg, #d5a610, #ddc530); border: none; border-radius: 8px;
      color: #000; cursor: pointer; font-size: 14px; font-weight: 700;
      letter-spacing: 2px; padding: 12px 18px; text-transform: uppercase; width: 100%; margin-top: 10px;
      touch-action: manipulation;
    }
    .dl-btn-v2 {
      background: rgba(0,0,0,0.4); border: 1px solid #d5a610; border-radius: 8px;
      color: #ddc530; cursor: pointer; font-size: 13px; font-weight: 700;
      letter-spacing: 1.5px; padding: 10px 16px; text-transform: uppercase; width: 100%; margin-top: 8px;
      touch-action: manipulation; transition: .3s;
    }
    .dl-btn-v2:hover { background: rgba(213,166,16,0.15); }

    /* ===== STACKING CARDS ===== */
    .stack-container {
      width: 100%;
      max-width: 700px;
      position: relative;
      padding-bottom: 200px;
    }
    .stack-card {
      position: sticky;
      top: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .stack-card-inner {
      background: #000;
      background-image: url('fondotarjetas.png');
      background-size: cover;
      background-position: center;
      border: 5px solid rgba(94,181,13,0.5);
      border-radius: 18px;
      padding: 26px 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 0 1px rgba(94,181,13,0.1);
      min-height: 150px;
    }
    /* overlay oscuro para legibilidad */
    .stack-card-inner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 0;
      border-radius: 13px;
    }
    .stack-card-inner > * { position: relative; z-index: 1; }

    .stack-id-bg {
      position: absolute;
      top: -10px; right: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 110px;
      font-weight: 900;
      color: rgba(255,255,255,0.09);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .stack-top-row {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 2; margin-bottom: 18px;
      font-size: 13px; color: rgba(94,181,13,0.7); letter-spacing: 1px; font-weight: 700;
      text-transform: uppercase;
    }
    .stack-id-tag {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: rgba(255,255,255,0.8);
      letter-spacing: 1px;
    }
    .stack-teams {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      position: relative; z-index: 2;
    }
    .stack-team { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 115px; }
    .stack-team img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    .stack-team-name { font-size: 13px; font-weight: 700; color: #fff; text-align: center; text-transform: uppercase; line-height: 1.2; }
    .stack-score {
      font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: #ddc530;
      text-shadow: 0 0 12px rgba(94,181,13,0.5); min-width: 70px; text-align: center;
    }
    .stack-score.programado { font-size: 20px; color: rgba(255,255,255,0.4); }
    .stack-bottom-row {
      display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
      margin-top: 18px; position: relative; z-index: 2;
      font-size: 15px; color: #ddd;
    }
    .stack-badge {
      font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 14px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .stack-badge.normal { color: #5eb50d; border: 1px solid #5eb50d; }
    .stack-badge.penales { color: #ff4444; border: 1px solid #ff4444; }
    .stack-badge.default { color: #5eb50d; border: 1px solid #5eb50d; }
    .stack-badge.pendiente { color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.3); }
    .stack-jornada-tag { font-size: 15px; color: #5eb50d; font-weight: 700; }
    .stack-vuelta-tag { font-size: 13px; color: rgba(94,181,13,0.7); }

    .estado-programado { box-shadow: inset 0 0 60px rgba(41,166,255,0.08), 0 8px 30px rgba(0,0,0,0.6); }
    .estado-jugado { box-shadow: inset 0 0 60px rgba(255,150,0,0.08), 0 8px 30px rgba(0,0,0,0.6); }
    .estado-pendiente { box-shadow: inset 0 0 60px rgba(255,255,255,0.03), 0 8px 30px rgba(0,0,0,0.6); }

    .borde-normal { border-color: #5eb50d !important; box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 35px rgba(94,181,13,0.7), inset 0 0 25px rgba(94,181,13,0.15) !important; }
    .borde-penales { border-color: #ff4444 !important; box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 35px rgba(255,68,68,0.7), inset 0 0 25px rgba(255,68,68,0.15) !important; }
    .borde-default { border-color: #5eb50d !important; box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 35px rgba(94,181,13,0.7), inset 0 0 25px rgba(94,181,13,0.15) !important; }
    .borde-programado { border-color: #29a6ff !important; box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 35px rgba(41,166,255,0.7), inset 0 0 25px rgba(41,166,255,0.15) !important; }

    .empty-msg { text-align: center; color: rgba(255,255,255,0.3); font-size: 14px; padding: 40px; }

    /* ===== CONFIRMAR ASISTENCIA ===== */
    .stack-confirm { display:flex; gap:8px; margin-top:14px; position:relative; z-index:2; }
    .confirm-lado { flex:1; display:flex; flex-direction:column; gap:5px; }
    .confirm-lado input {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(94,181,13,0.4); border-radius: 6px;
      color: #fff; font-size: 12px; padding: 6px 8px; outline: none; width: 100%; box-sizing: border-box;
    }
    .confirm-lado button {
      background: rgba(94,181,13,0.15); border: 1px solid #5eb50d; border-radius: 6px;
      color: #5eb50d; font-size: 11px; font-weight: 700; padding: 6px 8px; cursor: pointer;
      text-transform: uppercase; letter-spacing: .5px; touch-action: manipulation;
    }
    .confirm-lado button:hover { background: rgba(94,181,13,0.3); }
    .confirm-ok {
      flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
      background: rgba(94,181,13,0.12); border: 1px solid #5eb50d; border-radius: 6px;
      color: #5eb50d; font-size: 12px; font-weight: 700; padding: 8px 6px;
    }

    @media (max-width: 600px) {
      .stack-team img { width: 70px; height: 70px; }
      .stack-team { width: 95px; }
      .stack-team-name { font-size: 11px; }
      .stack-score { font-size: 30px; }
      .stack-id-bg { font-size: 70px; top: -4px; right: 4px; }
      .stack-card-inner { padding: 20px 16px; }
      .stack-top-row { font-size: 11px; }
      .stack-id-tag { font-size: 18px; }
      .stack-bottom-row { font-size: 13px; gap: 12px; }
    }
  
.juego-numero{font-size:12px;color:#c8eaa5;margin-top:5px;line-height:1.4}.juego-detalle{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:12px;color:#ccd9c3;margin:8px 0}.stack-top-row{flex-wrap:wrap}.stack-team{min-width:0}.stack-team-name{overflow-wrap:anywhere}
@media(max-width:600px){.controls-row{display:flex;flex-wrap:wrap}.controls-row .field-group{flex:1 1 140px;min-width:0}.stack-teams{gap:8px}.stack-team img{max-width:85px}.stack-team-name{font-size:14px}.juego-numero{font-size:11px}.stack-bottom-row{flex-wrap:wrap;gap:8px}}

.juego-resumen{padding:14px 16px;background:#142c20;border:1px solid #4c713a;border-radius:12px;color:#e4f2dc;font-size:13px;line-height:1.7;margin-bottom:16px}
#stackContainer .stack-top-row{gap:10px;justify-content:space-between;letter-spacing:1px}
#stackContainer .stack-vuelta-tag{color:#b9df8a;font-size:13px}
#stackContainer .juego-numero{text-align:center;color:#dfedcd;font-size:12px;line-height:1.4;margin-top:2px}
#stackContainer .juego-detalle{line-height:1.5;text-align:center}
@media(max-width:600px){
 #stackContainer .stack-card-inner{padding:18px 14px}
 #stackContainer .stack-teams{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:8px;align-items:center}
 #stackContainer .stack-team{width:100%;gap:5px}
 #stackContainer .stack-team img{width:72px;height:72px;max-width:100%}
 #stackContainer .stack-score{font-size:32px;min-width:0}
 #stackContainer .stack-team-name{font-size:13px;text-align:center}
 #stackContainer .stack-bottom-row{font-size:13px;gap:8px;margin-top:14px}
 #stackContainer .confirm-lado{min-width:0}#stackContainer .confirm-lado input{font-size:16px;min-height:44px}#stackContainer .confirm-lado button{min-height:44px;font-size:11px;letter-spacing:0}
}

.nav-partidos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:20px}
.nav-partidos a,.nav-partidos a.nav-admin{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 8px;border:1px solid #405b2e;border-radius:12px;background:#101f17;color:#e0edcf;font-size:13px;line-height:1.25;text-align:center;transition:background .18s,border-color .18s}
.nav-partidos a svg{width:21px;height:21px;flex:none;color:#ade36f}
.nav-partidos a:hover{background:#203b24;color:#fff;border-color:#a4dc67;box-shadow:none}
.nav-partidos a:focus-visible{outline:2px solid #ddc530;outline-offset:3px}
@media(max-width:600px){.nav-partidos{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-partidos a,.nav-partidos a.nav-admin{font-size:13px;min-height:48px}}
@media(max-width:600px){.nav-partidos a:last-child{grid-column:1 / -1}}
</style>
</head>
<body>
  <nav class="nav-top nav-partidos" aria-label="Navegación de Partidos">

    <a href="partidos3d.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg><span>Modo 3D</span></a>

  </nav>

  <div class="editor-panel">
    <h3>⚽ Partidos — Next Level 7</h3>

    <div class="controls-row">
      <div class="field-group">
        <label>Filtrar por</label>
        <select id="filterTipo" onchange="cambiarFiltro()">
          <option value="fecha">Por Fecha</option>
          <option value="equipo">Por Equipo</option>
        </select>
      </div>
      <div class="field-group" id="groupFecha">
        <label>Fecha</label>
        <select id="filterFecha"><option value="">— Cargando... —</option></select>
      </div>
      <div class="field-group" id="groupEquipo" style="display:none">
        <label>Equipo</label>
        <select id="filterEquipo"><option value="">— Cargando... —</option></select>
      </div>
      <div class="field-group full">
        <button class="load-btn" onclick="cargarDatos()">🔄 Cargar Datos</button>
      </div>
    </div>
    <div class="status-msg" id="statusMsg">Selecciona fecha o equipo y presiona Cargar Datos</div>
  </div>

  <div class="stack-container" id="stackContainer">
    <div class="empty-msg">CARGA LOS DATOS PARA VER LOS PARTIDOS</div>
  </div>

  <script src="juegos-control.js?v=20261031-cupo15"></script>
  <script src="partidos.js?v=20261031-cupo15"></script>
</body>
</html>
