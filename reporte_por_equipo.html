<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#142702;color:#eef7e6;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:14px;display:flex;flex-direction:column;align-items:center}

.panel{width:100%;max-width:960px;background:rgba(0,0,0,.75);border:1px solid #5eb50d55;border-radius:14px;padding:16px;margin-bottom:16px}

/* ===== DOCUMENTO (PNG / impresión) ===== */
.rq-doc{background:#fff;color:#1f2933;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative}
.rq-doc *{box-sizing:border-box}
.rq-head{background:#1d3d05;color:#fff;padding:20px 32px 18px;border-bottom:6px solid #5eb50d;display:flex;justify-content:space-between;align-items:center;gap:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.rq-kpi.r{border-top-color:#d64545}.rq-kpi.r b{color:#c0392b}
.rq-situacion{border:1px solid #cfd8c5;border-left:6px solid #5eb50d;border-radius:6px;padding:12px 16px;margin-bottom:18px;background:#f9faf6;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.rq-pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-pill.v{background:#e3f4e6;color:#1b6e2e;border:1px solid #a9d9b3}
.rq-pill.r{background:#fde8e8;color:#b42318;border:1px solid #f5b5b5}
.rq-pill.a{background:#fff4d6;color:#8a6100;border:1px solid #f0d58a}
.rq-pill.b{background:#e5effa;color:#1e4e8c;border:1px solid #aac6e8}
.rq-pill.g{background:#eef0f3;color:#4b5563;border:1px solid #cfd4db}
.rq-pill.p{background:#f0e9fa;color:#5b3a99;border:1px solid #cdbbe8}
.rq-tabla{width:100%;border-collapse:collapse;font-size:13px}
.rq-tabla thead{display:table-header-group}

.rq-marc{font-size:16px;font-weight:800}
.rq-leyenda{margin:16px 0 0;padding:12px 14px;border:1px solid #cfd8c5;border-radius:6px;font-size:11.5px;color:#4b5563;line-height:1.55;background:#fafbf8}
.rq-leyenda b{color:#1d3d05}
.rq-pie{display:flex;justify-content:space-between;gap:20px;margin-top:18px;padding:10px 32px;border-top:1px solid #cfd8c5;font-size:10.5px;color:#6b7280}
.rq-mx td.cel{font-size:17px;font-weight:800;width:46px;padding:6px 2px}
.rq-mx td.eq{text-align:left}
.rq-mx td.eq .rq-rival span{font-size:12px}
.rq-sim{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#374151;margin-top:12px}
.rq-sim span b{display:inline-block;min-width:22px;text-align:center;font-size:15px}
</style>

<body>
<div class="nav"><a href="index.html">← Inicio</a></div>

<div class="panel">
  <h2>📋 Reporte por equipo</h2>
  <div class="fila">
    <label class="campo"><span>Tipo de reporte</span>
      <select id="tipo" onchange="cambiarTipo()">
        <option value="equipo">Por equipo</option>
        <option value="general">Control general (todos los equipos)</option>
      </select></label>
    <label class="campo" id="campo-equipo"><span>Equipo</span>
      <select id="sel-equipo"><option value="">Cargando equipos...</option></select></label>
  </div>
  <div class="fila">
    <button class="btn" onclick="ver()">👁️ Ver reporte</button>
    <button class="btn pri" onclick="descargar()">📥 Descargar PNG</button>
    <button class="btn" onclick="imprimir()">🖨️ Imprimir</button>
  </div>
  <div id="msg">Cargando datos...</div>
</div>
<div id="vista-wrap" hidden><div id="vista"></div></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIGURACIÓN
// ═══════════════════════════════════════════════
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub';
const URL_EQUIPOS  = `${PUB}?gid=1894947293&single=true&output=csv`;
const URL_PARTIDOS = `${PUB}?gid=1362473459&single=true&output=csv`;
// El torneo comenzó el domingo 20/09/2026 = Fecha 1 = Jornada 1. Cada domingo avanza una fecha.
const FECHA_INICIO = '20/09/2026';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2 = n => String(n).padStart(2, '0');
const DIA_MS = 86400000;
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let EQUIPOS = [], PARTIDOS = [];

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ','){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const [cab, ...resto] = rows;
  return resto.filter(r => r.some(c => c.trim())).map(r => { const o = {}; cab.forEach((h, i) => o[h.trim()] = (r[i] || '').trim()); return o; });
}
function parseFecha(f){
  const p = String(f || '').trim().split('/').map(x => parseInt(x, 10));
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[2], p[1] - 1, p[0], 12);
}
const fmt = d => d ? `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}` : '—';
const inicio = () => parseFecha(FECHA_INICIO);
// número de fecha (domingo) al que pertenece una fecha calendario
const fechaNum = d => d ? Math.floor(Math.round((d - inicio()) / DIA_MS) / 7) + 1 : null;
const fechaDeJornada = j => new Date(inicio().getTime() + (j - 1) * 7 * DIA_MS);
function hora12(h){
  const m = String(h || '').match(/(\d+):(\d+)/); if (!m) return '';
  let H = parseInt(m[1], 10); const ap = H >= 12 ? 'pm' : 'am'; H = H % 12 || 12; return `${H}:${m[2]} ${ap}`;
}
const esBaja = e => (e['Status'] || '').trim().toLowerCase() === 'baja';
const idDe = e => String(e['ID_Equipo']).trim();

// ═══════════════════════════════════════════════
//  CARGA
// ═══════════════════════════════════════════════
async function init(){
  try {
    const [te, tp] = await Promise.all([ fetch(URL_EQUIPOS).then(r => r.text()), fetch(URL_PARTIDOS).then(r => r.text()) ]);
    EQUIPOS = parseCSV(te).filter(e => idDe(e)); PARTIDOS = parseCSV(tp).filter(p => p['Equipo_Local'] && p['Equipo_Visita']);   // incluye pendientes aunque no tengan jornada
    const ord = [...EQUIPOS].sort((a, b) => a['Nombre'].localeCompare(b['Nombre'], 'es'));
    $('sel-equipo').innerHTML = '<option value="">— Selecciona un equipo —</option>' + ord.map(e => `<option value="${esc(idDe(e))}">${esc(e['Nombre'])}${esBaja(e) ? ' (baja)' : ''}</option>`).join('');
    msg('Elige un equipo y presiona "Ver reporte".');
  } catch (e){ $('sel-equipo').innerHTML = '<option value="">No se pudieron cargar los datos</option>'; msg('No se pudieron cargar los datos. Revisa tu conexión.', true); }
}
function msg(t, err){ $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function cambiarTipo(){ $('campo-equipo').style.display = $('tipo').value === 'equipo' ? '' : 'none'; }

// ═══════════════════════════════════════════════
//  ANÁLISIS: jornadas vs fechas
// ═══════════════════════════════════════════════
const estadoDe = p => (p['Estado'] || '').trim().toLowerCase();

// Resultado visto desde el equipo idE
function resultado(p, idE){
  const local = String(p['Equipo_Local']).trim() === idE;
  const gl = parseInt(p['Goles_Local'], 10), gv = parseInt(p['Goles_Visita'], 10);
  const gf = local ? gl : gv, gc = local ? gv : gl;
  const gp = (p['Ganado_Por'] || '').trim().toLowerCase();
  const tipo = gp === 'penales' ? 'penales' : gp === 'default' ? 'default' : 'normal';
  const res = (isNaN(gf) || isNaN(gc)) ? 'e' : gf > gc ? 'g' : gf < gc ? 'p' : 'e';
  // Si terminó empatado y se definió en penales: sigue siendo EMPATE; los penales son el desempate (ganó / perdió).
  let pen = null;
  if (tipo === 'penales' && res === 'e'){ const w = String(p['Penales'] || '').trim(); if (w) pen = (w === idE) ? 'g' : 'p'; }
  return { gf, gc, tipo, res, pen, rival: local ? String(p['Equipo_Visita']).trim() : String(p['Equipo_Local']).trim() };
}

function contexto(){
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  const jugados = PARTIDOS.filter(p => estadoDe(p) === 'jugado');
  const J = jugados.length ? Math.max(...jugados.map(p => Number(p['Jornada']))) : 0;   // jornada más avanzada ya jugada en la liga
  return { hoy, J, fechaHoy: Math.max(0, fechaNum(hoy)) };
}

// Una fila por jornada para el equipo
function analizarEquipo(idE){
  const { hoy, J } = contexto();
  const suyos = PARTIDOS.filter(p => String(p['Equipo_Local']).trim() === idE || String(p['Equipo_Visita']).trim() === idE);
  const maxJ = Math.max(J, ...suyos.map(p => Number(p['Jornada'])).filter(n => !isNaN(n)), 0);
  const filas = [];
  for (let j = 1; j <= maxJ; j++){
    const esperada = fechaDeJornada(j);
    const p = suyos.find(x => Number(x['Jornada']) === j);
    const fila = { j, esperada, fEsp: j };
    if (!p){ fila.tipo = 'descanso'; filas.push(fila); continue; }
    const d = parseFecha(p['Fecha']);
    fila.p = p; fila.fecha = d; fila.fReal = fechaNum(d);
    if (estadoDe(p) === 'jugado'){
      fila.tipo = 'jugado'; fila.r = resultado(p, idE);
      fila.control = fila.fReal == null ? 'sinfecha' : j === fila.fReal ? 'tiempo' : j > fila.fReal ? 'adelanto' : 'atrasada';
    } else {
      const vencido = d ? d < hoy && fmt(d) !== fmt(hoy) : j <= J;
      fila.tipo = vencido ? 'debe' : (d ? 'programado' : 'pendiente');
    }
    filas.push(fila);
  }
  return filas;
}
// Todos los partidos del equipo que aún no se juegan, tengan o no jornada asignada.
function pendientesEquipo(idE){
  const { hoy, J } = contexto();
  return PARTIDOS.filter(p => (String(p['Equipo_Local']).trim() === idE || String(p['Equipo_Visita']).trim() === idE)
      && estadoDe(p) !== 'jugado' && !estadoDe(p).includes('cancel'))
    .map(p => {
      const j = parseInt(p['Jornada'], 10), d = parseFecha(p['Fecha']);
      let tipo;
      if (d) tipo = (d < hoy && fmt(d) !== fmt(hoy)) ? 'debe' : 'programado';
      else tipo = (!isNaN(j) && j <= J) ? 'debe' : 'pendiente';
      return { p, j: isNaN(j) ? null : j, fecha: d, tipo, rival: resultado(p, idE).rival };
    })
    .sort((a, b) => (a.fecha ? a.fecha.getTime() : 9e15) - (b.fecha ? b.fecha.getTime() : 9e15) || (a.j == null) - (b.j == null) || (a.j || 0) - (b.j || 0));
}

function resumen(filas){
  const jug = filas.filter(f => f.tipo === 'jugado');
  const c = k => jug.filter(f => f.r.res === k).length;
  return {
    jugados: jug.length, g: c('g'), e: c('e'), p: c('p'),
    penG: jug.filter(f => f.r.pen === 'g').length, penP: jug.filter(f => f.r.pen === 'p').length,
    gf: jug.reduce((s, f) => s + (isNaN(f.r.gf) ? 0 : f.r.gf), 0), gc: jug.reduce((s, f) => s + (isNaN(f.r.gc) ? 0 : f.r.gc), 0),
    debe: filas.filter(f => f.tipo === 'debe'), adelanto: jug.filter(f => f.control === 'adelanto'),
    atrasada: jug.filter(f => f.control === 'atrasada'), descansos: filas.filter(f => f.tipo === 'descanso'),
    proximo: filas.find(f => f.tipo === 'programado')
  };
}
const lista = arr => arr.length === 1 ? 'la jornada ' + arr[0] : 'las jornadas ' + arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];

// ═══════════════════════════════════════════════
//  DOCUMENTOS
// ═══════════════════════════════════════════════
const ahoraTxt = () => { const a = new Date(); return `${p2(a.getDate())}/${p2(a.getMonth() + 1)}/${a.getFullYear()} ${p2(a.getHours())}:${p2(a.getMinutes())}`; };
function encabezado(titulo, sub){
  const { hoy, fechaHoy } = contexto();
  return `<div class="rq-head">
    <div><div class="rq-liga">Liga Next Level 7 · Torneo Dominical</div><div class="rq-titulo">${esc(titulo)}</div><div class="rq-sub">${sub}</div></div>
    <div class="rq-der"><div class="rq-logos"><img src="logo-liga.png.png" alt="" onerror="this.style.display='none'"><img src="laregionallstars.png" alt="" onerror="this.style.display='none'"></div>
      <div>Torneo iniciado el <b>${esc(FECHA_INICIO)}</b><br>Hoy: Fecha ${fechaHoy || '—'} · Emitido ${ahoraTxt()}</div></div></div>`;
}
const PILL = {
  tiempo: ['v', 'EN TIEMPO'], adelanto: ['b', 'ADELANTÓ'], atrasada: ['p', 'PAGÓ ATRASADA'], debe: ['r', 'DEBE'],
  descanso: ['g', 'DESCANSO'], programado: ['a', 'PROGRAMADO'], pendiente: ['a', 'PENDIENTE'], sinfecha: ['g', 'SIN FECHA']
};
const RES = { g: ['v', 'GANÓ'], p: ['r', 'PERDIÓ'], e: ['a', 'EMPATÓ'] };
const TIPO = { normal: 'Normal', default: 'Default', penales: 'Penales' };

function docEquipo(idE){
  const eq = EQUIPOS.find(e => idDe(e) === idE) || {};
  const mapa = {}; EQUIPOS.forEach(e => mapa[idDe(e)] = e);
  const filas = analizarEquipo(idE), r = resumen(filas), { fechaHoy } = contexto();

  // Situación general
  let clase = '', chips = '', textos = [];
  if (r.debe.length){
    clase = 'debe'; chips += `<span class="rq-pill r">DEBE ${r.debe.length > 1 ? 'JORNADAS' : 'JORNADA'} ${r.debe.map(f => f.j).join(', ')}</span>`;
    textos.push(`Tiene pendiente ${lista(r.debe.map(f => f.j))}: el partido estaba en el rol, ya pasó su fecha y no se ha jugado.`);
  }
  if (r.adelanto.length){
    if (!clase) clase = 'adel';
    chips += `<span class="rq-pill b">ADELANTÓ ${r.adelanto.length > 1 ? 'JORNADAS' : 'JORNADA'} ${r.adelanto.map(f => f.j).join(', ')}</span>`;
    textos.push(r.adelanto.map(f => `Jugó la jornada ${f.j} en la fecha ${f.fReal} (${fmt(f.fecha)}), antes de que le correspondiera (${fmt(f.esperada)}).`).join(' '));
  }
  if (r.atrasada.length){
    chips += `<span class="rq-pill p">PAGÓ ATRASADA ${r.atrasada.length > 1 ? 'JORNADAS' : 'JORNADA'} ${r.atrasada.map(f => f.j).join(', ')}</span>`;
    textos.push(r.atrasada.map(f => `La jornada ${f.j} le correspondía el ${fmt(f.esperada)} y la jugó hasta el ${fmt(f.fecha)} (fecha ${f.fReal}).`).join(' '));
  }
  if (!r.debe.length && !r.adelanto.length){
    chips = '<span class="rq-pill v">AL CORRIENTE</span>';
    textos.push('Ha jugado o descansado todas las jornadas que le corresponden hasta hoy.');
  } else if (!r.debe.length){
    chips = '<span class="rq-pill v">SIN ADEUDOS</span>' + chips;
  }
  if (r.descansos.length) textos.push(`Descansó en ${lista(r.descansos.map(f => f.j))} (no tiene partido en el rol).`);
  const porJugar = pendientesEquipo(idE), sinJornada = porJugar.filter(x => x.j == null).length;
  if (porJugar.length) textos.push(`<b>Por jugar:</b> le faltan ${porJugar.length} partido(s)${sinJornada ? ' (' + sinJornada + ' sin jornada asignada todavía)' : ''}; el detalle está más abajo.`);
  if (r.proximo){
    const p = r.proximo.p, riv = mapa[resultado(p, idE).rival] || {};
    textos.push(`<b>Próximo partido:</b> jornada ${r.proximo.j}${r.proximo.fecha ? ' · ' + fmt(r.proximo.fecha) + ' (' + DIAS[r.proximo.fecha.getDay()] + ')' : ''}${hora12(p['Hora']) ? ' · ' + hora12(p['Hora']) : ''}${p['Cancha'] ? ' · ' + esc(p['Cancha']) : ''} vs ${esc(riv['Nombre'] || 'por definir')}.`);
  }

  const cuerpoFilas = filas.map(f => {
    const esp = `<b>F${f.fEsp}</b><small>${fmt(f.esperada)}</small>`;
    if (f.tipo === 'descanso') return `<tr class="fila-desc"><td class="j">J${f.j}</td><td>${esp}</td><td colspan="5" style="text-align:left;padding-left:14px">Sin partido en el rol (descanso)</td><td><span class="rq-pill g">DESCANSO</span></td></tr>`;
    const p = f.p, rv = mapa[(f.r ? f.r.rival : resultado(p, idE).rival)] || {};
    const rival = `<div class="rq-rival"><img src="${esc(rv['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(rv['Nombre'] || 'Equipo ' + (f.r ? f.r.rival : ''))}</span></div>`;
    const real = f.fecha ? `<b>${fmt(f.fecha)}</b><small>${DIAS[f.fecha.getDay()]} · F${f.fReal}${hora12(p['Hora']) && f.tipo !== 'jugado' ? ' · ' + hora12(p['Hora']) : ''}</small>` : '—';
    if (f.tipo === 'jugado'){
      const m = (isNaN(f.r.gf) || isNaN(f.r.gc)) ? '—' : `${f.r.gf} - ${f.r.gc}`;
      return `<tr><td class="j">J${f.j}</td><td>${esp}</td><td>${real}</td><td>${rival}</td><td class="rq-marc">${m}</td>
        <td><span class="rq-pill ${RES[f.r.res][0]}">${RES[f.r.res][1]}</span>${f.r.pen ? `<small style="display:block;margin-top:3px;font-weight:700;color:${f.r.pen === 'g' ? '#1b6e2e' : '#b42318'}">${f.r.pen === 'g' ? 'Ganó' : 'Perdió'} en penales</small>` : ''}</td><td>${TIPO[f.r.tipo]}</td>
        <td><span class="rq-pill ${PILL[f.control][0]}">${PILL[f.control][1]}</span></td></tr>`;
    }
    return `<tr class="${f.tipo === 'debe' ? 'fila-debe' : ''}"><td class="j">J${f.j}</td><td>${esp}</td><td>${real}</td><td>${rival}</td>
      <td>—</td><td>—</td><td>—</td><td><span class="rq-pill ${PILL[f.tipo][0]}">${PILL[f.tipo][1]}</span></td></tr>`;
  }).join('');

  const kpis = [
    ['', r.jugados, 'Jugados'], ['v', r.g, 'Ganados'], ['a', r.e, 'Empatados'], ['r', r.p, 'Perdidos'], ['', r.gf, 'Goles a favor'], ['', r.gc, 'Goles en contra']
  ].map(([c, v, t]) => `<div class="rq-kpi ${c}"><b>${v}</b><span>${t}</span>${t === 'Empatados' && (r.penG || r.penP) ? `<small style="display:block;font-size:10px;color:#6b7280;margin-top:2px">${r.penG} ganó · ${r.penP} perdió en pen.</small>` : ''}</div>`).join('');

  const filasPend = porJugar.map(x => {
    const rv = mapa[x.rival] || {}, p = x.p;
    const fh = x.fecha ? `<b>${fmt(x.fecha)}</b><small>${DIAS[x.fecha.getDay()]} · F${fechaNum(x.fecha)}${hora12(p['Hora']) ? ' · ' + hora12(p['Hora']) : ''}</small>` : '<b>Por definir</b>';
    const k = PILL[x.tipo];
    return `<tr class="${x.tipo === 'debe' ? 'fila-debe' : ''}"><td class="j">${x.j != null ? 'J' + x.j : '—'}${x.j == null ? '<small>sin jornada</small>' : ''}</td><td>${fh}</td><td>${esc(p['Cancha'] || '—')}</td>
      <td><div class="rq-rival"><img src="${esc(rv['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(rv['Nombre'] || 'Equipo ' + x.rival)}</span></div></td>
      <td><span class="rq-pill ${k[0]}">${k[1]}</span></td></tr>`;
  }).join('');
  const seccionPend = `<div style="margin-top:20px"><div style="font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#1d3d05;font-weight:800;margin-bottom:6px">Juegos por jugar (${porJugar.length})</div>` +
    (porJugar.length
      ? `<table class="rq-tabla"><thead><tr><th style="width:84px">Jornada</th><th style="width:130px">Fecha y hora</th><th style="width:76px">Campo</th><th>Rival</th><th style="width:118px">Estado</th></tr></thead><tbody>${filasPend}</tbody></table>`
      : '<div style="padding:10px 14px;border:1px solid #a9d9b3;background:#e3f4e6;border-radius:6px;color:#1b6e2e;font-weight:700;font-size:13px">✔ No tiene juegos pendientes por jugar.</div>') + '</div>';

  return `<div class="rq-doc" style="width:900px">
    ${encabezado('Reporte de equipo', `Jornadas, fechas y resultados${eq['Descripción'] ? ' · ' + esc(eq['Descripción']) : ''}`)}
    <div class="rq-body">
      <div class="rq-equipo"><img src="${esc(eq['URL'] || '')}" onerror="this.style.opacity='.15'"><div><h1>${esc(eq['Nombre'] || '')}</h1><small>${esBaja(eq) ? 'Equipo dado de baja' : 'Equipo activo'} · ${r.jugados} partido(s) jugado(s)</small></div></div>
      <div class="rq-kpis">${kpis}</div>
      <div class="rq-situacion ${clase}"><div class="chips">${chips}</div>${textos.map(t => `<p>${t}</p>`).join('')}</div>
      <table class="rq-tabla"><thead><tr><th style="width:42px">Jor.</th><th style="width:96px">Le correspondía</th><th style="width:100px">Se jugó</th><th>Rival</th><th style="width:70px">Marcador</th><th style="width:112px">Resultado</th><th style="width:62px">Tipo</th><th style="width:118px">Control</th></tr></thead><tbody>${cuerpoFilas}</tbody></table>
      ${seccionPend}
      <div class="rq-leyenda"><b>Cómo se lee:</b> el torneo comenzó el ${esc(FECHA_INICIO)} (Fecha 1 = Jornada 1) y cada domingo avanza una fecha; la jornada N corresponde a la fecha N. <b>En tiempo</b>: jornada = fecha. <b>Adelantó</b>: jugó una jornada mayor a la fecha. <b>Pagó atrasada</b>: jugó una jornada menor a la fecha. <b>Debe</b>: el partido estaba en el rol, su fecha ya pasó y no se jugó. <b>Descanso</b>: sin partido en el rol esa jornada. <b>Pendiente</b>: partido por jugar sin fecha asignada (puede no tener jornada todavía). Un partido que termina empatado y se define en penales cuenta como <b>empate</b>; los penales se muestran debajo como desempate (ganó o perdió en penales). Default = victoria por incomparecencia.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

function docGeneral(){
  const activos = EQUIPOS.filter(e => !esBaja(e)).sort((a, b) => a['Nombre'].localeCompare(b['Nombre'], 'es'));
  const { J } = contexto();
  const datos = activos.map(e => { const f = analizarEquipo(idDe(e)); return { e, f, r: resumen(f) }; });
  const maxJ = Math.max(J, ...datos.map(d => d.f.length), 1);
  const SIM = { tiempo: ['✔', '#1f7a35'], adelanto: ['⏩', '#1e4e8c'], atrasada: ['↩', '#5b3a99'], debe: ['✖', '#c0392b'], descanso: ['–', '#9ca3af'], programado: ['○', '#a87500'], sinfecha: ['?', '#9ca3af'] };
  const cab = Array.from({ length: maxJ }, (_, i) => `<th>J${i + 1}<small style="display:block;font-size:9px;color:#6b7280;font-weight:500">${p2(fechaDeJornada(i + 1).getDate())}/${p2(fechaDeJornada(i + 1).getMonth() + 1)}</small></th>`).join('');
  const filas = datos.map(({ e, f, r }) => {
    const celdas = Array.from({ length: maxJ }, (_, i) => {
      const x = f.find(y => y.j === i + 1); if (!x) return '<td class="cel" style="color:#d1d5db">·</td>';
      const k = x.tipo === 'jugado' ? x.control : x.tipo; const [s, c] = SIM[k] || ['?', '#999'];
      return `<td class="cel" style="color:${c}">${s}</td>`;
    }).join('');
    const est = r.debe.length ? `<span class="rq-pill r">DEBE ${r.debe.map(x => 'J' + x.j).join(', ')}</span>` : r.adelanto.length ? `<span class="rq-pill b">ADELANTADO</span>` : '<span class="rq-pill v">AL CORRIENTE</span>';
    return `<tr><td class="eq"><div class="rq-rival"><img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(e['Nombre'])}</span></div></td>${celdas}<td><b>${r.jugados}</b></td><td>${r.g}-${r.e}-${r.p}</td><td><b>${pendientesEquipo(idDe(e)).length}</b></td><td>${est}</td></tr>`;
  }).join('');
  const nDebe = datos.filter(d => d.r.debe.length).length, nAdel = datos.filter(d => !d.r.debe.length && d.r.adelanto.length).length, nOk = datos.length - nDebe - nAdel;
  const kpis = [['', datos.length, 'Equipos activos'], ['v', nOk, 'Al corriente'], ['', nAdel, 'Adelantados'], ['r', nDebe, 'Con adeudos']].map(([c, v, t]) => `<div class="rq-kpi ${c}" style="flex:1"><b>${v}</b><span>${t}</span></div>`).join('');
  const ancho = Math.max(900, 250 + maxJ * 50 + 390);
  return `<div class="rq-doc" style="width:${ancho}px">
    ${encabezado('Control de jornadas por equipo', 'Quién va al corriente, quién adelantó y quién debe')}
    <div class="rq-body">
      <div style="display:flex;gap:10px;margin-bottom:16px">${kpis}</div>
      <table class="rq-tabla rq-mx"><thead><tr><th style="text-align:left;padding-left:14px">Equipo</th>${cab}<th style="width:50px">PJ</th><th style="width:70px">G-E-P</th><th style="width:62px">Por jugar</th><th style="width:130px">Situación</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="rq-sim"><span><b style="color:#1f7a35">✔</b> En tiempo</span><span><b style="color:#1e4e8c">⏩</b> Adelantó</span><span><b style="color:#5b3a99">↩</b> Pagó atrasada</span><span><b style="color:#c0392b">✖</b> Debe</span><span><b style="color:#9ca3af">–</b> Descanso</span><span><b style="color:#a87500">○</b> Programado</span></div>
      <div class="rq-leyenda"><b>Cómo se lee:</b> el torneo comenzó el ${esc(FECHA_INICIO)} (Fecha 1 = Jornada 1) y cada domingo avanza una fecha; bajo cada jornada aparece el domingo que le corresponde. Los equipos dados de baja no se incluyen. PJ = partidos jugados; G-E-P = ganados, empatados y perdidos; Por jugar = partidos que le faltan (con o sin jornada asignada).</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

// ═══════════════════════════════════════════════
//  SALIDAS: vista, PNG e impresión
// ═══════════════════════════════════════════════
function construir(){
  if (!PARTIDOS.length){ msg('Todavía no cargan los datos.', true); return null; }
  if ($('tipo').value === 'general') return { html: docGeneral(), nombre: 'control_jornadas' };
  const id = $('sel-equipo').value; if (!id){ msg('Selecciona un equipo primero.', true); return null; }
  const eq = EQUIPOS.find(e => idDe(e) === id);
  return { html: docEquipo(id), nombre: 'reporte_' + (eq['Nombre'] || id).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').toLowerCase() };
}
function ver(){
  const r = construir(); if (!r) return; msg('');
  const wrap = $('vista-wrap'), v = $('vista'); wrap.hidden = false; v.innerHTML = r.html;
  const doc = v.firstElementChild, ancho = parseInt(doc.style.width, 10) || 900, k = Math.min(1, wrap.clientWidth / ancho);
  doc.style.transform = `scale(${k})`; doc.style.transformOrigin = 'top left'; wrap.style.height = (doc.offsetHeight * k) + 'px';
}
async function descargar(){
  const r = construir(); if (!r) return; msg('Generando PNG...');
  const t = document.createElement('div'); t.style.cssText = 'position:fixed;left:-99999px;top:0'; t.innerHTML = r.html; document.body.appendChild(t);
  try {
    const doc = t.firstElementChild;
    await Promise.all([...doc.querySelectorAll('img')].map(i => i.complete ? 1 : new Promise(x => { i.onload = i.onerror = x; })));
    await new Promise(x => setTimeout(x, 150));
    const canvas = await html2canvas(doc, { backgroundColor: '#ffffff', scale: 2, useCORS: true, allowTaint: true, imageTimeout: 20000, logging: false });
    const a = document.createElement('a'); a.download = r.nombre + '.png'; a.href = canvas.toDataURL('image/png'); a.click(); msg('✅ PNG generado.');
  } catch (e){ console.error(e); msg('No se pudo generar el PNG.', true); }
  finally { document.body.removeChild(t); }
}
async function imprimir(){
  const r = construir(); if (!r) return; msg('');
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentWindow.document; d.open();
  d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(r.nombre)}</title><style>${css}@page{size:letter;margin:8mm}html,body{background:#fff!important;padding:0;display:block}.rq-doc{width:auto!important}</style></head><body>${r.html}</body></html>`); d.close();
  await Promise.all([...d.images].map(i => i.complete ? 1 : new Promise(x => { i.onload = i.onerror = x; })));
  await new Promise(x => setTimeout(x, 200)); f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => { try { f.remove(); } catch (e) {} }, 60000);
}
init();
</script>
