<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte por equipo — Next Level 7</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#142702;color:#eef7e6;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:14px;display:flex;flex-direction:column;align-items:center}
.nav{width:100%;max-width:960px;margin-bottom:12px}
.nav a{display:inline-block;padding:8px 18px;background:rgba(0,0,0,.6);border:1px solid #5eb50d;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.panel{width:100%;max-width:960px;background:rgba(0,0,0,.75);border:1px solid #5eb50d55;border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{color:#5eb50d;font-size:17px;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.campo{flex:1;min-width:180px}
.campo span{display:block;font-size:11px;color:#9db38c;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:4px}
select{width:100%;padding:11px;border-radius:10px;border:1px solid #5eb50d66;background:#071019;color:#fff;font-size:15px}
.btn{flex:1;min-width:130px;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;background:rgba(94,181,13,.18);color:#5eb50d;border:1px solid #5eb50d66}
.btn.pri{background:#5eb50d;color:#0a1a0d}
#msg{font-size:13px;color:#9db38c;text-align:center;min-height:18px}
#msg.err{color:#ff6b6b}
#vista-wrap{width:100%;max-width:960px;overflow:hidden;border-radius:10px;background:#f3f5ef}
#vista-wrap[hidden]{display:none}

/* ===== DOCUMENTO (PNG / impresión) ===== */
.rq-doc{background:#fff;color:#1f2933;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative}
.rq-doc *{box-sizing:border-box}
.rq-head{background:#1d3d05;color:#fff;padding:20px 32px 18px;border-bottom:6px solid #5eb50d;display:flex;justify-content:space-between;align-items:center;gap:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-liga{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#b9d8a0;font-weight:600}
.rq-titulo{font-size:28px;font-weight:800;margin-top:6px;line-height:1.15}
.rq-sub{font-size:14px;color:#d6e6c8;margin-top:4px}
.rq-der{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;font-size:12px;color:#d6e6c8;line-height:1.5}
.rq-logos{display:flex;gap:10px}
.rq-logos img{height:54px;width:auto;object-fit:contain}
.rq-body{padding:22px 32px 6px}
.rq-equipo{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.rq-equipo img{width:84px;height:84px;object-fit:contain}
.rq-equipo h1{font-size:30px;font-weight:800;line-height:1.1;text-transform:uppercase}
.rq-equipo small{display:block;color:#6b7280;font-size:13px;margin-top:4px}
.rq-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.rq-kpi{border:1px solid #cfd8c5;border-top:4px solid #5eb50d;border-radius:6px;padding:9px 4px;text-align:center}
.rq-kpi b{display:block;font-size:26px;font-weight:800;line-height:1.15}
.rq-kpi span{font-size:10.5px;color:#6b7280;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.rq-kpi.v{border-top-color:#2f9e44}.rq-kpi.v b{color:#1f7a35}
.rq-kpi.a{border-top-color:#e0a800}.rq-kpi.a b{color:#a87500}
.rq-kpi.r{border-top-color:#d64545}.rq-kpi.r b{color:#c0392b}
.rq-situacion{border:1px solid #cfd8c5;border-left:6px solid #5eb50d;border-radius:6px;padding:12px 16px;margin-bottom:18px;background:#f9faf6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-situacion.debe{border-left-color:#d64545;background:#fdf3f3}
.rq-situacion.adel{border-left-color:#2b6cb0;background:#f1f6fc}
.rq-situacion .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rq-situacion p{font-size:13.5px;line-height:1.5;color:#374151}
.rq-situacion p+p{margin-top:3px}
.rq-pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-pill.v{background:#e3f4e6;color:#1b6e2e;border:1px solid #a9d9b3}
.rq-pill.r{background:#fde8e8;color:#b42318;border:1px solid #f5b5b5}
.rq-pill.a{background:#fff4d6;color:#8a6100;border:1px solid #f0d58a}
.rq-pill.b{background:#e5effa;color:#1e4e8c;border:1px solid #aac6e8}
.rq-pill.g{background:#eef0f3;color:#4b5563;border:1px solid #cfd4db}
.rq-pill.p{background:#f0e9fa;color:#5b3a99;border:1px solid #cdbbe8}
.rq-tabla{width:100%;border-collapse:collapse;font-size:13px}
.rq-tabla thead{display:table-header-group}
.rq-tabla th{background:#e8f1dc;color:#1d3d05;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;padding:8px 5px;border:1px solid #cfd8c5;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-tabla td{padding:7px 5px;border:1px solid #d9e0d0;text-align:center;vertical-align:middle}
.rq-tabla tr{page-break-inside:avoid;break-inside:avoid}
.rq-tabla td.n{color:#6b7280;font-size:12px}
.rq-tabla td.j{font-weight:800;font-size:14px}
.rq-tabla td small{display:block;color:#6b7280;font-size:11px}
.rq-tabla td b{display:block}
.rq-tabla tr.fila-debe td{background:#fdf3f3}
.rq-tabla tr.fila-desc td{background:#f6f7f9;color:#6b7280}
.rq-rival{display:flex;align-items:center;gap:8px;text-align:left}
.rq-rival img{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.rq-rival span{font-weight:700;text-transform:uppercase;font-size:12.5px;line-height:1.15}
.rq-marc{font-size:16px;font-weight:800}
.rq-recordatorio{margin:0;padding:11px 32px;background:#fff4d6;border-bottom:2px solid #e0a800;color:#6b4e00;font-size:13px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-recordatorio b{color:#8a6100}
.rq-leyenda{margin:16px 0 0;padding:12px 14px;border:1px solid #cfd8c5;border-radius:6px;font-size:11.5px;color:#4b5563;line-height:1.55;background:#fafbf8}
.rq-leyenda b{color:#1d3d05}
.rq-pie{display:flex;justify-content:space-between;gap:20px;margin-top:18px;padding:10px 32px;border-top:1px solid #cfd8c5;font-size:10.5px;color:#6b7280}
.rq-mx td.cel{font-size:17px;font-weight:800;width:46px;padding:6px 2px}
.rq-mx td.eq{text-align:left}
.rq-mx td.eq .rq-rival span{font-size:12px}
.rq-cal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 16px;padding:10px 14px;border:1px solid #cfd8c5;border-radius:6px;background:#f9faf6;font-size:13px;color:#374151}
.rq-cal b{font-size:18px;color:#1d3d05}
.rq-cal .op{color:#9ca3af;font-weight:800}
.rq-tit{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#1d3d05;font-weight:800;margin:20px 0 6px}
.rq-sim{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#374151;margin-top:12px}
.rq-sim span b{display:inline-block;min-width:22px;text-align:center;font-size:15px}
body:not(.auth) .panel, body:not(.auth) #vista-wrap{display:none !important}
body.auth #login-reporte{display:none}
#login-reporte{width:100%;max-width:420px;background:rgba(0,0,0,.75);border:1px solid #5eb50d55;border-radius:14px;padding:20px;margin-top:30px}
#login-reporte h2{color:#5eb50d;font-size:17px;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
#login-reporte input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #5eb50d66;background:#071019;color:#fff;font-size:15px;outline:none;margin-bottom:10px}
#login-reporte .err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:8px}
td.idp{font-weight:700;font-size:12px;color:#374151}
td.n{font-weight:800;font-size:13px;color:#1d3d05}

/* ===== Panel: imágenes de partidos y descansos ===== */
#statusMsg{font-size:13px;color:#9db38c;text-align:center;min-height:18px;margin-top:4px}
#stackContainer{margin-top:10px}
#stackContainer .editor-panel{background:rgba(0,0,0,.35);border:1px solid #5eb50d44;border-radius:12px;padding:12px}
#stackContainer .editor-panel h3{color:#5eb50d;font-size:15px;letter-spacing:1px;margin:0 0 8px;text-transform:uppercase}
#stackContainer .empty-msg{text-align:center;color:rgba(255,255,255,.4);font-size:13px;padding:14px}
</style>
</head>
<body>
<div class="nav"><a href="index.html">← Inicio</a></div>

<div id="login-reporte">
  <h2>🔒 Acceso de administrador</h2>
  <input type="password" id="pass-reporte" placeholder="Contraseña de administrador" autocomplete="off">
  <button class="btn pri" style="width:100%" onclick="entrarReporte()">Entrar</button>
  <div class="err" id="err-reporte"></div>
</div>

<div class="panel">
  <h2>📋 Reporte por equipo</h2>
  <div class="fila">
    <label class="campo"><span>Tipo de reporte</span>
      <select id="tipo" onchange="cambiarTipo()">
        <option value="equipo">Por equipo</option>
        <option value="domingo">Rol propuesto del próximo domingo</option>
        <option value="general">Control general (todos los equipos)</option>
        <option value="propuesta">Propuesta de programación (varias fechas)</option>
        <option value="tentativo">Rol tentativo (ya programado, sin publicar)</option>
        <option value="horarios">Propuesta con horarios y campos (varias fechas)</option>
      </select></label>
    <label class="campo" id="campo-equipo"><span>Equipo</span>
      <select id="sel-equipo"><option value="">Cargando equipos...</option></select></label>
    <label class="campo" id="campo-fechas" style="display:none"><span>Fechas a proponer</span>
      <select id="sel-fechas"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label class="campo" id="campo-doble" style="display:none"><span>Dobles jornadas</span>
      <select id="sel-doble"><option value="no">No: un partido por domingo</option><option value="si">Sí: solo a equipos que deben</option></select></label>
  </div>
  <div class="fila">
    <button class="btn" onclick="ver()">👁️ Ver reporte</button>
    <button class="btn pri" onclick="descargar()">📥 Descargar PNG</button>
    <button class="btn" onclick="imprimir()">🖨️ Imprimir</button>
  </div>
  <div id="msg">Cargando datos...</div>
</div>
<div class="panel" id="panel-imagenes">
  <h2>🖼️ Imágenes de partidos y descansos</h2>
  <div class="fila">
    <label class="campo"><span>Filtrar por</span>
      <select id="filterTipo" onchange="cambiarFiltro()">
        <option value="jornada">Por jornada</option>
        <option value="fecha">Por fecha</option>
        <option value="equipo">Por equipo</option>
      </select></label>
    <label class="campo" id="groupJornada"><span>Jornada</span>
      <select id="filterJornada"><option value="">— Selecciona —</option></select></label>
    <label class="campo" id="groupFecha" style="display:none"><span>Fecha</span>
      <select id="filterFecha"><option value="">Cargando...</option></select></label>
    <label class="campo" id="groupEquipo" style="display:none"><span>Equipo</span>
      <select id="filterEquipo"><option value="">Cargando...</option></select></label>
  </div>
  <div class="fila">
    <button class="btn" onclick="cargarDatos()">🔄 Cargar datos</button>
  </div>
  <div class="fila">
    <button class="btn pri" id="dlBtn" onclick="downloadPNG()">⬇ Descargar Lista como PNG</button>
    <button class="btn" id="dlBtnV2" onclick="downloadPNGv2()">⬇ Descargar (escudos chicos)</button>
    <button class="btn" id="dlBtnV3" onclick="downloadPNGv3()">⬇ Descargar (escudos 3d)</button>
  </div>
  <div class="fila">
    <button class="btn" onclick="mostrarDescansos()">😴 Ver calendario de descansos</button>
    <button class="btn pri" id="dlBtnDesc" onclick="downloadPNGDescansos()">⬇ Descargar reporte de descansos (PNG)</button>
  </div>
  <div id="statusMsg">Cargando datos...</div>
  <div id="stackContainer"></div>
</div>
<div id="vista-wrap" hidden><div id="vista"></div></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIGURACIÓN
// ═══════════════════════════════════════════════
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub';
const URL_EQUIPOS  = `${PUB}?gid=1894947293&single=true&output=csv`;
const URL_PARTIDOS = `${PUB}?gid=1362473459&single=true&output=csv`;
// El torneo comenzó el domingo 20/09/2026 = Fecha 1 = Jornada 1. Cada domingo avanza una fecha.
const FECHA_INICIO = '20/09/2026';

// ── CORRECCIONES DE CAPTURA ──
// Partidos que se guardaron en la hoja con equipos equivocados. Para todos los reportes y para los enfrentamientos
// se toman con los equipos correctos (ID_Equipo). Si ya corriges la hoja, puedes borrar la línea correspondiente.
const CORRECCIONES_PARTIDOS = {
  '28': { local: '5', visita: '12' },   // estaba como 5 vs 7 (que ya se había jugado la jornada pasada); era 5 vs 12
  '70': { local: '6', visita: '7' }     // estaba como 6 vs 12; era 6 vs 7
};
function aplicarCorrecciones(lista){
  const hechas = [];
  lista.forEach(p => {
    const c = CORRECCIONES_PARTIDOS[String(p['ID_Partido'] || '').trim()];
    if (!c) return;
    const oL = String(p['Equipo_Local']).trim(), oV = String(p['Equipo_Visita']).trim();
    const pen = String(p['Penales'] || '').trim();
    if (pen === oL) p['Penales'] = c.local; else if (pen === oV) p['Penales'] = c.visita;   // si hubo penales, el ganador sigue a su equipo
    p['Equipo_Local'] = c.local; p['Equipo_Visita'] = c.visita;
    hechas.push(String(p['ID_Partido']).trim());
  });
  return hechas;
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2 = n => String(n).padStart(2, '0');
const DIA_MS = 86400000;
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let EQUIPOS = [], PARTIDOS = [];
const idTxt = v => (v != null && String(v).trim() !== '') ? esc(String(v).trim()) : '—';
const idPartido = p => idTxt(p && p['ID_Partido']);

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ','){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const [cab, ...resto] = rows;
  return resto.filter(r => r.some(c => c.trim())).map(r => { const o = {}; cab.forEach((h, i) => o[h.trim()] = (r[i] || '').trim()); return o; });
}
function parseFecha(f){
  const p = String(f || '').trim().split('/').map(x => parseInt(x, 10));
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[2], p[1] - 1, p[0], 12);
}
const fmt = d => d ? `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}` : '—';
const inicio = () => parseFecha(FECHA_INICIO);
// número de fecha (domingo) al que pertenece una fecha calendario
const fechaNum = d => d ? Math.floor(Math.round((d - inicio()) / DIA_MS) / 7) + 1 : null;
const fechaDeJornada = j => new Date(inicio().getTime() + (j - 1) * 7 * DIA_MS);
function hora12(h){
  const m = String(h || '').match(/(\d+):(\d+)/); if (!m) return '';
  let H = parseInt(m[1], 10); const ap = H >= 12 ? 'pm' : 'am'; H = H % 12 || 12; return `${H}:${m[2]} ${ap}`;
}
// Equipo que NO jugó la jornada JORNADA_CUBIERTA pero se cuenta como si la hubiera jugado (solo para estadísticas y jornadas).
const EQUIPO_SIN_J1 = 'Deportivo Azul';
const JORNADA_CUBIERTA = 1;
const normTxt = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const idSinJ1 = () => { const e = EQUIPOS.find(q => normTxt(q['Nombre']) === normTxt(EQUIPO_SIN_J1)); return e ? String(e['ID_Equipo']).trim() : null; };
const RIVAL_CUBIERTA = 'Puebla 450';   // el juego Deportivo Azul vs Puebla 450 se toma como jugado en la jornada cubierta
const idRivalCub = () => { const e = EQUIPOS.find(q => normTxt(q['Nombre']) === normTxt(RIVAL_CUBIERTA)); return e ? String(e['ID_Equipo']).trim() : null; };
const esParCubierto = (x, y) => { const a = idSinJ1(), b = idRivalCub(); return !!a && !!b && ((x === a && y === b) || (x === b && y === a)); };
const cubreJ = (id, j) => j === JORNADA_CUBIERTA && id === idSinJ1();
const esBaja = e => (e['Status'] || '').trim().toLowerCase() === 'baja';
const idDe = e => String(e['ID_Equipo']).trim();

// ═══════════════════════════════════════════════
//  CARGA
// ═══════════════════════════════════════════════
async function init(){
  try {
    const [te, tp] = await Promise.all([ fetch(URL_EQUIPOS).then(r => r.text()), fetch(URL_PARTIDOS).then(r => r.text()) ]);
    EQUIPOS = parseCSV(te).filter(e => idDe(e)); PARTIDOS = parseCSV(tp).filter(p => p['Equipo_Local'] && p['Equipo_Visita']);   // incluye pendientes aunque no tengan jornada
    const corregidos = aplicarCorrecciones(PARTIDOS);
    const ord = [...EQUIPOS].sort((a, b) => a['Nombre'].localeCompare(b['Nombre'], 'es'));
    $('sel-equipo').innerHTML = '<option value="">— Selecciona un equipo —</option>' + ord.map(e => `<option value="${esc(idDe(e))}">${esc(e['Nombre'])}${esBaja(e) ? ' (baja)' : ''}</option>`).join('');
    msg('Elige un equipo y presiona "Ver reporte".' + (corregidos.length ? ` · Se aplicaron las correcciones de captura a los partidos ID ${corregidos.join(' y ')}.` : ''));
  } catch (e){ $('sel-equipo').innerHTML = '<option value="">No se pudieron cargar los datos</option>'; msg('No se pudieron cargar los datos. Revisa tu conexión.', true); }
}
function msg(t, err){ $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function cambiarTipo(){
  const t = $('tipo').value;
  $('campo-equipo').style.display = t === 'equipo' ? '' : 'none';
  $('campo-fechas').style.display = (t === 'propuesta' || t === 'horarios') ? '' : 'none';
  $('campo-doble').style.display = t === 'propuesta' ? '' : 'none';
}

// ═══════════════════════════════════════════════
//  ANÁLISIS: jornadas vs fechas
// ═══════════════════════════════════════════════
const estadoDe = p => (p['Estado'] || '').trim().toLowerCase();

// Resultado visto desde el equipo idE
function resultado(p, idE){
  const local = String(p['Equipo_Local']).trim() === idE;
  const gl = parseInt(p['Goles_Local'], 10), gv = parseInt(p['Goles_Visita'], 10);
  const gf = local ? gl : gv, gc = local ? gv : gl;
  const gp = (p['Ganado_Por'] || '').trim().toLowerCase();
  const tipo = gp === 'penales' ? 'penales' : gp === 'default' ? 'default' : 'normal';
  const res = (isNaN(gf) || isNaN(gc)) ? 'e' : gf > gc ? 'g' : gf < gc ? 'p' : 'e';
  // Si terminó empatado y se definió en penales: sigue siendo EMPATE; los penales son el desempate (ganó / perdió).
  let pen = null;
  if (tipo === 'penales' && res === 'e'){ const w = String(p['Penales'] || '').trim(); if (w) pen = (w === idE) ? 'g' : 'p'; }
  return { gf, gc, tipo, res, pen, rival: local ? String(p['Equipo_Visita']).trim() : String(p['Equipo_Local']).trim() };
}

function contexto(){
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  const jugados = PARTIDOS.filter(p => estadoDe(p) === 'jugado');
  const J = jugados.length ? Math.max(...jugados.map(p => Number(p['Jornada']))) : 0;   // jornada más avanzada ya jugada en la liga
  return { hoy, J, fechaHoy: Math.max(0, fechaNum(hoy)) };
}

const involucra = (p, id) => String(p['Equipo_Local']).trim() === id || String(p['Equipo_Visita']).trim() === id;
const rivalDe = (p, id) => String(p['Equipo_Local']).trim() === id ? String(p['Equipo_Visita']).trim() : String(p['Equipo_Local']).trim();
const cancelado = p => estadoDe(p).includes('cancel');
const activosIds = () => EQUIPOS.filter(e => !esBaja(e)).map(idDe);
const nombreEq = id => (EQUIPOS.find(e => idDe(e) === id) || {})['Nombre'] || ('Equipo ' + id);
// Una jornada está "vencida" cuando su domingo ya pasó: desde ese momento todos los equipos activos deben haberla jugado.
const vencidaJ = j => fechaDeJornada(j) < contexto().hoy;
const ultimaVencida = () => { let n = 0; while (vencidaJ(n + 1)) n++; return n; };

// ¿El equipo tiene partido válido en la jornada j? (jugado, o programado contra un equipo activo)
function tienePartidoJ(idT, j, actSet){
  if (cubreJ(idT, j)) return true;
  return PARTIDOS.some(p => Number(p['Jornada']) === j && !cancelado(p) && involucra(p, idT) && (estadoDe(p) === 'jugado' || actSet.has(rivalDe(p, idT))));
}
// Solo hay descanso real cuando la liga tiene número impar de equipos activos y uno queda libre.
function descansoLegitimo(j, idT){
  const act = activosIds(); if (act.length % 2 === 0) return false;
  const set = new Set(act), sin = act.filter(t => !tienePartidoJ(t, j, set));
  return sin.length === 1 && sin[0] === idT;
}

// ── Clasificación de un partido NO jugado ──
// Un partido con fecha futura se CONFIRMA (a disputar) desde el jueves anterior a su domingo; antes puede haber cambios en el rol.
const jueveDe = d => new Date(d.getTime() - ((d.getDay() - 4 + 7) % 7) * DIA_MS);
const confirmadoFecha = d => !!d && contexto().hoy >= jueveDe(d);
function claseNoJugado(p){
  const d = parseFecha(p['Fecha']), { hoy } = contexto();
  if (!d) return 'sinfecha';
  if (d < hoy && fmt(d) !== fmt(hoy)) return 'vencido';
  return confirmadoFecha(d) ? 'adisputar' : 'tentativo';
}

// Empareja (máximo de parejas) a los equipos que deben la misma jornada, sin repetir rivales.
function emparejar(ids, ok){
  let mejor = { pares: [], n: -1 };
  const rec = (resto, pares) => {
    if (!resto.length){ if (pares.length > mejor.n) mejor = { pares: pares.map(x => x.slice()), n: pares.length }; return; }
    if (pares.length + Math.floor(resto.length / 2) <= mejor.n) return;
    const [x, ...r] = resto;
    for (let i = 0; i < r.length; i++) if (ok(x, r[i])){ pares.push([x, r[i]]); rec(r.filter((_, k) => k !== i), pares); pares.pop(); }
    rec(r, pares);
  };
  rec(ids, []);
  const usados = new Set(mejor.pares.flat());
  return { pares: mejor.pares, solos: ids.filter(i => !usados.has(i)) };
}

// Por cada jornada vencida: quién la debe sin tener partido, con quién podría jugarla y qué partidos ya existen.
function crucesPendientes(){
  const act = activosIds(); if (!act.length) return [];
  const actSet = new Set(act);
  const Lv = act.length % 2 === 0 ? act.length - 1 : act.length;
  const vuelta = j => Math.floor((j - 1) / Lv);
  const enfrentados = (x, y, j) => esParCubierto(x, y) || PARTIDOS.some(p => !cancelado(p) && Number(p['Jornada']) !== j && !isNaN(Number(p['Jornada'])) &&
    vuelta(Number(p['Jornada'])) === vuelta(j) && involucra(p, x) && involucra(p, y));
  const out = [], sugeridos = new Set();
  const llave = (x, y, j) => vuelta(j) + ':' + [x, y].sort().join('-');
  for (let j = 1; j <= ultimaVencida(); j++){
    const delJ = PARTIDOS.filter(p => Number(p['Jornada']) === j && !cancelado(p));
    const con = new Set(); if (j === JORNADA_CUBIERTA && idSinJ1()) con.add(idSinJ1());
    delJ.forEach(p => { const x = String(p['Equipo_Local']).trim(), y = String(p['Equipo_Visita']).trim(); if (estadoDe(p) === 'jugado' || (actSet.has(x) && actSet.has(y))){ con.add(x); con.add(y); } });
    let sin = act.filter(t => !con.has(t));
    if (act.length % 2 === 1 && sin.length === 1) sin = [];
    const programados = delJ.filter(p => estadoDe(p) !== 'jugado' && actSet.has(String(p['Equipo_Local']).trim()) && actSet.has(String(p['Equipo_Visita']).trim()))
      .map(p => ({ a: String(p['Equipo_Local']).trim(), b: String(p['Equipo_Visita']).trim(), fecha: parseFecha(p['Fecha']), conf: claseNoJugado(p) === 'adisputar', p }));
    if (!sin.length && !programados.length) continue;
    sin.sort((x, y) => nombreEq(x).localeCompare(nombreEq(y), 'es'));
    const ok = (x, y) => !enfrentados(x, y, j) && !sugeridos.has(llave(x, y, j));
    const { pares, solos } = emparejar(sin, ok);
    pares.forEach(([x, y]) => sugeridos.add(llave(x, y, j)));
    const posibles = {}; sin.forEach(x => posibles[x] = sin.filter(y => y !== x && ok(x, y)));
    out.push({ j, esperada: fechaDeJornada(j), sinPartido: sin, pares, solos, posibles, programados });
  }
  return out;
}

// Una fila por jornada para el equipo
function analizarEquipo(idE){
  const { J } = contexto();
  const actSet = new Set(activosIds());
  const suyos = PARTIDOS.filter(p => involucra(p, idE) && !cancelado(p));
  const maxJ = Math.max(J, ultimaVencida(), ...suyos.map(p => Number(p['Jornada'])).filter(n => !isNaN(n)), 0);
  const filas = [];
  for (let j = 1; j <= maxJ; j++){
    const esperada = fechaDeJornada(j), venc = vencidaJ(j);
    const delJ = suyos.filter(x => Number(x['Jornada']) === j);
    const p = delJ.find(x => estadoDe(x) === 'jugado') || delJ.find(x => actSet.has(rivalDe(x, idE))) || delJ[0];
    const fila = { j, esperada, fEsp: j };
    if (!p && cubreJ(idE, j)){ fila.tipo = 'cubierta'; filas.push(fila); continue; }
    if (!p){ fila.tipo = !venc ? 'sinasignar' : (descansoLegitimo(j, idE) ? 'descanso' : 'sinpartido'); filas.push(fila); continue; }
    const d = parseFecha(p['Fecha']);
    fila.p = p; fila.fecha = d; fila.fReal = fechaNum(d);
    if (estadoDe(p) === 'jugado'){
      fila.tipo = 'jugado'; fila.r = resultado(p, idE);
      fila.control = fila.fReal == null ? 'sinfecha' : j === fila.fReal ? 'tiempo' : j > fila.fReal ? 'adelanto' : 'atrasada';
    } else {
      const cl = claseNoJugado(p);
      fila.rivalBaja = !actSet.has(rivalDe(p, idE));
      if (cl === 'adisputar' && !fila.rivalBaja){ fila.tipo = 'adisputar'; fila.alCorriente = venc; }
      else if (cl === 'vencido' || venc){ fila.tipo = 'debe'; fila.tentativo = cl === 'tentativo'; }
      else fila.tipo = cl === 'tentativo' ? 'tentativo' : 'pendiente';
    }
    filas.push(fila);
  }
  return filas;
}

// Partidos reales que le faltan al equipo: "a disputar" (ya confirmados) y "por programar" (el resto).
function pendientesEquipo(idE){
  const actSet = new Set(activosIds());
  return PARTIDOS.filter(p => involucra(p, idE) && estadoDe(p) !== 'jugado' && !cancelado(p)).map(p => {
    const j = parseInt(p['Jornada'], 10), d = parseFecha(p['Fecha']), cl = claseNoJugado(p), rival = rivalDe(p, idE), baja = !actSet.has(rival);
    const venc = !isNaN(j) && vencidaJ(j);
    let tipo, grupo;
    if (cl === 'adisputar' && !baja){ tipo = 'adisputar'; grupo = 'adisputar'; }
    else { grupo = 'porprogramar'; tipo = (cl === 'vencido' || venc) ? 'debe' : cl === 'tentativo' ? 'tentativo' : 'pendiente'; }
    return { p, j: isNaN(j) ? null : j, fecha: d, tipo, grupo, rival, baja, cl };
  }).sort((x, y) => (x.fecha ? x.fecha.getTime() : 9e15) - (y.fecha ? y.fecha.getTime() : 9e15) || (x.j == null) - (y.j == null) || (x.j || 0) - (y.j || 0));
}

function resumen(filas){
  const jug = filas.filter(f => f.tipo === 'jugado');
  const c = k => jug.filter(f => f.r.res === k).length;
  const disp = filas.filter(f => f.tipo === 'adisputar').sort((x, y) => x.fecha - y.fecha);
  return {
    jugados: jug.length + filas.filter(f => f.tipo === 'cubierta').length, g: c('g'), e: c('e'), p: c('p'),
    penG: jug.filter(f => f.r.pen === 'g').length, penP: jug.filter(f => f.r.pen === 'p').length,
    gf: jug.reduce((t, f) => t + (isNaN(f.r.gf) ? 0 : f.r.gf), 0), gc: jug.reduce((t, f) => t + (isNaN(f.r.gc) ? 0 : f.r.gc), 0),
    debe: filas.filter(f => f.tipo === 'debe' || f.tipo === 'sinpartido'),
    progDeuda: disp.filter(f => f.alCorriente),
    adelanto: jug.filter(f => f.control === 'adelanto'), atrasada: jug.filter(f => f.control === 'atrasada'),
    descansos: filas.filter(f => f.tipo === 'descanso'), proximo: disp[0]
  };
}

// ── Propuesta de programación ──
// Mejor emparejamiento (más partidos y, a igualdad, las jornadas más atrasadas primero) por programación exacta sobre subconjuntos.
function mejorEmparejamiento(nodos, edges){
  const n = nodos.length, idx = {}; nodos.forEach((t, i) => idx[t] = i);
  if (n > 24) return [];
  const adj = Array.from({ length: n }, () => []);
  edges.forEach(e => { const i = idx[e.a], j = idx[e.b]; adj[i].push({ j, e }); adj[j].push({ j: i, e }); });
  const memo = new Map();
  const f = mask => {
    if (!mask) return { n: 0, c: 0, sel: [] };
    if (memo.has(mask)) return memo.get(mask);
    const low = mask & -mask, i = 31 - Math.clz32(low);
    let mejor = f(mask & ~low);
    adj[i].forEach(({ j, e }) => {
      if (mask & (1 << j)){
        const r = f(mask & ~low & ~(1 << j)), cand = { n: r.n + 1, c: r.c + e.c, sel: r.sel.concat([e]) };
        if (cand.n > mejor.n || (cand.n === mejor.n && cand.c < mejor.c)) mejor = cand;
      }
    });
    memo.set(mask, mejor); return mejor;
  };
  return f((1 << n) - 1).sel;
}

// Asigna una jornada a cada partido pendiente de modo que ningún equipo repita jornada (búsqueda con retroceso;
// respeta la jornada del rol cuando es posible). Si no hay solución completa, asigna las que puede.
function asignarJornadas(pend, ocup, rango, pref){
  const usadas = {}; Object.keys(ocup).forEach(t => usadas[t] = new Set(ocup[t]));
  const opciones = (i, asign) => rango.filter(j => !usadas[pend[i].a].has(j) && !usadas[pend[i].b].has(j));
  let asign = new Map(), nodos = 0;
  const rec = () => {
    if (asign.size === pend.length) return true;
    if (++nodos > 20000) return false;
    let mi = -1, mo = null;
    for (let i = 0; i < pend.length; i++){
      if (asign.has(i)) continue;
      const o = opciones(i); if (!o.length) return false;
      if (!mo || o.length < mo.length){ mi = i; mo = o; if (o.length === 1) break; }
    }
    const pr = pref.get(mi), orden = (pr != null && mo.includes(pr)) ? [pr, ...mo.filter(j => j !== pr)] : mo;
    for (const j of orden){
      asign.set(mi, j); usadas[pend[mi].a].add(j); usadas[pend[mi].b].add(j);
      if (rec()) return true;
      asign.delete(mi); usadas[pend[mi].a].delete(j); usadas[pend[mi].b].delete(j);
      if (nodos > 20000) return false;
    }
    return false;
  };
  if (rec()) return asign;
  // sin solución completa: asignación voluntariosa (la más restringida primero)
  Object.keys(ocup).forEach(t => usadas[t] = new Set(ocup[t]));
  asign = new Map();
  for (;;){
    let mi = -1, mo = null;
    for (let i = 0; i < pend.length; i++){ if (asign.has(i)) continue; const o = opciones(i); if (o.length && (!mo || o.length < mo.length)){ mi = i; mo = o; } }
    if (mi < 0) break;
    const pr = pref.get(mi), j = (pr != null && mo.includes(pr)) ? pr : mo[0];
    asign.set(mi, j); usadas[pend[mi].a].add(j); usadas[pend[mi].b].add(j);
  }
  return asign;
}

function planProgramacion(nFechas, doble){
  const act = activosIds().sort((x, y) => nombreEq(x).localeCompare(nombreEq(y), 'es'));
  if (act.length < 2) return null;
  const actSet = new Set(act), { hoy } = contexto();
  const L = act.length % 2 === 0 ? act.length - 1 : act.length;                 // jornadas por vuelta
  const num = p => { const t = String(p['Jornada'] == null ? '' : p['Jornada']).trim(); return t === '' ? NaN : Number(t); }, key = (x, y) => [x, y].sort().join('-');   // jornada en blanco = sin jornada (no 0)
  const validos = PARTIDOS.filter(p => !cancelado(p) && actSet.has(String(p['Equipo_Local']).trim()) && actSet.has(String(p['Equipo_Visita']).trim()));
  const todos = []; for (let i = 0; i < act.length; i++) for (let k = i + 1; k < act.length; k++) todos.push([act[i], act[k]]);

  const azId = idSinJ1(), puId = idRivalCub();
  // vuelta en curso: la primera donde todavía hay parejas sin jugar
  let v = 0;
  for (; v < 4; v++){
    const lo = v * L + 1, hi = (v + 1) * L;
    const jug = new Set(validos.filter(p => estadoDe(p) === 'jugado' && num(p) >= lo && num(p) <= hi).map(p => key(String(p['Equipo_Local']).trim(), String(p['Equipo_Visita']).trim())));
    if (azId && puId && lo <= JORNADA_CUBIERTA && JORNADA_CUBIERTA <= hi) jug.add(key(azId, puId));
    if (todos.some(([x, y]) => !jug.has(key(x, y)))) break;
  }
  const lo = v * L + 1, hi = (v + 1) * L, rango = []; for (let j = lo; j <= hi; j++) rango.push(j);
  const enV = validos.filter(p => (num(p) >= lo && num(p) <= hi) || isNaN(num(p)));
  const ocup = {}; act.forEach(t => ocup[t] = new Set());
  const hecho = new Set(), fijos = [], tent = [], previo = {};
  enV.forEach(p => {
    const x = String(p['Equipo_Local']).trim(), y = String(p['Equipo_Visita']).trim();
    if (estadoDe(p) === 'jugado'){ hecho.add(key(x, y)); if (!isNaN(num(p))){ ocup[x].add(num(p)); ocup[y].add(num(p)); } }
    else if (claseNoJugado(p) === 'adisputar'){ hecho.add(key(x, y)); fijos.push(p); if (!isNaN(num(p))){ ocup[x].add(num(p)); ocup[y].add(num(p)); } }
    else if (claseNoJugado(p) === 'tentativo'){ hecho.add(key(x, y)); tent.push(p); if (!isNaN(num(p))){ ocup[x].add(num(p)); ocup[y].add(num(p)); } }   // ya programado, aún sin publicar (tentativo): se respeta
    else previo[key(x, y)] = { a: x, b: y, j: isNaN(num(p)) ? null : num(p), id: p['ID_Partido'] };       // conserva local/visita y la jornada del rol
  });
  // Partidos jugados contra un equipo dado de baja: la jornada ya fue jugada por el equipo activo.
  PARTIDOS.forEach(p => {
    if (cancelado(p) || estadoDe(p) !== 'jugado') return;
    const x = String(p['Equipo_Local']).trim(), y = String(p['Equipo_Visita']).trim(), jn = num(p);
    if (isNaN(jn) || jn < lo || jn > hi) return;
    if (actSet.has(x) && !actSet.has(y)) ocup[x].add(jn); else if (actSet.has(y) && !actSet.has(x)) ocup[y].add(jn);
  });
  if (azId && puId && rango.includes(JORNADA_CUBIERTA)) hecho.add(key(azId, puId));   // Deportivo Azul vs Puebla 450: se toma como jugado en J1
  { const az = idSinJ1(); if (az && ocup[az] && rango.includes(JORNADA_CUBIERTA)) ocup[az].add(JORNADA_CUBIERTA); }
  const missing = t => rango.filter(j => !ocup[t].has(j));
  const comun = (x, y) => missing(x).filter(j => !ocup[y].has(j));
  let pend = todos.filter(([x, y]) => !hecho.has(key(x, y))).map(([x, y]) => { const pv = previo[key(x, y)]; return { a: pv ? pv.a : x, b: pv ? pv.b : y, pref: pv ? pv.j : null, id: pv ? pv.id : '' }; });

  // partidos ya confirmados sin jornada: se les asigna la jornada atrasada común
  const publicados = fijos.map(p => {
    const x = String(p['Equipo_Local']).trim(), y = String(p['Equipo_Visita']).trim();
    let j = num(p);
    if (isNaN(j)){ const cm = comun(x, y); j = cm.length ? Math.min(...cm) : null; if (j != null){ ocup[x].add(j); ocup[y].add(j); } }
    return { a: x, b: y, j, fecha: parseFecha(p['Fecha']), hora: p['Hora'], cancha: p['Cancha'], id: p['ID_Partido'] };
  }).sort((x, y) => x.fecha - y.fecha);

  // partidos ya programados pero todavía no publicados (tentativos): se respetan tal cual, con su fecha, hora y campo
  const tentativos = tent.map(p => {
    const x = String(p['Equipo_Local']).trim(), y = String(p['Equipo_Visita']).trim();
    let j = num(p);
    if (isNaN(j)){ const cm = comun(x, y); j = cm.length ? Math.min(...cm) : null; if (j != null){ ocup[x].add(j); ocup[y].add(j); } }
    const fecha = parseFecha(p['Fecha']);
    let efecto = 'tiempo';
    if (j != null && fecha){ const a = fechaNum(fechaDeJornada(j)), b = fechaNum(fecha); efecto = a < b ? 'corriente' : a > b ? 'adelanto' : 'tiempo'; }
    return { a: x, b: y, j, fecha, hora: p['Hora'], cancha: p['Cancha'], id: p['ID_Partido'], efecto };
  }).sort((x, y) => x.fecha - y.fecha);

  // jornada de cada partido pendiente (global, sin que un equipo repita jornada)
  const pref = new Map(); pend.forEach((e, i) => { if (e.pref != null) pref.set(i, e.pref); });
  const asign = asignarJornadas(pend, ocup, rango, pref);
  pend = pend.map((e, i) => ({ a: e.a, b: e.b, id: e.id, j: asign.has(i) ? asign.get(i) : null }));      // conserva el ID_Partido real

  // domingos por proponer: los que aún no se publican (antes del jueves)
  const domingos = [];
  const completoTent = d => tentativos.filter(g => g.fecha && fmt(g.fecha) === fmt(d)).length >= Math.floor(act.length / 2);   // domingo ya totalmente programado
  for (let k = 0, nuevos = 0; nuevos < nFechas && k < 60; k++){
    const d = fechaDeJornada(k + 1); if (d < hoy || confirmadoFecha(d)) continue;
    domingos.push(d); if (!completoTent(d)) nuevos++;       // los ya programados se muestran, pero no gastan una de las fechas a proponer
  }
  const resultado = [];
  domingos.forEach(sdom => {
    const fnum = fechaNum(sdom), cnt = {}; act.forEach(t => cnt[t] = 0);
    const filasDom = [];
    tentativos.filter(g => g.fecha && fmt(g.fecha) === fmt(sdom)).forEach(g => {       // lo ya programado ese domingo ocupa a sus equipos
      cnt[g.a]++; cnt[g.b]++;
      filasDom.push({ ronda: 0, j: g.j, a: g.a, b: g.b, efecto: g.efecto, id: g.id, tentativo: true, hora: g.hora, cancha: g.cancha });
    });
    const deuda = t => pend.filter(e => (e.a === t || e.b === t) && e.j != null && fechaDeJornada(e.j) < sdom).length;
    for (let ronda = 1; ronda <= (doble ? 2 : 1); ronda++){
      const edges = [];
      pend.forEach((e, i) => {
        if (e.j == null) return;
        const ok1 = ronda === 1 ? (cnt[e.a] === 0 && cnt[e.b] === 0) : (cnt[e.a] === 1 && cnt[e.b] === 1 && deuda(e.a) > 0 && deuda(e.b) > 0);
        if (ok1) edges.push({ a: e.a, b: e.b, c: e.j, i });
      });
      const nodos = [...new Set(edges.flatMap(e => [e.a, e.b]))];
      const sel = mejorEmparejamiento(nodos, edges);
      sel.forEach(e => {
        cnt[e.a]++; cnt[e.b]++;
        const fj = fechaDeJornada(e.c), efecto = fj < sdom ? 'corriente' : (fj.getTime() === sdom.getTime() ? 'tiempo' : 'adelanto');
        filasDom.push({ ronda, j: e.c, a: e.a, b: e.b, efecto, id: pend[e.i].id });
      });
      const usadas = new Set(sel.map(e => e.i)); pend = pend.filter((_, i) => !usadas.has(i));
    }
    filasDom.sort((x, y) => x.ronda - y.ronda || x.j - y.j || nombreEq(x.a).localeCompare(nombreEq(y.a), 'es'));
    const juegan = new Set(filasDom.flatMap(r => [r.a, r.b]));
    const conPend = new Set(pend.flatMap(e => [e.a, e.b]));
    resultado.push({ fecha: sdom, fnum, filas: filasDom,
      sinPartido: act.filter(t => !juegan.has(t) && conPend.has(t)), terminaron: act.filter(t => !juegan.has(t) && !conPend.has(t)) });
  });
  const ultimo = domingos[domingos.length - 1] || hoy;
  const conflictos = pend.filter(e => e.j == null);
  const resumenEq = act.map(t => ({ id: t, debeDespues: pend.filter(e => (e.a === t || e.b === t) && e.j != null && fechaDeJornada(e.j) < ultimo).map(e => e.j).sort((x, y) => x - y),
    restantes: pend.filter(e => e.a === t || e.b === t).length,
    propuestos: resultado.reduce((n, d) => n + d.filas.filter(r => r.a === t || r.b === t).length, 0), confirmados: publicados.filter(g => g.a === t || g.b === t).length }));
  return { v, rango, publicados, tentativos, dias: resultado, conflictos, resumenEq, restantes: pend.length, domingoPublicado: publicados.length ? publicados[0].fecha : null };
}

function docEquipo(idE){
  const eq = EQUIPOS.find(e => idDe(e) === idE) || {};

    }
    if (f.rivalBaja) return cab + `su partido era contra ${esc(rivNombre(f))}, que está dado de baja; necesita nuevo rival.`;
    if (f.tentativo) return cab + `tiene fecha tentativa el ${fmt(f.fecha)} vs ${esc(rivNombre(f))}; se confirma el jueves anterior.`;
    if (f.fecha) return cab + `estaba para el ${fmt(f.fecha)} vs ${esc(rivNombre(f))} y no se jugó.`;

    textos.push(r.adelanto.map(f => `Jugó la jornada ${f.j} en la fecha ${f.fReal} (${fmt(f.fecha)}), antes de que le correspondiera (${fmt(f.esperada)}).`).join(' '));
  }
  if (r.atrasada.length){
    chips += `<span class="rq-pill p">PAGÓ ATRASADA ${r.atrasada.length > 1 ? 'JORNADAS' : 'JORNADA'} ${r.atrasada.map(f => f.j).join(', ')}</span>`;

    if (f.tipo === 'sinpartido') return `<tr class="fila-debe"><td class="n">—</td><td class="j">J${f.j}</td><td class="idp">—</td><td>${esp}</td><td colspan="5" style="text-align:left;padding-left:14px"><b style="display:inline;color:#b42318">Sin partido asignado en el rol — debe jugar esta jornada</b></td><td><span class="rq-pill r">DEBE</span></td></tr>`;

    if (f.tipo === 'sinasignar') return `<tr class="fila-desc"><td class="n">—</td><td class="j">J${f.j}</td><td class="idp">—</td><td>${esp}</td><td colspan="5" style="text-align:left;padding-left:14px">Aún sin partido asignado</td><td><span class="rq-pill g">SIN ASIGNAR</span></td></tr>`;
    const p = f.p, rid = rivalDe(p, idE), rv = mapa[rid] || {};

      return `<tr><td class="n">${++nJuego}</td><td class="j">J${f.j}</td><td class="idp">${idPartido(p)}</td><td>${esp}</td><td>${real}</td><td>${rival}</td><td class="rq-marc">${m}</td>
        <td><span class="rq-pill ${RES[f.r.res][0]}">${RES[f.r.res][1]}</span>${f.r.pen ? `<small style="display:block;margin-top:3px;font-weight:700;color:${f.r.pen === 'g' ? '#1b6e2e' : '#b42318'}">${f.r.pen === 'g' ? 'Ganó' : 'Perdió'} en penales</small>` : ''}</td><td>${TIPO[f.r.tipo]}</td>

    }
    const nota = f.tipo === 'adisputar' && f.alCorriente ? 'Pone al corriente' : f.tentativo ? 'Tentativo' : f.rivalBaja ? 'Rival en baja' : '';
    return `<tr class="${f.tipo === 'debe' ? 'fila-debe' : ''}"><td class="n">${++nJuego}</td><td class="j">J${f.j}</td><td class="idp">${idPartido(p)}</td><td>${esp}</td><td>${real}</td><td>${rival}</td>
      <td>—</td><td>—</td><td>—</td><td><span class="rq-pill ${PILL[f.tipo][0]}">${PILL[f.tipo][1]}</span>${nota ? `<small style="display:block;margin-top:3px;color:#8a6100;font-weight:700">${nota}</small>` : ''}</td></tr>`;
  }).join('');

  const kpis = [
    ['', r.jugados, 'Jugados'], ['v', r.g, 'Ganados'], ['a', r.e, 'Empatados'], ['r', r.p, 'Perdidos'], ['', r.gf, 'Goles a favor'], ['', r.gc, 'Goles en contra']
  ].map(([c, v, t]) => `<div class="rq-kpi ${c}"><b>${v}</b><span>${t}</span>${t === 'Empatados' && (r.penG || r.penP) ? `<small style="display:block;font-size:10px;color:#6b7280;margin-top:2px">${r.penG} ganó · ${r.penP} perdió en pen.</small>` : ''}</div>`).join('');

  const pend = pendientesEquipo(idE), aDisp = pend.filter(x => x.grupo === 'adisputar'), porProg = pend.filter(x => x.grupo === 'porprogramar');
  const total = r.jugados + aDisp.length + porProg.length;
  const calendario = `<div class="rq-cal"><span><b>${r.jugados}</b> jugados</span><span class="op">+</span><span><b>${aDisp.length}</b> a disputar</span><span class="op">+</span><span><b>${porProg.length}</b> por programar</span><span class="op">=</span><span><b>${total}</b> partidos en total</span></div>`;

  const hdrPend = '<table class="rq-tabla"><thead><tr><th style="width:36px">No.</th><th style="width:84px">Jornada</th><th style="width:48px">ID</th><th style="width:130px">Fecha y hora</th><th style="width:76px">Campo</th><th>Rival</th><th style="width:130px">Estado</th></tr></thead><tbody>';

function docGeneral(){
  const activos = EQUIPOS.filter(e => !esBaja(e)).sort((x, y) => x['Nombre'].localeCompare(y['Nombre'], 'es'));
  const { J } = contexto();
  const CR = crucesPendientes();

  const SIM = { tiempo: ['✔', '#1f7a35'], adelanto: ['⏩', '#1e4e8c'], atrasada: ['↩', '#5b3a99'], debe: ['✖', '#c0392b'], sinpartido: ['✖', '#c0392b'], descanso: ['–', '#9ca3af'], adisputar: ['○', '#1e4e8c'], tentativo: ['◌', '#9ca3af'], pendiente: ['◌', '#9ca3af'], sinasignar: ['·', '#c4c9d0'], cubierta: ['✔', '#1e4e8c'], sinfecha: ['?', '#9ca3af'] };

  }).join('');
  const nDebe = datos.filter(d => d.r.debe.length).length, nProg = datos.filter(d => !d.r.debe.length && d.r.progDeuda.length).length;
  const nAdel = datos.filter(d => !d.r.debe.length && !d.r.progDeuda.length && d.r.adelanto.length).length, nOk = datos.length - nDebe - nProg - nAdel;
  const kpis = [['', datos.length, 'Equipos activos'], ['v', nOk, 'Al corriente'], ['', nAdel, 'Adelantados'], ['a', nProg, 'Se ponen al corriente (a disputar)'], ['r', nDebe, 'Con adeudos sin programar']]
    .map(([c, v, t]) => `<div class="rq-kpi ${c}" style="flex:1"><b>${v}</b><span>${t}</span></div>`).join('');
  const ancho = Math.max(900, 250 + maxJ * 50 + 450);

  // ID_Partido real del partido pendiente entre dos equipos (el que hay que programar en Armar Jornada)
  const idPar = (x, y) => idPartido(PARTIDOS.find(q => !cancelado(q) && estadoDe(q) !== 'jugado' && involucra(q, x) && involucra(q, y)));
  let nCruce = 0;

    const prog = c.programados.map(g => `<b style="display:inline">${++nCruce}.</b> <span style="color:#374151;font-weight:700">ID ${idPartido(g.p)}</span> · ${par(g.a, g.b)} <span style="color:#6b7280">· ${g.fecha ? fmt(g.fecha) : 'sin fecha'} (${g.conf ? 'a disputar' : 'por programar'})</span>`).join('<br>') || '—';
    return `<tr><td class="j">J${c.j}<small>${fmt(c.esperada)}</small></td><td style="text-align:left;padding-left:12px">${c.sinPartido.map(id => esc(nombreEq(id))).join(', ') || '—'}</td><td style="text-align:left;padding-left:12px">${sug}</td><td style="text-align:left;padding-left:12px">${prog}</td></tr>`;

  const seccionCruces = `<div class="rq-tit" style="margin-top:22px">Jornadas pendientes y cruces sugeridos</div>` +
    (CR.length ? `<table class="rq-tabla"><thead><tr><th style="width:84px">Jornada</th><th>Equipos que la deben (sin partido)</th><th>Cruce sugerido (No. · ID)</th><th>Partidos ya existentes de esa jornada (No. · ID)</th></tr></thead><tbody>${filasC}</tbody></table>
      <div class="rq-leyenda" style="margin-top:10px"><b>Cruces sugeridos:</b> se emparejan equipos que deben la misma jornada, no tienen partido asignado y todavía no se han enfrentado en esta vuelta. Para una programación completa de las siguientes fechas usa el reporte <b>Propuesta de programación</b>.</div>`
      : '<div style="padding:10px 14px;border:1px solid #a9d9b3;background:#e3f4e6;border-radius:6px;color:#1b6e2e;font-weight:700;font-size:13px">✔ No hay jornadas pendientes por programar.</div>');

  return `<div class="rq-doc" style="width:${ancho}px">
    ${encabezado('Control de jornadas por equipo', 'Quién va al corriente, quién adelantó y quién debe')}
    <div class="rq-body">
      <div style="display:flex;gap:10px;margin-bottom:16px">${kpis}</div>
      <table class="rq-tabla rq-mx"><thead><tr><th style="text-align:left;padding-left:14px">Equipo</th>${cab}<th style="width:46px">PJ</th><th style="width:66px">G-E-P</th><th style="width:56px">A disp.</th><th style="width:58px">Por prog.</th><th style="width:140px">Situación</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="rq-sim"><span><b style="color:#1f7a35">✔</b> En tiempo</span><span><b style="color:#1e4e8c">⏩</b> Adelantó</span><span><b style="color:#5b3a99">↩</b> Pagó atrasada</span><span><b style="color:#c0392b">✖</b> Debe (sin programar)</span><span><b style="color:#1e4e8c">○</b> A disputar</span><span><b style="color:#9ca3af">◌</b> Por programar</span><span><b style="color:#9ca3af">–</b> Descanso</span></div>
      ${seccionCruces}
      <div class="rq-leyenda"><b>Cómo se lee:</b> el torneo comenzó el ${esc(FECHA_INICIO)} (Fecha 1 = Jornada 1) y cada domingo avanza una fecha; bajo cada jornada aparece el domingo que le corresponde. <b>○ A disputar</b>: partido ya confirmado (se confirma desde el jueves anterior a su domingo). <b>✖ Debe</b>: la jornada ya correspondía y no está programada. <b>◌ Por programar</b>: sin fecha, con fecha tentativa (antes del jueves) o todavía sin confirmar. PJ = jugados; G-E-P = ganados, empatados y perdidos; A disp. = partidos confirmados; Por prog. = partidos por programar. PJ + A disp. + Por prog. = total de partidos. Los equipos dados de baja no se incluyen.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

function docDomingo(){
  const P = planProgramacion(8, false);
  const mapa = {}; EQUIPOS.forEach(e => mapa[idDe(e)] = e);
  // próximo domingo POR PROPONER: se saltan los domingos que ya están completamente programados (tentativos)
  const idxDia = P ? P.dias.findIndex(d => d.filas.some(r => !r.tentativo)) : -1;
  const dia = idxDia >= 0 ? P.dias[idxDia] : null;
  const previosTent = idxDia > 0 ? P.dias.slice(0, idxDia).filter(d => d.filas.length) : [];
  if (!P || !dia) return `<div class="rq-doc" style="width:900px">${encabezado('Rol propuesto del próximo domingo', 'Sin datos suficientes')}<div class="rq-body"><p>${P && P.dias.some(d => d.filas.length) ? 'Los próximos domingos ya están programados (tentativos). Revisa el reporte «Rol tentativo».' : 'No hay un próximo domingo por proponer.'}</p></div></div>`;
  const jug = {}; P.resumenEq.forEach(x => jug[x.id] = { jugados: resumen(analizarEquipo(x.id)).jugados, conf: x.confirmados });
  const pub = P.domingoPublicado ? fmt(P.domingoPublicado) : null;
  const eqCel = id => {
    const e = mapa[id] || {}, q = jug[id] || { jugados: 0, conf: 0 };
    return `<div class="rq-rival"><img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'"><div><span>${esc(e['Nombre'] || 'Equipo ' + id)}</span><small style="display:block;text-align:left;color:#6b7280;font-size:11px;margin-top:1px">Lleva ${q.jugados} jugados${q.conf && pub ? ' + ' + q.conf + ' el ' + pub.slice(0, 5) : ''}${previosTent.map(d => { const n = d.filas.filter(r => r.a === id || r.b === id).length; return n ? ' + ' + n + ' el ' + fmt(d.fecha).slice(0, 5) : ''; }).join('')}</small></div></div>`;
  };
  const efecto = { corriente: ['v', 'PONE AL CORRIENTE'], tiempo: ['g', 'EN TIEMPO'], adelanto: ['b', 'ADELANTA'] };
  const obs = r => {
    if (r.j == null) return 'Sin jornada asignada.';
    const esp = fmt(fechaDeJornada(r.j));
    return r.efecto === 'corriente' ? `Jornada ${r.j} que ambos debían (le correspondía el ${esp}).`
      : r.efecto === 'tiempo' ? `Jornada ${r.j}: es la que corresponde a esta fecha.`
      : `Adelanta la jornada ${r.j} (le corresponde el ${esp}).`;
  };
  const filas = dia.filas.map((r, i) => `<tr><td class="n">${i + 1}</td><td class="j">J${r.j}</td><td class="idp">${idTxt(r.id)}</td><td>${eqCel(r.a)}</td><td>${eqCel(r.b)}</td>
    <td><span class="rq-pill ${r.tentativo ? 'g' : efecto[r.efecto][0]}">${r.tentativo ? 'TENTATIVO' : efecto[r.efecto][1]}</span><small style="display:block;margin-top:4px;color:#4b5563;line-height:1.3">${obs(r)}${r.tentativo ? ` Ya programado: ${esc(hora12(r.hora) || 'hora por definir')}${r.cancha ? ' · ' + esc(r.cancha) : ''}.` : ''}</small></td></tr>`).join('');
  const total = dia.filas.length, esperados = Math.floor(activosIds().length / 2);
  const sin = dia.sinPartido.length ? `<div style="margin-top:10px;padding:10px 14px;border:1px solid #f5b5b5;background:#fdf3f3;border-radius:6px;font-size:12.5px;color:#b42318"><b>Sin partido ese domingo (no hay rival disponible):</b> ${dia.sinPartido.map(t => esc(nombreEq(t))).join(', ')}.</div>` : '';
  const aviso = total < esperados ? `<div style="margin-top:10px;padding:10px 14px;border:1px solid #f0d58a;background:#fff8e1;border-radius:6px;font-size:12.5px;color:#6b4e00">Solo se pudieron armar <b>${total}</b> de ${esperados} encuentros posibles con los partidos pendientes que hay.</div>` : '';
  return `<div class="rq-doc" style="width:900px">
    ${encabezado('Rol propuesto del próximo domingo', `Domingo ${fmt(dia.fecha)} · Fecha ${dia.fnum} · ${total} encuentros`)}
    <div class="rq-body">
      <div class="rq-situacion adel"><p>Propuesta armada con los partidos que cada equipo <b>ya jugó</b>, las jornadas que le faltan y${(() => { const parts = []; if (pub) parts.push(`los partidos ya publicados del <b>domingo ${pub}</b>`); previosTent.forEach(d => parts.push(`los ya programados (tentativos) del <b>domingo ${fmt(d.fecha)}</b>`)); return parts.length ? ' suponiendo que se juegan ' + parts.join(' y ') : ' los partidos ya confirmados'; })()}. A cada encuentro se le asigna la jornada más atrasada que ambos equipos todavía no tienen.${dia.filas.some(r => r.tentativo) ? ' Los encuentros marcados como <b>tentativo</b> ya están programados en la hoja y se publican desde el jueves anterior.' : ''}</p></div>
      <table class="rq-tabla"><thead><tr><th style="width:36px">No.</th><th style="width:62px">Jornada</th><th style="width:50px">ID</th><th>Local</th><th>Visitante</th><th style="width:250px">Observación</th></tr></thead><tbody>${filas}</tbody></table>
      ${sin}${aviso}
      <div class="rq-leyenda"><b>Cómo se lee:</b> el torneo comenzó el ${esc(FECHA_INICIO)} (Fecha 1 = Jornada 1) y cada domingo avanza una fecha. <b>Pone al corriente</b>: la jornada ya correspondía antes y ambos equipos todavía la debían. <b>En tiempo</b>: la jornada es la de esta fecha. <b>Adelanta</b>: la jornada corresponde a un domingo posterior. Cada equipo juega un solo partido este domingo. Hora y campo quedan por definir. <b>Es una propuesta</b>: la liga la valida y la programa.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

// Reporte de lo que ya está programado en la hoja pero todavía no se publica (antes del jueves de su domingo)
// ═══════════════════════════════════════════════
//  REPORTE CON HORARIOS Y CAMPOS (rotación justa)
// ═══════════════════════════════════════════════
const HORAS_LIGA = [9, 10, 11, 12];            // horarios de juego de cada domingo
const CAMPOS_LIGA = ['Campo 1', 'Campo 2'];
// Restricciones opcionales: nombre del equipo (como está en la hoja) -> horas en las que NO puede jugar.
// Ejemplo: const RESTRICCION_HORA = { 'Pumas KAP': [9, 10] };
const RESTRICCION_HORA = {};

function docHorarios(nFechas){
  const P = planProgramacion(nFechas, false);
  const mapa = {}; EQUIPOS.forEach(e => mapa[idDe(e)] = e);
  const eqCel = id => { const e = mapa[id] || {}; return `<div class="rq-rival"><img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(e['Nombre'] || 'Equipo ' + id)}</span></div>`; };
  const vacio = msgTxt => `<div class="rq-doc" style="width:900px">${encabezado('Propuesta con horarios y campos', msgTxt)}<div class="rq-body"><p>${msgTxt}</p></div></div>`;
  if (!P || !P.dias.length) return vacio('No hay domingos por proponer.');

  const horaNum = h => { const m = String(h || '').match(/(\d+)\s*:/); return m ? parseInt(m[1], 10) : null; };
  const campoNorm = c => String(c || '').trim();
  const act = activosIds();
  const cntH = {}, cntC = {};
  act.forEach(t => { cntH[t] = {}; cntC[t] = {}; });
  const suma = (t, h, c) => { if (!cntH[t]) return; if (h != null) cntH[t][h] = (cntH[t][h] || 0) + 1; if (c) cntC[t][c] = (cntC[t][c] || 0) + 1; };
  // historial: lo que cada equipo ya jugó o ya tiene programado (hora y campo)
  PARTIDOS.forEach(p => {
    if (cancelado(p)) return;
    const e = estadoDe(p); if (e !== 'jugado' && e !== 'programado') return;
    const h = horaNum(p['Hora']), c = campoNorm(p['Cancha']);
    [String(p['Equipo_Local']).trim(), String(p['Equipo_Visita']).trim()].forEach(t => suma(t, h, c));
  });
  const restr = {};
  Object.keys(RESTRICCION_HORA).forEach(n => { const e = EQUIPOS.find(q => normTxt(q['Nombre']) === normTxt(n)); if (e) restr[idDe(e)] = RESTRICCION_HORA[n]; });

  const dias = P.dias.map(d => {
    const filas = d.filas.map(r => ({ ...r }));
    const fijos = filas.filter(r => r.tentativo), nuevos = filas.filter(r => !r.tentativo);
    const usados = new Set(fijos.map(r => horaNum(r.hora) + '|' + campoNorm(r.cancha)));
    const horas = HORAS_LIGA.slice();
    let libres = [];
    const gen = () => { libres = []; horas.forEach(h => CAMPOS_LIGA.forEach(c => { if (!usados.has(h + '|' + c)) libres.push({ h, c }); })); };
    gen();
    for (let extra = HORAS_LIGA[HORAS_LIGA.length - 1] + 1; libres.length < nuevos.length && extra < 22; extra++){ horas.push(extra); gen(); }
    const n = nuevos.length, m = libres.length;
    // cada equipo suma "costo" por las veces que ya jugó a esa hora / en ese campo: se busca el reparto que menos repite
    const cost = (r, sl) => { let c = 0; [r.a, r.b].forEach(t => { c += 2 * (2 * ((cntH[t] || {})[sl.h] || 0) + 1) + (2 * ((cntC[t] || {})[sl.c] || 0) + 1); if (restr[t] && restr[t].includes(sl.h)) c += 1000; }); return c; };
    const memo = {};
    const solve = (i, mask) => {
      if (i === n) return [0, []];
      const key = i + '|' + mask; if (memo[key]) return memo[key];
      let best = [Infinity, null];
      for (let sIdx = 0; sIdx < m; sIdx++){
        if (mask & (1 << sIdx)) continue;
        const [c, rest] = solve(i + 1, mask | (1 << sIdx));
        const tot = c + cost(nuevos[i], libres[sIdx]) + sIdx * 0.0001;
        if (tot < best[0]) best = [tot, [sIdx, ...rest]];
      }
      return memo[key] = best;
    };
    if (n && m >= n){
      const asign = solve(0, 0)[1];
      nuevos.forEach((r, i) => { const sl = libres[asign[i]]; r.hora = sl.h + ':00:00'; r.cancha = sl.c; r.sug = true; suma(r.a, sl.h, sl.c); suma(r.b, sl.h, sl.c); });
    }
    filas.sort((x, y) => (horaNum(x.hora) ?? 99) - (horaNum(y.hora) ?? 99) || campoNorm(x.cancha).localeCompare(campoNorm(y.cancha), 'es', { numeric: true }));
    return { fecha: d.fecha, filas };
  });

  const efecto = { corriente: ['v', 'PONE AL CORRIENTE'], tiempo: ['g', 'EN TIEMPO'], adelanto: ['b', 'ADELANTA'] };
  const cortoCampo = c => String(c || '').replace(/^campo\s*/i, 'C');
  const bloques = dias.map(d => {
    const filas = d.filas.map((r, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(hora12(r.hora) || 'Por definir')}</b></td><td>${esc(r.cancha || '—')}</td><td class="j">${r.j != null ? 'J' + r.j : '—'}</td><td class="idp">${idTxt(r.id)}</td><td>${eqCel(r.a)}</td><td>${eqCel(r.b)}</td>
      <td>${r.sug ? `<span class="rq-pill a">SUGERIDO</span><small style="display:block;margin-top:3px;color:#4b5563">${esc((efecto[r.efecto] || ['', ''])[1].toLowerCase())}</small>` : `<span class="rq-pill g">TENTATIVO</span><small style="display:block;margin-top:3px;color:#4b5563">hora y campo ya programados</small>`}</td></tr>`).join('');
    return `<div class="rq-tit">Domingo ${fmt(d.fecha)} · Fecha ${fechaNum(d.fecha)} · ${d.filas.length} encuentros</div>
      <table class="rq-tabla"><thead><tr><th style="width:34px">No.</th><th style="width:78px">Hora</th><th style="width:70px">Campo</th><th style="width:56px">Jornada</th><th style="width:44px">ID</th><th>Local</th><th>Visitante</th><th style="width:140px">Estatus</th></tr></thead><tbody>${filas}</tbody></table>`;
  }).join('');

  // qué le toca a cada equipo cada domingo
  const nombresOrd = act.slice().sort((x, y) => nombreEq(x).localeCompare(nombreEq(y), 'es'));
  const cab = dias.map(d => `<th>${fmt(d.fecha).slice(0, 5)}</th>`).join('');
  const filasEq = nombresOrd.map(t => `<tr><td>${eqCel(t)}</td>${dias.map(d => { const r = d.filas.find(x => x.a === t || x.b === t); return `<td style="text-align:center">${r ? esc((hora12(r.hora) || '—') + ' · ' + cortoCampo(r.cancha)) : '<span style="color:#9ca3af">Descansa</span>'}</td>`; }).join('')}</tr>`).join('');
  // reparto acumulado
  const horasTodas = Array.from(new Set([...HORAS_LIGA, ...act.flatMap(t => Object.keys(cntH[t]).map(Number))])).sort((x, y) => x - y);
  const camposTodos = Array.from(new Set([...CAMPOS_LIGA, ...act.flatMap(t => Object.keys(cntC[t]))]));
  const filasRep = nombresOrd.map(t => `<tr><td>${eqCel(t)}</td>${horasTodas.map(h => `<td style="text-align:center">${cntH[t][h] || 0}</td>`).join('')}${camposTodos.map(c => `<td style="text-align:center">${cntC[t][c] || 0}</td>`).join('')}</tr>`).join('');
  const hayRestr = Object.keys(restr).length;

  return `<div class="rq-doc" style="width:900px">
    ${encabezado('Propuesta con horarios y campos', `${dias.length} fecha(s) · horas y campos asignados rotando para que no se repitan`)}
    <div class="rq-body">
      <div class="rq-situacion adel"><p>Cada encuentro lleva <b>hora y campo sugeridos</b>. Se reparten rotando: a cada equipo se le busca la hora y el campo que <b>menos</b> ha tenido entre lo que ya jugó, lo ya programado y lo que se va proponiendo. Los encuentros <b>tentativos</b> conservan la hora y el campo que ya tienen programados, y solo se acomodan los que faltan en los espacios libres.${hayRestr ? ' Se respetan las restricciones de horario configuradas.' : ''}</p></div>
      ${bloques}
      <div class="rq-tit">Qué le toca a cada equipo</div>
      <table class="rq-tabla"><thead><tr><th>Equipo</th>${cab}</tr></thead><tbody>${filasEq}</tbody></table>
      <div class="rq-tit">Reparto acumulado de horarios y campos <span style="font-weight:400;text-transform:none;letter-spacing:0">(jugados + programados + sugeridos)</span></div>
      <table class="rq-tabla"><thead><tr><th>Equipo</th>${horasTodas.map(h => `<th>${esc(hora12(h + ':00:00'))}</th>`).join('')}${camposTodos.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${filasRep}</tbody></table>
      <div class="rq-leyenda"><b>Cómo se lee:</b> <b>Sugerido</b>: la hora y el campo los propone el reporte y tú los confirmas al programar. <b>Tentativo</b>: ya está programado en la hoja con esa hora y campo. Si cambias una hora o un campo en la hoja, vuelve a generar el reporte y el reparto se ajusta solo. <b>Es una propuesta</b>: la liga la valida y la programa.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

function docTentativo(){
  const P = planProgramacion(1, false);
  const mapa = {}; EQUIPOS.forEach(e => mapa[idDe(e)] = e);
  const eqCel = id => { const e = mapa[id] || {}; return `<div class="rq-rival"><img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(e['Nombre'] || 'Equipo ' + id)}</span></div>`; };
  if (!P) return `<div class="rq-doc" style="width:900px">${encabezado('Rol tentativo', 'Sin datos suficientes')}<div class="rq-body"><p>No hay equipos activos.</p></div></div>`;
  const porFecha = {};
  P.tentativos.forEach(g => { if (!g.fecha) return; const k = fmt(g.fecha); (porFecha[k] = porFecha[k] || { fecha: g.fecha, items: [] }).items.push(g); });
  const fechas = Object.values(porFecha).sort((x, y) => x.fecha - y.fecha);
  if (!fechas.length) return `<div class="rq-doc" style="width:900px">${encabezado('Rol tentativo', 'Sin partidos tentativos')}<div class="rq-body"><p>No hay partidos programados pendientes de publicar.</p></div></div>`;
  const efecto = { corriente: ['v', 'PONE AL CORRIENTE'], tiempo: ['g', 'EN TIEMPO'], adelanto: ['b', 'ADELANTA'] };
  const mins = h => { const m = String(h || '').match(/(\d+):(\d+)/); return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 99999; };
  const act = activosIds();
  const total = P.tentativos.length;
  const bloques = fechas.map(f => {
    const items = f.items.slice().sort((x, y) => mins(x.hora) - mins(y.hora) || String(x.cancha || '').localeCompare(String(y.cancha || '')));
    const juegan = new Set(items.flatMap(g => [g.a, g.b]));
    const filas = items.map((g, i) => `<tr><td class="n">${i + 1}</td><td class="j">${g.j != null ? 'J' + g.j : '—'}</td><td class="idp">${idTxt(g.id)}</td><td>${eqCel(g.a)}</td><td>${eqCel(g.b)}</td>
      <td>${esc(hora12(g.hora) || 'Por definir')}</td><td>${esc(g.cancha || '—')}</td><td><span class="rq-pill ${efecto[g.efecto][0]}">${efecto[g.efecto][1]}</span></td></tr>`).join('');
    const sin = act.filter(t => !juegan.has(t));
    const nota = sin.length ? `<p style="margin-top:6px;font-size:12.5px;color:#6b7280"><b>Sin partido programado todavía:</b> ${sin.map(t => esc(nombreEq(t))).join(', ')}.</p>` : '';
    return `<div class="rq-tit">Domingo ${fmt(f.fecha)} · Fecha ${fechaNum(f.fecha)} · ${items.length} encuentros <span class="rq-pill g" style="margin-left:8px">TENTATIVO</span></div>
      <table class="rq-tabla"><thead><tr><th style="width:36px">No.</th><th style="width:62px">Jornada</th><th style="width:50px">ID</th><th>Local</th><th>Visitante</th><th style="width:84px">Hora</th><th style="width:80px">Campo</th><th style="width:140px">Efecto</th></tr></thead><tbody>${filas}</tbody></table>${nota}`;
  }).join('');
  return `<div class="rq-doc" style="width:900px">
    ${encabezado('Rol tentativo de domingos', `${total} encuentros ya programados · aún sin publicar · ${fechas.length} fecha(s)`)}
    <div class="rq-body">
      <div class="rq-situacion adel"><p>Estos encuentros ya están <b>programados en la hoja</b>, pero todavía no se publican porque su domingo aún no entra en la ventana de confirmación (desde el jueves anterior). Son <b>tentativos</b>: pueden ajustarse hasta entonces.</p></div>
      ${bloques}
      <div class="rq-leyenda"><b>Cómo se lee:</b> el torneo comenzó el ${esc(FECHA_INICIO)} (Fecha 1 = Jornada 1) y cada domingo avanza una fecha. <b>Pone al corriente</b>: la jornada ya correspondía antes de este domingo. <b>En tiempo</b>: la jornada es la de esa fecha. <b>Adelanta</b>: la jornada corresponde a un domingo posterior. Cuando llega el jueves anterior al domingo, el encuentro pasa a <b>publicado</b> automáticamente.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

function docPropuesta(nFechas, doble){
  const P = planProgramacion(nFechas, doble);
  const mapa = {}; EQUIPOS.forEach(e => mapa[idDe(e)] = e);
  const eqCel = id => { const e = mapa[id] || {}; return `<div class="rq-rival"><img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'"><span>${esc(e['Nombre'] || 'Equipo ' + id)}</span></div>`; };
  if (!P) return `<div class="rq-doc" style="width:900px">${encabezado('Propuesta de programación', 'Sin datos suficientes')}<div class="rq-body"><p>No hay equipos activos.</p></div></div>`;
  const nProp = P.dias.reduce((n, d) => n + d.filas.length, 0);
  const alCorr = P.resumenEq.filter(x => !x.debeDespues.length).length;
  const efecto = { corriente: ['v', 'PONE AL CORRIENTE'], tiempo: ['g', 'EN TIEMPO'], adelanto: ['b', 'ADELANTA'] };
  const diasProp = P.dias.filter(d => d.filas.some(r => !r.tentativo));
  const diasTent = P.dias.filter(d => d.filas.length && d.filas.every(r => r.tentativo));
  const sub = P.dias.length ? `${diasTent.length ? 'Ya programado (tentativo): ' + diasTent.map(d => fmt(d.fecha).slice(0, 5)).join(', ') + ' · ' : ''}${diasProp.length ? `Propuesta: ${diasProp.length} fecha(s) a partir del domingo ${fmt(diasProp[0].fecha)}` : 'Sin domingos por proponer'} · jornadas ${P.rango[0]} a ${P.rango[P.rango.length - 1]}` : 'No hay domingos por proponer';
  const nTent = P.dias.reduce((n, d) => n + d.filas.filter(r => r.tentativo).length, 0);
  const kpis = [['', diasProp.length, 'Fechas propuestas'], ['b', nTent, 'Ya programados (tentativos)'], ['v', nProp - nTent, 'Partidos propuestos'], ['v', alCorr, 'Equipos al corriente al terminar'], ['a', P.restantes, 'Partidos que quedan por programar']]
    .map(([c, v, t]) => `<div class="rq-kpi ${c}" style="flex:1"><b>${v}</b><span>${t}</span></div>`).join('');

  const publicado = P.publicados.length ? `<div class="rq-tit">Ya publicado · domingo ${fmt(P.domingoPublicado)} (a disputar, se respeta)</div>
    <table class="rq-tabla"><thead><tr><th style="width:36px">No.</th><th style="width:70px">Jornada</th><th style="width:50px">ID</th><th>Local</th><th>Visitante</th><th style="width:100px">Hora</th><th style="width:80px">Campo</th></tr></thead><tbody>` +
    P.publicados.map((g, i) => `<tr><td class="n">${i + 1}</td><td class="j">${g.j != null ? 'J' + g.j : '—'}</td><td class="idp">${idTxt(g.id)}</td><td>${eqCel(g.a)}</td><td>${eqCel(g.b)}</td><td>${esc(hora12(g.hora) || '—')}</td><td>${esc(g.cancha || '—')}</td></tr>`).join('') + '</tbody></table>' : '';

  const dias = P.dias.map(d => {
    const filas = d.filas.map((r, i) => `<tr><td class="n">${i + 1}</td><td class="j">${r.j != null ? 'J' + r.j : '—'}${r.ronda === 2 ? '<small>doble jornada</small>' : ''}</td><td class="idp">${idTxt(r.id)}</td><td>${eqCel(r.a)}</td><td>${eqCel(r.b)}</td>
      <td>${r.tentativo ? `<span class="rq-pill g">TENTATIVO</span><small style="display:block;margin-top:3px;color:#4b5563">Ya programado · ${efecto[r.efecto][1].toLowerCase()}</small>` : `<span class="rq-pill ${efecto[r.efecto][0]}">${efecto[r.efecto][1]}</span>`}</td>
      <td>${r.tentativo ? (esc(hora12(r.hora) || 'Por definir') + (r.cancha ? `<small style="display:block">${esc(r.cancha)}</small>` : '')) : 'Por definir'}</td></tr>`).join('');
    const extra = (d.sinPartido.length ? `<p style="margin-top:6px;font-size:12.5px;color:#b42318"><b>Sin partido ese domingo (no hay rival disponible):</b> ${d.sinPartido.map(t => esc(nombreEq(t))).join(', ')}.</p>` : '')
      + (d.terminaron.length ? `<p style="margin-top:4px;font-size:12.5px;color:#6b7280"><b>Ya sin partidos pendientes:</b> ${d.terminaron.map(t => esc(nombreEq(t))).join(', ')}.</p>` : '');
    return `<div class="rq-tit">Domingo ${fmt(d.fecha)} · Fecha ${d.fnum}</div>` + (d.filas.length
      ? `<table class="rq-tabla"><thead><tr><th style="width:36px">No.</th><th style="width:84px">Jornada</th><th style="width:50px">ID</th><th>Local</th><th>Visitante</th><th style="width:140px">Efecto</th><th style="width:96px">Hora / campo</th></tr></thead><tbody>${filas}</tbody></table>${extra}`
      : '<div style="padding:10px 14px;border:1px solid #cfd8c5;border-radius:6px;color:#6b7280;font-size:13px">No hay partidos por proponer para este domingo.</div>');
  }).join('');

  const resumenFilas = P.resumenEq.map(x => {
    const r = resumen(analizarEquipo(x.id)), nombre = nombreEq(x.id);
    return `<tr><td class="eq">${eqCel(x.id)}</td><td>${r.jugados}</td><td>${x.confirmados}</td><td><b>${x.propuestos}</b></td><td>${x.restantes}</td>
      <td>${x.debeDespues.length ? `<span class="rq-pill r">DEBE ${x.debeDespues.map(j => 'J' + j).join(', ')}</span>` : '<span class="rq-pill v">AL CORRIENTE</span>'}</td></tr>`;
  }).join('');
  const conflictos = P.conflictos.length ? `<div class="rq-nota-r" style="margin-top:14px;padding:10px 14px;border:1px solid #f5b5b5;background:#fdf3f3;border-radius:6px;font-size:12.5px;color:#b42318"><b>Revisar manualmente:</b> estas parejas ya no tienen una jornada en común disponible: ${P.conflictos.map(e => esc(nombreEq(e.a)) + ' vs ' + esc(nombreEq(e.b))).join(' · ')}.</div>` : '';

  return `<div class="rq-doc" style="width:900px">
    ${encabezado('Propuesta de programación', sub)}
    <div class="rq-body">
      <div style="display:flex;gap:10px;margin-bottom:6px">${kpis}</div>
      ${publicado}
      ${dias}
      <div class="rq-tit">Resumen por equipo después de la propuesta</div>
      <table class="rq-tabla"><thead><tr><th style="text-align:left;padding-left:14px">Equipo</th><th style="width:70px">Jugados</th><th style="width:84px">A disputar</th><th style="width:84px">Propuestos</th><th style="width:96px">Quedan por programar</th><th style="width:150px">Situación al terminar</th></tr></thead><tbody>${resumenFilas}</tbody></table>
      ${conflictos}
      <div class="rq-leyenda"><b>Cómo se arma la propuesta:</b> se parte de los partidos que cada equipo todavía no ha jugado y de las jornadas que le faltan. Los partidos ya <b>confirmados</b> (desde el jueves anterior a su domingo) se respetan, y los que ya están <b>programados</b> en la hoja pero aún no se publican se muestran como <b>tentativos</b> y también se respetan. Cada domingo se buscan los cruces que permiten el <b>mayor número de partidos</b>, y a cada uno se le asigna la <b>jornada más atrasada que ambos equipos todavía no tienen</b>, para que se pongan al corriente primero. ${doble ? 'Se permite una <b>doble jornada</b> el mismo domingo solo a equipos que aún deben jornadas.' : 'Cada equipo juega un solo partido por domingo.'} Hora y campo quedan por definir. <b>Es una propuesta</b>: la liga la valida y la programa.</div>
    </div>
    <div class="rq-pie"><span>Reporte generado desde los datos de partidos · Liga Next Level 7</span><span>${ahoraTxt()}</span></div></div>`;
}

// ═══════════════════════════════════════════════
//  SALIDAS: vista, PNG e impresión
// ═══════════════════════════════════════════════
function construir(){
  if (!PARTIDOS.length){ msg('Todavía no cargan los datos.', true); return null; }
  if ($('tipo').value === 'general') return { html: docGeneral(), nombre: 'control_jornadas' };
  if ($('tipo').value === 'domingo') return { html: docDomingo(), nombre: 'rol_propuesto_domingo' };
  if ($('tipo').value === 'horarios') return { html: docHorarios(parseInt($('sel-fechas').value, 10) || 3), nombre: 'propuesta_horarios' };
  if ($('tipo').value === 'tentativo') return { html: docTentativo(), nombre: 'rol_tentativo' };
  if ($('tipo').value === 'propuesta') return { html: docPropuesta(parseInt($('sel-fechas').value, 10) || 3, $('sel-doble').value === 'si'), nombre: 'propuesta_programacion' };
  const id = $('sel-equipo').value; if (!id){ msg('Selecciona un equipo primero.', true); return null; }
  const eq = EQUIPOS.find(e => idDe(e) === id);
  return { html: docEquipo(id), nombre: 'reporte_' + (eq['Nombre'] || id).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').toLowerCase() };
}
function ver(){
  const r = construir(); if (!r) return; msg('');
  const wrap = $('vista-wrap'), v = $('vista'); wrap.hidden = false; v.innerHTML = r.html;
  const doc = v.firstElementChild, ancho = parseInt(doc.style.width, 10) || 900, k = Math.min(1, wrap.clientWidth / ancho);
  doc.style.transform = `scale(${k})`; doc.style.transformOrigin = 'top left'; wrap.style.height = (doc.offsetHeight * k) + 'px';
}
async function descargar(){
  const r = construir(); if (!r) return; msg('Generando PNG...');
  const t = document.createElement('div'); t.style.cssText = 'position:fixed;left:-99999px;top:0'; t.innerHTML = r.html; document.body.appendChild(t);
  try {
    const doc = t.firstElementChild;
    await Promise.all([...doc.querySelectorAll('img')].map(i => i.complete ? 1 : new Promise(x => { i.onload = i.onerror = x; })));
    await new Promise(x => setTimeout(x, 150));
    const canvas = await html2canvas(doc, { backgroundColor: '#ffffff', scale: 2, useCORS: true, allowTaint: true, imageTimeout: 20000, logging: false });
    const a = document.createElement('a'); a.download = r.nombre + '.png'; a.href = canvas.toDataURL('image/png'); a.click(); msg('✅ PNG generado.');
  } catch (e){ console.error(e); msg('No se pudo generar el PNG.', true); }
  finally { document.body.removeChild(t); }
}
async function imprimir(){
  const r = construir(); if (!r) return; msg('');
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentWindow.document; d.open();
  d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(r.nombre)}</title><style>${css}@page{size:letter;margin:8mm}html,body{background:#fff!important;padding:0;display:block}.rq-doc{width:auto!important}</style></head><body>${r.html}</body></html>`); d.close();
  await Promise.all([...d.images].map(i => i.complete ? 1 : new Promise(x => { i.onload = i.onerror = x; })));
  await new Promise(x => setTimeout(x, 200)); f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => { try { f.remove(); } catch (e) {} }, 60000);
}
// ═══ Acceso con contraseña de administrador ═══
const ADMIN_PASSWORD = 'nl7admin';
function entrarReporte(){
  if ($('pass-reporte').value === ADMIN_PASSWORD){
    sessionStorage.setItem('nl7_reporte_ok', '1');
    document.body.classList.add('auth');
  } else { $('err-reporte').textContent = 'Contraseña incorrecta.'; }
}
$('pass-reporte').addEventListener('keydown', e => { if (e.key === 'Enter') entrarReporte(); });
if (sessionStorage.getItem('nl7_reporte_ok') === '1') document.body.classList.add('auth');

init();
