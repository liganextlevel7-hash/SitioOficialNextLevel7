<style>
:root{--lime:#5eb50d;--gold:#ddc530;--cian:#2fb8e0;--ink:#04100a;--panel:rgba(4,16,10,.86);--line:rgba(94,181,13,.38)}

<script>
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub?single=true&output=csv&gid=';
const GID={eq:'1894947293',pa:'1362473459',ju:'1940220650',pr:'626975401',ev:'645868286'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift().map(x=>x.trim());return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
let T={},PA={},S={},TOP=[],KEE=[];
const tf=d=>{const p=(d||'').split('/');return p.length==3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0};

/* ---------- estadísticas y selección de los 5 mejores ---------- */
function calcular(ju,pr,ev,pa){
  pa.forEach(p=>PA[p.ID_Partido]=p);
  ju.forEach(j=>{const t=T[j.Equipo];if(!t||['Penal','Default','Autogol'].includes(j.Nombre))return;S[j.ID_Jugador]={j,t,g:0,am:0,ro:0,pj:new Set(),gp:{},hat:0,conc:0,cm:new Set(),det:[],cs:0,tir:0,ok:0,porte:/^portero$/i.test((j.Posicion||'').trim())}});
  /* Regla: a cada portero se le cargan TODOS los goles en contra de su equipo (partidos con marcador capturado) */
  const JM={},JL=pa.filter(p=>p.Estado=='Jugado');
  JL.forEach(p=>[p.Equipo_Local,p.Equipo_Visita].forEach(e=>JM[e+'|'+p.Fecha]=p));
  pr.forEach(x=>{const s=S[x.Jugador],p=s&&JM[x.Equipo+'|'+x.Fecha];if(p)s.pj.add(p.ID_Partido)});
  Object.values(S).forEach(s=>{if(!s.porte)return;const e=s.j.Equipo;
    JL.forEach(p=>{if(p.Equipo_Local!=e&&p.Equipo_Visita!=e)return;const loc=p.Equipo_Local==e,c=+(loc?p.Goles_Visita:p.Goles_Local)||0;
      s.cm.add(p.ID_Partido);s.conc+=c;if(!c)s.cs++;s.det.push({p,c,rv:loc?p.Equipo_Visita:p.Equipo_Local})})});
  /* Eventos trae IDs de partido viejos: el partido real se identifica por los equipos de quienes anotaron en cada grupo y los marcadores */
  const gm=(p,t)=>+(p.Equipo_Local==t?p.Goles_Local:p.Goles_Visita),corr=[];
  ev.forEach(e=>{const u=corr[corr.length-1];if(u&&u.id==e.Partido)u.ev.push(e);else corr.push({id:e.Partido,ev:[e]})});
  corr.forEach(c=>{const g={};c.ev.forEach(e=>{const s=S[e.Jugador];if(s&&(e.Tipo_Evento||'').toLowerCase()=='gol'){const t=s.j.Equipo;g[t]=(g[t]||0)+1}});
    c.ev.forEach(e=>{const s=S[e.Jugador];if(!s)return;const k=(e.Tipo_Evento||'').toLowerCase();
      if(k=='gol'){s.g++;const t=s.j.Equipo;let best=[],bf=9;
        JL.forEach(p=>{if(p.Equipo_Local!=t&&p.Equipo_Visita!=t)return;const f=Math.abs((g[p.Equipo_Local]||0)-gm(p,p.Equipo_Local))+Math.abs((g[p.Equipo_Visita]||0)-gm(p,p.Equipo_Visita));
          if(f<bf){bf=f;best=[p]}else if(f==bf)best.push(p)});
        const pick=bf<=1?(best.find(p=>p.ID_Partido==c.id)||(best.length==1?best[0]:null)):null;
        if(pick)s.gp[pick.ID_Partido]=(s.gp[pick.ID_Partido]||0)+1}
      else if(k=='amarilla')s.am++;else if(k=='roja')s.ro++})});
  const all=Object.values(S);all.forEach(s=>{s.n=s.pj.size;Object.values(s.gp).forEach(n=>{if(n>=3)s.hat++})});
  TOP=all.filter(s=>s.g>0).sort((a,b)=>b.g-a.g).slice(0,5);   // igual que jugadores.js
  KEE=all.filter(s=>s.porte&&s.cm.size).sort((a,b)=>a.conc-b.conc||a.conc/a.cm.size-b.conc/b.cm.size||b.cm.size-a.cm.size).slice(0,5);   // igual que jugadores.js: menos goles recibidos, luego promedio, luego más partidos
}

/* ---------- escena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06130a);scene.fog=new THREE.Fog(0x06130a,70,200);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.5,400);
scene.add(new THREE.HemisphereLight(0xbfe8c0,0x0a1d10,.9));
const sun=new THREE.DirectionalLight(0xfff4d6,.95);sun.position.set(-15,40,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:25,bottom:-25,near:10,far:100});scene.add(sun);
(function(){
  const c=document.createElement('canvas');c.width=1600;c.height=1200;const x=c.getContext('2d'),U=20,X=v=>800+v*U,Z=v=>600+(v+4)*U;
  for(let i=0;i<16;i++){x.fillStyle=i%2?'#2a7a2d':'#348a3a';x.fillRect(0,i*75,1600,75)}
  x.strokeStyle='rgba(255,255,255,.92)';x.lineWidth=5;x.fillStyle='#fff';
  x.beginPath();x.moveTo(0,Z(-14));x.lineTo(1600,Z(-14));x.stroke();
  x.strokeRect(X(-24),Z(-14),48*U,19.6*U);x.strokeRect(X(-10.9),Z(-14),21.8*U,6.5*U);
  x.beginPath();x.arc(X(0),Z(-1),10.9*U,Math.PI/2-.92,Math.PI/2+.92);x.stroke();x.beginPath();x.arc(X(0),Z(-1),.35*U,0,7);x.fill();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const f=new THREE.Mesh(new THREE.PlaneGeometry(80,60),new THREE.MeshStandardMaterial({map:t,roughness:.95}));f.rotation.x=-Math.PI/2;f.position.z=-4;f.receiveShadow=true;scene.add(f);
  const m=new THREE.MeshStandardMaterial({color:0xffffff});
  [[.3,3.8,.3,-4.35,1.9,-14],[.3,3.8,.3,4.35,1.9,-14],[8.9,.3,.3,0,3.8,-14]].forEach(a=>{const b=new THREE.Mesh(new THREE.BoxGeometry(a[0],a[1],a[2]),m);b.position.set(a[3],a[4],a[5]);b.castShadow=true;scene.add(b)});
  const n=document.createElement('canvas');n.width=n.height=128;const y=n.getContext('2d');y.strokeStyle='rgba(255,255,255,.7)';y.lineWidth=2;for(let i=0;i<=128;i+=16){y.beginPath();y.moveTo(i,0);y.lineTo(i,128);y.moveTo(0,i);y.lineTo(128,i);y.stroke()}
  const nt=new THREE.CanvasTexture(n);nt.wrapS=nt.wrapT=THREE.RepeatWrapping;nt.repeat.set(5,3);
  const nm=new THREE.MeshBasicMaterial({map:nt,transparent:true,side:THREE.DoubleSide,depthWrite:false});
  const red=new THREE.Mesh(new THREE.PlaneGeometry(8.4,3.8),nm);red.position.set(0,1.9,-16.2);scene.add(red);
  [-1,1].forEach(a=>{const l=new THREE.Mesh(new THREE.PlaneGeometry(2.2,3.8),nm);l.rotation.y=Math.PI/2;l.position.set(a*4.3,1.9,-15.1);scene.add(l)});
  const k=document.createElement('canvas');k.width=512;k.height=96;const q=k.getContext('2d');q.fillStyle='#0b1a10';q.fillRect(0,0,512,96);
  const cols=['#5eb50d','#ddc530','#f3f5ee','#2f6db5','#c0392b','#8fa584'];for(let i=0;i<900;i++){q.fillStyle=cols[i%6];q.globalAlpha=.55+Math.random()*.4;q.fillRect(Math.random()*512,Math.random()*96,3,4)}
  const ct=new THREE.CanvasTexture(k);ct.encoding=THREE.sRGBEncoding;
  for(let i=0;i<3;i++){const ms=Array(6).fill(0).map((_,j)=>j==4?new THREE.MeshBasicMaterial({map:ct}):new THREE.MeshStandardMaterial({color:0x0e1f14}));
    const b=new THREE.Mesh(new THREE.BoxGeometry(70,1.8,2.4),ms);b.position.set(0,.9+i*1.8,-22-i*2.4);scene.add(b)}
})();
const bola=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));bola.castShadow=true;scene.add(bola);
(function(){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,128,64);x.fillStyle='#111';[[20,20],[64,12],[108,22],[40,48],[88,50]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,9,0,7);x.fill()});bola.material.map=new THREE.CanvasTexture(c)})();
const SPOT=new THREE.Vector3(0,.5,-1);bola.position.copy(SPOT);

/* ---------- jugadores ---------- */
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const cacheT={},tex=u=>cacheT[u]||(cacheT[u]=new Promise(ok=>{if(!u)return ok(null);loader.load(u,t=>{t.encoding=THREE.sRGBEncoding;ok(t)},undefined,()=>ok(null))}));
function prom(t,def){try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(t.image,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++}return n>8?new THREE.Color(r/n/255,g/n/255,b/n/255):def}catch(e){return def}}
function texto(t,tam,w,h,col){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.font=`bold ${tam}px Roboto,Arial`;x.lineWidth=tam/5;x.strokeStyle='#04100a';x.strokeText(t,w/2,h/2);x.fillStyle=col||'#fff';x.fillText(t,w/2,h/2);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.renderOrder=3;return s}
/* camiseta que cubre todo el torso (frente y espalda) */
function torsoMats(pla,col){col=new THREE.Color(col);const m=new THREE.MeshStandardMaterial({color:col,roughness:.7});if(!pla)return m;
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#'+col.getHexString();x.fillRect(0,0,256,256);x.drawImage(pla.image,0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;const f=new THREE.MeshBasicMaterial({map:t});return [m,m,m,m,f,f]}
const pieles=[0xf1c9a0,0xd9a577,0xb67b4f,0x8d5a3a],KC=[0xe8a317,0x2fb8e0,0x7ac143,0xd9534f,0x9b59b6];
const corto=s=>s.j.Apodo||s.j.Nombre.split(' ').slice(0,2).join(' ');
async function figura(s,i,gk){
  const def=new THREE.Color().setHSL((i*.137)%1,.55,.42),pla=await tex(s.t.Color_Playera),col=pla?prom(pla,def):def;
  const g=new THREE.Group(),cu=new THREE.Group();g.add(cu);const mat=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),piel=mat(pieles[(s.j.ID_Jugador.length+i)%4]);
  const ext=(r,h,m,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.85,h,10),m);b.position.y=-h/2;b.castShadow=true;p.add(b);cu.add(p);return p};
  const f={g,cu,s,gk,fase:Math.random()*9,mode:'idle',ry:0,pI:ext(.2,1,mat(0xf3f5ee),-.28,1.05),pD:ext(.2,1,mat(0xf3f5ee),.28,1.05),bI:ext(.15,.9,piel,-.68,1.95),bD:ext(.15,.9,piel,.68,1.95)};
  const to=new THREE.Mesh(new THREE.BoxGeometry(1.1,1,.5),torsoMats(pla,col));to.position.y=1.5;to.castShadow=true;cu.add(to);
  const sh=new THREE.Mesh(new THREE.BoxGeometry(1.1,.4,.52),mat(col.clone().multiplyScalar(.55)));sh.position.y=.95;cu.add(sh);
  if(gk)[-.68,.68].forEach(x=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),mat(0xf3f5ee));m.position.set(x,1.05,0);(x<0?f.bI:f.bD).add(m);m.position.set(0,-.95,0)});
  f.cab=new THREE.Mesh(new THREE.SphereGeometry(.58,20,16),piel);f.cab.position.y=2.55;f.cab.castShadow=true;cu.add(f.cab);
  f.cab.add(new THREE.Mesh(new THREE.SphereGeometry(.6,18,10,0,7,0,1.2),mat(0x1a1410)));
  const nm=texto(corto(s).slice(0,16),50,512,96,gk?'#7fe3ff':'#ffe27a');nm.scale.set(4.4,.83,1);nm.position.y=4.1;g.add(nm);
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,6,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=3;hit.userData.f=f;g.add(hit);f.hit=hit;
  return f;
}

/* ---------- tanda de penales ---------- */
let figs=[],tir=[],por=[],hits=[],sel=null,paused=false,spd=1,rnd=Math.random;
const R={st:'esp',t:0,n:0,gol:0,atj:0,last:null},V=(x,y,z)=>new THREE.Vector3(x,y,z);
const espT=i=>V((i-2)*3.3,0,10),espK=i=>V([-7,-10,-13,7,10][i],0,-12);
const ease=u=>u*u*(3-2*u),mez=(a,b,u)=>a.clone().lerp(b,u);
function ir(f,a,b,u){f.g.position.copy(mez(a,b,u));f.mode=u<1?'walk':'idle';const d=b.clone().sub(a);if(d.lengthSq()>.01)f.ry=Math.atan2(d.x,d.z)}
function ronda(){
  let k=0;do{k=Math.floor(rnd()*tir.length)}while(tir.length>1&&k===R.last);R.last=k;
  const sh=tir[k],kp=por[Math.floor(rnd()*por.length)];R.sh=sh;R.kp=kp;R.n++;
  const sg=sh.s.g/Math.max(sh.s.n,1),kc=kp.s.cm.size?kp.s.conc/kp.s.cm.size:2,p=Math.min(.9,Math.max(.3,.62+.1*(sg-1)+.04*(kc-2))),r=rnd();
  R.res=r<p?'gol':(r2=>r2<.7?'atajada':r2<.85?'poste':'fuera')(rnd());
  const lado=rnd()<.5?-1:1,centro=rnd()<.18;R.lado=centro?0:lado;
  R.dive=R.res=='atajada'?R.lado:(R.res=='gol'?(centro?(rnd()<.5?-1:1):-lado):(rnd()<.5?-1:1));
  R.tgt=R.res=='gol'?V(R.lado*3.3,.7+rnd()*2.2,-15.4):R.res=='atajada'?V(R.dive*2.6,1.2,-13.6):R.res=='poste'?V((R.lado||1)*4.35,1.6,-14.2):V((R.lado||1)*6.8,rnd()<.5?1:5.2,-15);
  if(R.res=='poste')R.lado=R.lado||1;
  R.a1=sh.g.position.clone();R.a2=kp.g.position.clone();R.st='ir';R.t=0;
  $('sN').textContent='Penal '+R.n;
}
function aviso(h,ms){const b=$('ban');b.innerHTML=h;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(()=>b.classList.remove('on'),ms)}
function paso(dt){
  if(paused)return;R.t+=dt*spd;const f=R.sh,k=R.kp,t=R.t;
  if(R.st=='esp'){if(t>.6)ronda();return}
  if(R.st=='ir'){const u=ease(Math.min(1,t/1.5));ir(f,R.a1,V(0,0,4.5),u);ir(k,R.a2,V(0,0,-14.3),u);
    if(t>1.5){f.ry=Math.PI;k.ry=0;f.mode=k.mode='idle';if(t>1.9){R.st='car';R.t=0;aviso(esc(corto(f.s))+' vs '+esc(corto(k.s)),1500)}}return}
  if(R.st=='car'){const u=Math.min(1,t/.7);f.g.position.set(0,0,4.5-4.3*u);f.mode='walk';f.fase+=dt*8;if(t>=.7){R.st='tiro';R.t=0;f.mode='kick'}return}
  if(R.st=='tiro'){const u=Math.min(1,t/.6),a=Math.min(1,Math.max(0,(t-.08)/.4));
    k.g.position.x=R.dive*3*a;k.cu.rotation.z=-R.dive*1.3*a;k.g.position.y=a*.4;
    if(R.res=='poste'&&u>=.75){const q=(u-.75)/.25;bola.position.set(R.tgt.x+R.lado*q*2,R.tgt.y*(1-q)+.5*q,-14.2+q*5)}
    else{const w=R.res=='poste'?u/.75:u;bola.position.set(SPOT.x+(R.tgt.x-SPOT.x)*w,SPOT.y+(R.tgt.y-SPOT.y)*w+Math.sin(w*Math.PI)*.5,SPOT.z+(R.tgt.z-SPOT.z)*w)}
    bola.rotation.x-=dt*14;
    if(t>=.6){R.st='res';R.t=0;resultado()}return}
  if(R.st=='res'){if(R.res=='atajada'&&t<1)bola.position.y=Math.max(.5,bola.position.y-dt*1.4);
    if(t>2.4){R.st='vuelta';R.t=0;f.mode=k.mode='idle';f.s.cel=k.s.cel=0;R.b1=f.g.position.clone();R.b2=k.g.position.clone()}return}
  if(R.st=='vuelta'){const u=ease(Math.min(1,t/1.5));ir(f,R.b1,espT(tir.indexOf(f)),u);ir(k,R.b2,espK(por.indexOf(k)),u);
    k.cu.rotation.z=k.cu.rotation.z*(1-u);k.g.position.y*=1-u;bola.position.lerp(SPOT,u);
    if(t>1.5){bola.position.copy(SPOT);f.ry=0;k.ry=0;k.cu.rotation.z=0;f.cab.rotation.x=k.cab.rotation.x=0;R.st='esp';R.t=0}}
}
function resultado(){
  const f=R.sh,k=R.kp;f.ry=0;f.s.tir++;k.s.tir++;
  if(R.res=='gol'){R.gol++;f.s.ok++;f.mode='cel';k.cab.rotation.x=.45;aviso('¡GOOOL!<br><small>'+esc(corto(f.s))+'</small>',2200)}
  else if(R.res=='atajada'){R.atj++;k.s.ok++;k.mode='cel';f.cab.rotation.x=.45;aviso('¡ATAJÓ!<br><small>'+esc(corto(k.s))+'</small>',2200)}
  else{k.mode='cel';f.cab.rotation.x=.45;aviso(R.res=='poste'?'¡AL POSTE!':'¡AFUERA!',2200)}
  $('sG').textContent=R.gol;$('sP').textContent=R.atj;
  panel();
}

/* ---------- panel y ficha ---------- */
function panel(){
  const fi=(f,k)=>{const s=f.s;return `<div class="fila ${k?'k':''} ${sel===s?'on':''}" data-id="${esc(s.j.ID_Jugador)}"><img src="${esc(s.j.Foto||s.t.URL)}" alt=""><div class="m"><b>${esc(corto(s))}</b><small>${esc(s.t.Nombre)} · ${k?s.cm.size+' PJ · '+s.conc+' recibidos':s.g+(s.g==1?' gol':' goles')}</small></div><em>${k?s.ok+'/'+s.tir:s.ok+'/'+s.tir}</em></div>`};
  $('lado').innerHTML=`<div class="tit">⚽ Goleadores · penales anotados</div>${tir.map(f=>fi(f,0)).join('')}<div class="tit k">🧤 Porteros · penales atajados</div>${por.map(f=>fi(f,1)).join('')}`;
  $('lado').querySelectorAll('.fila').forEach(e=>e.onclick=()=>{elegir(S[e.dataset.id]);document.body.classList.remove('ab')});
}
function elegir(s){
  sel=s;document.body.classList.toggle('sel',!!s);panel();if(!s)return;
  const j=s.j,k=s.porte,c=$('card');c.className='panel'+(k?' k':'');
  const g=k?[['Partidos',s.cm.size],['Recibidos',s.conc],['Por partido',s.cm.size?(s.conc/s.cm.size).toFixed(1):'—'],['Vallas invictas',s.cs],['Amarillas',s.am],['Rojas',s.ro]]
    :[['Goles',s.g],['Partidos',s.n],['Promedio',s.n?(s.g/s.n).toFixed(2):'—'],['Hat-tricks',s.hat],['Amarillas',s.am],['Rojas',s.ro]];
  c.innerHTML=`<button id="x" aria-label="Cerrar">×</button><div class="cab"><img src="${esc(j.Foto||s.t.URL)}" alt=""><div><h2>${esc(j.Nombre)}</h2><div class="ds">${j.Apodo?'“'+esc(j.Apodo)+'” · ':''}${j.Numero?'#'+esc(j.Numero)+' · ':''}${esc(j.Posicion||'Jugador')}</div><div class="ds" style="color:#cfe3b9">${esc(s.t.Nombre)}</div></div></div>
  <div class="grid">${g.map(([a,b])=>`<div><b>${b}</b><span>${a}</span></div>`).join('')}</div>
  <div class="grid" style="grid-template-columns:repeat(2,1fr)"><div><b>${s.ok}/${s.tir}</b><span>${k?'Penales atajados':'Penales anotados'} (tanda)</span></div><div><b>${s.tir?Math.round(s.ok/s.tir*100)+'%':'—'}</b><span>Efectividad</span></div></div>`
  +(k?`<div class="tit k" style="margin-top:4px">Goles recibidos por partido</div>`+(s.det.slice().sort((a,b)=>tf(b.p.Fecha)-tf(a.p.Fecha)).map(d=>`<div class="fila" style="cursor:default"><div class="m">vs ${esc(T[d.rv]?T[d.rv].Nombre:'?')}<small>${esc(d.p.Fecha)} · J${esc(d.p.Jornada)} · ${esc(d.p.Goles_Local)}-${esc(d.p.Goles_Visita)}</small></div><em>${d.c}</em></div>`).join('')||'<div class="fila" style="cursor:default">Sin partidos capturados</div>')+`<div style="font-size:11px;color:#9db38c;margin:6px 2px">Se le cargan todos los goles en contra de su equipo en partidos con marcador capturado.</div>`:'');
  $('x').onclick=()=>elegir(null);
}

/* ---------- cámara y controles ---------- */
const cam={th:0,ph:1.1,d:46,o:V(0,3,-4)},meta={th:0,ph:1.1,d:46},objetivo=V(0,3,-4);
function encuadre(){const a=innerWidth/innerHeight;meta.d=Math.min(78,Math.max(34,30/(.849*a)))}
const ptr=new Map(),ray=new THREE.Raycaster();let mov=0,pinch=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});mov=0;if(ptr.size==2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size==2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptr.values()],n=Math.hypot(a.x-b.x,a.y-b.y);meta.d=Math.min(110,Math.max(12,meta.d*pinch/n));pinch=n;mov=99;return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;mov+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;meta.th-=dx*.006;meta.ph=Math.min(1.45,Math.max(.3,meta.ph-dy*.005))});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(mov<8&&!ptr.size){ray.setFromCamera(V(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,0),camera);const h=ray.intersectObjects(hits)[0];elegir(h?h.object.userData.f.s:null)}});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();meta.d=Math.min(110,Math.max(12,meta.d*(1+e.deltaY*.001)))},{passive:false});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();encuadre()});
$('btnL').onclick=()=>document.body.classList.toggle('ab');
$('bP').onclick=()=>{paused=!paused;$('bP').textContent=paused?'▶ Seguir':'⏸ Pausa'};
$('bV').onclick=()=>{spd=spd==1?2:spd==2?3:1;$('bV').textContent='×'+spd};
$('bS').onclick=()=>{if(R.st=='esp'||R.st=='res'){R.t=99}};

/* ---------- animación ---------- */
const reloj=new THREE.Clock(),aroSel=new THREE.Mesh(new THREE.RingGeometry(1.5,1.9,40),new THREE.MeshBasicMaterial({color:0x5eb50d,transparent:true,opacity:.95,side:THREE.DoubleSide}));
aroSel.rotation.x=-Math.PI/2;aroSel.position.y=.08;aroSel.visible=false;scene.add(aroSel);
function animar(){
  requestAnimationFrame(animar);const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  if(R.on)paso(dt);
  figs.forEach(f=>{f.fase+=dt*(f.mode=='walk'?10:3);const s=Math.sin(f.fase);
    if(f.mode=='walk'){f.pI.rotation.x=s*.7;f.pD.rotation.x=-s*.7;f.bI.rotation.x=-s*.6;f.bD.rotation.x=s*.6;f.bI.rotation.z=.15;f.bD.rotation.z=-.15;f.g.position.y=0}
    else if(f.mode=='cel'){f.bI.rotation.z=2.6+s*.35;f.bD.rotation.z=-2.6-s*.35;f.pI.rotation.x=f.pD.rotation.x=0;f.g.position.y=Math.abs(Math.sin(f.fase*1.2))*.6}
    else if(f.mode=='kick'){f.pD.rotation.x=-1.1*Math.min(1,R.t/.15);f.pI.rotation.x=.2;f.bI.rotation.z=.15;f.bD.rotation.z=-.15}
    else{f.pI.rotation.x=s*.05;f.pD.rotation.x=-s*.05;f.bI.rotation.x=f.bD.rotation.x=0;f.bI.rotation.z=.15;f.bD.rotation.z=-.15;if(f!==R.kp||R.st=='esp')f.g.position.y=f.g.position.y*.8}
    f.cab.position.y=2.55+Math.sin(f.fase)*.04;
    let d=f.ry-f.cu.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));f.cu.rotation.y+=d*Math.min(1,dt*7)});
  if(sel){const f=figs.find(x=>x.s===sel);if(f){aroSel.visible=true;aroSel.position.x=f.g.position.x;aroSel.position.z=f.g.position.z;aroSel.scale.setScalar(1+Math.sin(t*4)*.08)}}else aroSel.visible=false;
  const k=Math.min(1,dt*4);cam.th+=(meta.th-cam.th)*k;cam.ph+=(meta.ph-cam.ph)*k;cam.d+=(meta.d-cam.d)*k;cam.o.lerp(objetivo,k);
  camera.position.set(cam.o.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.o.y+cam.d*Math.cos(cam.ph),cam.o.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.o);renderer.render(scene,camera);
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    const g=k=>fetch(SHEET+GID[k]).then(r=>r.text()).then(csv);
    const [eq,pa,ju,pr,ev]=await Promise.all([g('eq'),g('pa'),g('ju'),g('pr'),g('ev')]);
    eq.forEach(e=>T[e.ID_Equipo]=e);calcular(ju,pr,ev,pa);
    if(!TOP.length||!KEE.length)throw new Error('faltan goleadores o porteros en la hoja');
    for(let i=0;i<TOP.length;i++){const f=await figura(TOP[i],i,false);f.g.position.copy(espT(i));scene.add(f.g);figs.push(f);tir.push(f);hits.push(f.hit)}
    for(let i=0;i<KEE.length;i++){const f=await figura(KEE[i],i,true);f.g.position.copy(espK(i));scene.add(f.g);figs.push(f);por.push(f);hits.push(f.hit)}
    encuadre();cam.d=meta.d;panel();R.on=true;$('msg').remove();animar();
  }catch(e){$('msg').textContent='No se pudo cargar la hoja: '+e.message}
})();
</script>
