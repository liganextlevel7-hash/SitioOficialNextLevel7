<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicado oficial — Liga Next Level 7</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#142702;color:#eef7e6;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:14px;display:flex;flex-direction:column;align-items:center}
.nav{width:100%;max-width:960px;margin-bottom:12px}
.nav a{display:inline-block;padding:8px 18px;background:rgba(0,0,0,.6);border:1px solid #5eb50d;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.panel{width:100%;max-width:960px;background:rgba(0,0,0,.75);border:1px solid #5eb50d55;border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{color:#5eb50d;font-size:17px;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.campo{flex:1;min-width:200px}
.campo span{display:block;font-size:11px;color:#9db38c;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=date],textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #5eb50d66;background:#071019;color:#fff;font-size:15px;font-family:inherit}
textarea{min-height:190px;resize:vertical;line-height:1.5}
input:read-only,textarea:read-only{opacity:.65}
.btn{flex:1;min-width:150px;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;background:rgba(94,181,13,.18);color:#5eb50d;border:1px solid #5eb50d66}
.btn.pri{background:#5eb50d;color:#0a1a0d}
.btn.wa{background:#25d366;color:#05260f;border-color:#25d366}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.mini{flex:0 1 auto;min-width:0;padding:8px 12px;font-size:12px}
#lista-eq{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.eq-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #5eb50d33;border-radius:10px;background:#071019}
.eq-row.on{border-color:#5eb50d;background:#0e2306}
.eq-row input[type=checkbox]{width:20px;height:20px;accent-color:#5eb50d;flex-shrink:0}
.eq-row img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.eq-row .eq-n{flex:1;font-weight:700;font-size:13px;text-transform:uppercase;line-height:1.15;min-width:0}
.eq-row select{padding:6px;border-radius:8px;border:1px solid #5eb50d66;background:#142702;color:#fff;font-size:12px;max-width:128px}
.eq-row select.e-confirmo{border-color:#2f9e44;color:#8fe89a}
.eq-row select.e-descansa{border-color:#9ca3af;color:#cfd4db}
.eq-row select.e-sin{border-color:#e0a800;color:#f3c94a}
@media(max-width:700px){#lista-eq{grid-template-columns:1fr}}
#msg{font-size:13px;color:#9db38c;text-align:center;min-height:18px;margin-top:4px}
#msg.err{color:#ff6b6b}
#msg.ok{color:#8fe89a}
.nota{font-size:12px;color:#9db38c;margin-top:6px}
#acciones[hidden]{display:none}
#vista-wrap{width:100%;max-width:960px;overflow-x:auto;border-radius:10px;background:#f3f5ef}

/* ===== DOCUMENTO (PNG / impresión) ===== */
.rq-doc{background:#fff;color:#1f2933;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;width:900px;position:relative}
.rq-doc *{box-sizing:border-box}
.rq-head{background:#1d3d05;color:#fff;padding:20px 32px 18px;border-bottom:6px solid #5eb50d;display:flex;justify-content:space-between;align-items:center;gap:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-liga{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#b9d8a0;font-weight:600}
.rq-titulo{font-size:28px;font-weight:800;margin-top:6px;line-height:1.15}
.rq-sub{font-size:14px;color:#d6e6c8;margin-top:4px}
.rq-der{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;font-size:12px;color:#d6e6c8;line-height:1.5}
.rq-logos{display:flex;gap:10px}
.rq-logos img{height:54px;width:auto;object-fit:contain}
.rq-folio{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:1px;background:#5eb50d;color:#0a1a0d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-folio.borrador{background:#fff4d6;color:#8a6100}
.rq-body{padding:24px 32px 8px}
.rq-dirigido{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:6px}
.rq-asunto{font-size:24px;font-weight:800;line-height:1.2;color:#1d3d05;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #e8f1dc}
.rq-texto{font-size:15.5px;line-height:1.65;color:#1f2933;white-space:pre-wrap;word-wrap:break-word;min-height:80px}
.rq-firma{margin-top:30px;text-align:center;font-size:14px;color:#374151;white-space:pre-wrap}
.rq-firma b{display:block;font-size:15px;color:#1d3d05;margin-top:4px}
.rq-equipos{margin:26px 32px 0;border:1px solid #cfd8c5;border-radius:6px;overflow:hidden}
.rq-equipos h3{background:#e8f1dc;color:#1d3d05;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid #cfd8c5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rq-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.rq-eq{display:flex;align-items:center;gap:8px;padding:8px 10px;border-right:1px solid #d9e0d0;border-bottom:1px solid #d9e0d0;min-height:46px}
.rq-eq:nth-child(4n){border-right:none}
.rq-eq img{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.rq-eq span{font-weight:700;text-transform:uppercase;font-size:11.5px;line-height:1.15}
.rq-equipos.est-v h3{background:#e3f4e6;color:#1b6e2e}
.rq-equipos.est-g h3{background:#eef0f3;color:#4b5563}
.rq-equipos.est-a h3{background:#fff4d6;color:#8a6100}
.rq-equipos+.rq-equipos{margin-top:14px}
.rq-pie{margin:18px 32px 0;padding:12px 0 18px;border-top:1px solid #d9e0d0;font-size:11px;color:#6b7280;display:flex;justify-content:space-between;gap:10px}

@media print{
  body{background:#fff;padding:0;display:block}
  .nav,.panel,#msg{display:none!important}
  #vista-wrap{max-width:none;background:#fff;overflow:visible}
  .rq-doc{width:100%}
  @page{size:letter;margin:10mm}
}
@media(max-width:700px){ .campo{min-width:100%} }
</style>
</head>
<body>
<div class="nav"><a href="index.html">← Inicio</a></div>

<div class="panel">
  <h2>📢 Nuevo comunicado oficial</h2>
  <div class="fila">
    <label class="campo" style="flex:2"><span>Asunto / título del comunicado</span>
      <input type="text" id="titulo" maxlength="120" placeholder="Ej. Cambio de horarios para el próximo domingo" autocomplete="off"></label>
    <label class="campo"><span>Fecha</span>
      <input type="date" id="fecha"></label>
  </div>
  <div class="fila">
    <label class="campo"><span>Texto del comunicado</span>
      <textarea id="texto" placeholder="Escribe aquí el comunicado. Los saltos de línea se respetan."></textarea></label>
  </div>
  <div class="fila">
    <div class="campo" style="min-width:100%"><span>Equipos: marca a quién va dirigido y el estatus de cada uno</span>
      <div class="fila" style="margin-bottom:8px">
        <button class="btn mini" onclick="selTodos()">Dirigir a todos</button>
        <button class="btn mini" onclick="selNinguno()">Quitar a todos</button>
        <button class="btn mini" onclick="selSinConfirmar()">Dirigir solo a los sin confirmar</button>
        <button class="btn mini" onclick="todosSinConfirmar()">Marcar todos: sin confirmar</button>
      </div>
      <div id="lista-eq"></div>
      <div class="nota" id="resumen-sel"></div>
    </div>
  </div>
  <div class="fila">
    <label class="campo"><span>Firma</span>
      <input type="text" id="firma" value="Atentamente, Comité organizador" autocomplete="off"></label>
  </div>
  <div class="fila">
    <button class="btn pri" id="btnGenerar" onclick="generar()">✅ Generar comunicado con folio</button>
    <button class="btn" id="btnNuevo" onclick="nuevo()" hidden>➕ Nuevo comunicado</button>
  </div>
  <div id="acciones" hidden>
    <div class="fila">
      <button class="btn wa" onclick="compartirImagen()">📲 Enviar imagen por WhatsApp</button>
      <button class="btn wa" onclick="enviarTexto()">💬 Enviar texto por WhatsApp</button>
    </div>
    <div class="fila">
      <button class="btn" onclick="descargar()">📥 Descargar PNG</button>
      <button class="btn" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </div>
  <div id="msg">Cargando equipos...</div>
  <div class="nota" id="nota-folio"></div>
</div>

<div id="vista-wrap"><div id="doc"></div></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIGURACIÓN
// ═══════════════════════════════════════════════
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub';
const URL_EQUIPOS = `${PUB}?gid=1894947293&single=true&output=csv`;

// Equipos dados de baja (además de los que tengan Status = "baja" en la hoja de Equipos):
// 11 = Ballenitas, 15 = Dem Team.
const IDS_BAJA = ['11', '15'];

// FOLIO CONSECUTIVO
// Déjalo vacío para guardar el consecutivo solo en este navegador.
// Para que el folio sea el mismo desde cualquier celular o computadora, pega aquí la URL de la
// aplicación web de Google Apps Script (ver archivo folio-appsscript.gs).
const APPS_SCRIPT_URL = '';
const PREFIJO_FOLIO = 'COM-';
const LS_KEY = 'nl7_comunicado_ultimo_folio';

// ═══════════════════════════════════════════════
//  UTILIDADES
// ═══════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2 = n => String(n).padStart(2, '0');
let EQUIPOS = [];
let FOLIO = null;        // null = borrador
let GENERADO = null;     // { folio, fechaTxt, horaTxt } cuando ya se generó
let SEL = new Set();     // equipos a los que va dirigido
let EST = {};            // estatus por equipo: 'confirmo' | 'descansa' | 'sin' | ''
const ESTADOS = [
  ['confirmo', '✅', 'Confirmaron', 'v'],
  ['descansa', '😴', 'Descansan', 'g'],
  ['sin',      '⏳', 'Sin confirmar', 'a']
];
const idDe = e => String(e['ID_Equipo']).trim();
const seleccionados = () => EQUIPOS.filter(e => SEL.has(idDe(e)));
const porEstado = k => EQUIPOS.filter(e => EST[idDe(e)] === k);
const todosSel = () => EQUIPOS.length > 0 && SEL.size === EQUIPOS.length;
const eqCelda = e => `<div class="rq-eq"><img src="${esc(e['URL'] || '')}" crossorigin="anonymous" onerror="this.style.opacity='.15'"><span>${esc(e['Nombre'])}</span></div>`;
function dirigidoTxt(){
  if (todosSel()) return 'A todos los equipos participantes';
  return SEL.size === 1 ? 'Al siguiente equipo' : 'A los siguientes equipos';
}

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ','){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const [cab, ...resto] = rows;
  return resto.filter(r => r.some(c => c.trim())).map(r => { const o = {}; cab.forEach((h, i) => o[h.trim()] = (r[i] || '').trim()); return o; });
}
const esBaja = e => (e['Status'] || '').trim().toLowerCase() === 'baja' || IDS_BAJA.includes(String(e['ID_Equipo']).trim());
const fmtFecha = d => `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`;
function fechaDelInput(){
  const v = $('fecha').value; if (!v) return fmtFecha(new Date());
  const [a, m, d] = v.split('-').map(Number); return fmtFecha(new Date(a, m - 1, d));
}
function hoyISO(){ const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; }
function msg(t, tipo){ $('msg').textContent = t; $('msg').className = tipo || ''; }

// ═══════════════════════════════════════════════
//  CARGA DE EQUIPOS ACTIVOS
// ═══════════════════════════════════════════════
async function init(){
  $('fecha').value = hoyISO();
  $('nota-folio').textContent = APPS_SCRIPT_URL
    ? 'El folio consecutivo se guarda en tu hoja de Google (igual desde cualquier dispositivo).'
    : 'El folio consecutivo se guarda solo en este navegador. Para que sea el mismo desde cualquier dispositivo, configura APPS_SCRIPT_URL.';
  try {
    const txt = await fetch(URL_EQUIPOS).then(r => r.text());
    EQUIPOS = parseCSV(txt).filter(e => String(e['ID_Equipo'] || '').trim() && !esBaja(e))
      .sort((a, b) => (a['Nombre'] || '').localeCompare(b['Nombre'] || '', 'es'));
    SEL = new Set(EQUIPOS.map(idDe)); EST = {};
    renderSelector();
    msg(`${EQUIPOS.length} equipos activos cargados. Escribe el comunicado y presiona "Generar".`);
  } catch (e){
    EQUIPOS = [];
    msg('No se pudieron cargar los equipos. Revisa tu conexión y recarga la página.', 'err');
  }
  ['titulo','texto','firma','fecha'].forEach(id => $(id).addEventListener('input', render));
  $('lista-eq').addEventListener('change', ev => {
    const t = ev.target, id = t.dataset.id; if (!id) return;
    if (t.type === 'checkbox'){ t.checked ? SEL.add(id) : SEL.delete(id); }
    else { EST[id] = t.value; t.className = t.value ? 'e-' + t.value : ''; }
    t.closest('.eq-row').classList.toggle('on', SEL.has(id));
    resumenSel(); render();
  });
  render();
}

// ═══════════════════════════════════════════════
//  SELECCIÓN DE EQUIPOS Y ESTATUS
// ═══════════════════════════════════════════════
function renderSelector(){
  $('lista-eq').innerHTML = EQUIPOS.map(e => {
    const id = idDe(e), est = EST[id] || '';
    return `<div class="eq-row ${SEL.has(id) ? 'on' : ''}">
      <input type="checkbox" data-id="${esc(id)}" ${SEL.has(id) ? 'checked' : ''} title="Dirigido a este equipo">
      <img src="${esc(e['URL'] || '')}" onerror="this.style.opacity='.15'">
      <span class="eq-n">${esc(e['Nombre'])}</span>
      <select data-id="${esc(id)}" class="${est ? 'e-' + est : ''}">
        <option value="" ${est === '' ? 'selected' : ''}>Sin estatus</option>
        <option value="confirmo" ${est === 'confirmo' ? 'selected' : ''}>✅ Confirmó</option>
        <option value="descansa" ${est === 'descansa' ? 'selected' : ''}>😴 Descansa</option>
        <option value="sin" ${est === 'sin' ? 'selected' : ''}>⏳ Sin confirmar</option>
      </select></div>`;
  }).join('');
  resumenSel(); render();
}
function resumenSel(){
  const c = k => porEstado(k).length;
  $('resumen-sel').textContent = `Dirigido a ${SEL.size} de ${EQUIPOS.length} equipos · Confirmaron: ${c('confirmo')} · Descansan: ${c('descansa')} · Sin confirmar: ${c('sin')}`;
}
function selTodos(){ SEL = new Set(EQUIPOS.map(idDe)); renderSelector(); }
function selNinguno(){ SEL = new Set(); renderSelector(); }
function selSinConfirmar(){
  const l = porEstado('sin');
  if (!l.length){ msg('Primero marca el estatus "Sin confirmar" a los equipos que faltan.', 'err'); return; }
  SEL = new Set(l.map(idDe)); renderSelector(); msg('');
}
function todosSinConfirmar(){ EQUIPOS.forEach(e => EST[idDe(e)] = 'sin'); renderSelector(); }

// ═══════════════════════════════════════════════
//  DOCUMENTO
// ═══════════════════════════════════════════════
function render(){
  const titulo = $('titulo').value.trim() || 'Título del comunicado';
  const texto = $('texto').value || 'El texto del comunicado aparecerá aquí.';
  const folio = GENERADO ? GENERADO.folio : null;
  const fechaTxt = GENERADO ? GENERADO.fechaTxt : fechaDelInput();
  const firmaLineas = $('firma').value.trim().split(/,\s*/);
  const firmaHTML = $('firma').value.trim()
    ? (firmaLineas.length > 1 ? `${esc(firmaLineas[0])},<b>${esc(firmaLineas.slice(1).join(', '))}</b>` : `<b>${esc(firmaLineas[0])}</b>`)
    : '';
  const dest = seleccionados();
  const tituloDest = todosSel() ? `Equipos participantes (${dest.length})` : `Dirigido a (${dest.length} ${dest.length === 1 ? 'equipo' : 'equipos'})`;
  const bloqueDest = dest.length ? `<div class="rq-equipos"><h3>${tituloDest}</h3><div class="rq-grid">${dest.map(eqCelda).join('')}</div></div>` : '';
  const bloquesEst = ESTADOS.map(([k, emo, tit, c]) => {
    const l = porEstado(k);
    return l.length ? `<div class="rq-equipos est-${c}"><h3>${emo} ${tit} (${l.length})</h3><div class="rq-grid">${l.map(eqCelda).join('')}</div></div>` : '';
  }).join('');
  const pie = GENERADO ? `Comunicado generado el ${esc(GENERADO.fechaTxt)} a las ${esc(GENERADO.horaTxt)}` : 'Borrador: aún no tiene folio';
  $('doc').innerHTML = `
  <div class="rq-doc" id="rq-doc">
    <div class="rq-head">
      <div>
        <div class="rq-liga">Liga Next Level 7 · Torneo Dominical</div>
        <div class="rq-titulo">COMUNICADO OFICIAL</div>
        <div class="rq-sub">${esc(fechaTxt)}</div>
      </div>
      <div class="rq-der">
        <div class="rq-logos">
          <img src="logo-liga.png.png" crossorigin="anonymous" onerror="this.style.display='none'">
          <img src="laregionallstars.png" crossorigin="anonymous" onerror="this.style.display='none'">
        </div>
        <span class="rq-folio ${folio ? '' : 'borrador'}">${folio ? 'FOLIO ' + esc(folio) : 'BORRADOR'}</span>
      </div>
    </div>
    <div class="rq-body">
      <div class="rq-dirigido">${esc(dirigidoTxt())}</div>
      <div class="rq-asunto">${esc(titulo)}</div>
      <div class="rq-texto">${esc(texto)}</div>
      ${firmaHTML ? `<div class="rq-firma">${firmaHTML}</div>` : ''}
    </div>
    ${bloqueDest}
    ${bloquesEst}
    <div class="rq-pie"><span>${pie}</span><span>Liga Next Level 7</span></div>
  </div>`;
}

// ═══════════════════════════════════════════════
//  FOLIO CONSECUTIVO
// ═══════════════════════════════════════════════
const folioTxt = n => PREFIJO_FOLIO + String(n).padStart(3, '0');
async function siguienteFolio(titulo, fechaTxt){
  if (APPS_SCRIPT_URL){
    const url = `${APPS_SCRIPT_URL}?accion=siguiente&titulo=${encodeURIComponent(titulo)}&fecha=${encodeURIComponent(fechaTxt)}`;
    const r = await fetch(url).then(x => x.json());
    if (!r || !r.folio) throw new Error((r && r.error) || 'Respuesta inválida del servidor de folios');
    return r.folio;
  }
  let ult = 0;
  try { ult = parseInt(localStorage.getItem(LS_KEY), 10) || 0; } catch (e){}
  const n = ult + 1;
  try { localStorage.setItem(LS_KEY, String(n)); } catch (e){ throw new Error('Este navegador no permite guardar el consecutivo.'); }
  return folioTxt(n);
}

// ═══════════════════════════════════════════════
//  ACCIONES
// ═══════════════════════════════════════════════
async function generar(){
  const titulo = $('titulo').value.trim(), texto = $('texto').value.trim();
  if (!titulo){ msg('Escribe el asunto del comunicado.', 'err'); $('titulo').focus(); return; }
  if (!texto){ msg('Escribe el texto del comunicado.', 'err'); $('texto').focus(); return; }
  if (!EQUIPOS.length){ msg('No hay equipos cargados. Recarga la página.', 'err'); return; }
  if (!SEL.size){ msg('Marca al menos un equipo al que va dirigido el comunicado.', 'err'); return; }
  $('btnGenerar').disabled = true; msg('Generando folio...');
  try {
    const fechaTxt = fechaDelInput();
    const folio = await siguienteFolio(titulo, fechaTxt);
    const ahora = new Date();
    let h = ahora.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    GENERADO = { folio, fechaTxt, horaTxt: `${h}:${p2(ahora.getMinutes())} ${ap}` };
    ['titulo','texto','firma','fecha'].forEach(id => $(id).readOnly = true); bloquearEquipos(true);
    $('acciones').hidden = false; $('btnNuevo').hidden = false; $('btnGenerar').hidden = true;
    render();
    msg(`Comunicado generado con folio ${folio}. Ya puedes enviarlo por WhatsApp.`, 'ok');
    $('vista-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e){
    $('btnGenerar').disabled = false;
    msg('No se pudo generar el folio: ' + e.message, 'err');
  }
  $('btnGenerar').disabled = false;
}
function bloquearEquipos(b){ document.querySelectorAll('#lista-eq input, #lista-eq select, .btn.mini').forEach(x => x.disabled = b); }
function nuevo(){
  GENERADO = null;
  ['titulo','texto','firma','fecha'].forEach(id => $(id).readOnly = false); bloquearEquipos(false);
  SEL = new Set(EQUIPOS.map(idDe)); EST = {}; renderSelector();
  $('titulo').value = ''; $('texto').value = ''; $('fecha').value = hoyISO();
  $('acciones').hidden = true; $('btnNuevo').hidden = true; $('btnGenerar').hidden = false;
  msg(`${EQUIPOS.length} equipos activos cargados. Escribe el comunicado y presiona "Generar".`);
  render(); $('titulo').focus();
}
async function blobPNG(){
  if (typeof html2canvas === 'undefined') throw new Error('No cargó la librería de imágenes (revisa tu conexión).');
  const canvas = await html2canvas($('rq-doc'), { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
  return new Promise((ok, fail) => canvas.toBlob(b => b ? ok(b) : fail(new Error('No se pudo crear la imagen')), 'image/png'));
}
function guardarBlob(blob, nombre){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function descargar(){
  if (!GENERADO) return;
  try { msg('Preparando imagen...'); guardarBlob(await blobPNG(), `Comunicado_${GENERADO.folio}.png`); msg('Imagen descargada.', 'ok'); }
  catch (e){ msg(e.message, 'err'); }
}
function textoWhatsApp(){
  const f = $('firma').value.trim();
  const nom = l => l.map(e => e['Nombre']).join(', ');
  const dest = todosSel() ? '' : `*Dirigido a:* ${nom(seleccionados())}\n\n`;
  const est = ESTADOS.map(([k, emo, tit]) => { const l = porEstado(k); return l.length ? `${emo} *${tit} (${l.length}):* ${nom(l)}` : ''; }).filter(Boolean).join('\n');
  return `*COMUNICADO OFICIAL ${GENERADO.folio}*\n*${$('titulo').value.trim()}*\n${GENERADO.fechaTxt}\n\n${dest}${$('texto').value.trim()}\n\n${est ? est + '\n\n' : ''}${f ? f + '\n' : ''}_Liga Next Level 7_`;
}
function enviarTexto(){
  if (!GENERADO) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(textoWhatsApp()), '_blank');
}
async function compartirImagen(){
  if (!GENERADO) return;
  try {
    msg('Preparando imagen...');
    const blob = await blobPNG();
    const nombre = `Comunicado_${GENERADO.folio}.png`;
    const file = new File([blob], nombre, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: `Comunicado ${GENERADO.folio}`, text: `Comunicado oficial ${GENERADO.folio} · Liga Next Level 7` });
      msg('Elige WhatsApp y el grupo o contacto en la ventana de compartir.', 'ok');
    } else {
      guardarBlob(blob, nombre);
      window.open('https://wa.me/', '_blank');
      msg('Tu navegador no comparte imágenes directo: se descargó el PNG. Adjúntalo en el chat de WhatsApp que se abrió.', 'ok');
    }
  } catch (e){
    if (e && e.name === 'AbortError') { msg('Envío cancelado.'); return; }
    msg('No se pudo enviar la imagen: ' + e.message, 'err');
  }
}

init();
</script>
