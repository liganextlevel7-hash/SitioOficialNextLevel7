<script>
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRs55yHIAY-lWfU6XccheWIPHUjF4aRue0jy68FbZ9fNtPJfeO1glwsWI46cWv-6cxXy2slGty-DgMd/pub?single=true&output=csv&gid=';
const GID={eq:'1894947293',pa:'1362473459',ju:'1940220650',pr:'626975401',ev:'645868286'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift().map(x=>x.trim());return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
const tf=s=>{const p=(s||'').split('/');return p.length==3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0};
let T={},PA={},S={},lista=[],cat='gol',sel=null,resumen={};

/* ---------- estadísticas por jugador ---------- */
function calcular(ju,pr,ev,pa){
  pa.forEach(p=>PA[p.ID_Partido]=p);
  ju.forEach(j=>{const t=T[j.Equipo];if(!t||['Penal','Default','Autogol'].includes(j.Nombre))return;S[j.ID_Jugador]={j,t,g:0,am:0,ro:0,pj:new Set(),gp:{},gx:0,conc:0,cpj:0,hat:0,dob:0}});
  /* Los ID de partido de Participaciones y Eventos son viejos (hoy apuntan a otros partidos). El partido real se identifica:
     - asistencia: por EQUIPO + FECHA
     - goles: por los equipos de quienes anotaron en cada grupo de goles, comparados con los marcadores reales */
  const JL=pa.filter(p=>p.Estado=='Jugado'),JM={};
  JL.forEach(p=>[p.Equipo_Local,p.Equipo_Visita].forEach(e=>JM[e+'|'+p.Fecha]=p));
  pr.forEach(x=>{const s=S[x.Jugador],p=s&&JM[x.Equipo+'|'+x.Fecha];if(p)s.pj.add(p.ID_Partido)});
  /* portero: se le cargan todos los goles en contra de su equipo */
  Object.values(S).forEach(s=>{if(!/portero/i.test(s.j.Posicion||''))return;const e=s.j.Equipo;
    JL.forEach(p=>{if(p.Equipo_Local!=e&&p.Equipo_Visita!=e)return;s.conc+=+(p.Equipo_Local==e?p.Goles_Visita:p.Goles_Local)||0;s.cpj++})});
  let goles=0;const gm=(p,t)=>+(p.Equipo_Local==t?p.Goles_Local:p.Goles_Visita);
  const corridas=[];ev.forEach(e=>{const u=corridas[corridas.length-1];if(u&&u.id==e.Partido)u.ev.push(e);else corridas.push({id:e.Partido,ev:[e]})});
  corridas.forEach(c=>{const g={};c.ev.forEach(e=>{const s=S[e.Jugador];if(s&&(e.Tipo_Evento||'').toLowerCase()=='gol'){const t=s.j.Equipo;g[t]=(g[t]||0)+1}});
    c.ev.forEach(e=>{const s=S[e.Jugador];if(!s)return;const k=(e.Tipo_Evento||'').toLowerCase();
      if(k=='gol'){s.g++;goles++;const t=s.j.Equipo;let best=[],bf=9;
        JL.forEach(p=>{if(p.Equipo_Local!=t&&p.Equipo_Visita!=t)return;const f=Math.abs((g[p.Equipo_Local]||0)-gm(p,p.Equipo_Local))+Math.abs((g[p.Equipo_Visita]||0)-gm(p,p.Equipo_Visita));
          if(f<bf){bf=f;best=[p]}else if(f==bf)best.push(p)});
        const pick=bf<=1?(best.find(p=>p.ID_Partido==c.id)||(best.length==1?best[0]:null)):null;
        if(pick){s.gp[pick.ID_Partido]=(s.gp[pick.ID_Partido]||0)+1;s.pj.add(pick.ID_Partido)}else s.gx++}
      else if(k=='amarilla')s.am++;else if(k=='roja')s.ro++})});
  Object.values(S).forEach(s=>{Object.values(s.gp).forEach(n=>{if(n>=3)s.hat++;else if(n==2)s.dob++});s.n=s.pj.size;s.pg=Object.keys(s.gp).length;s.mx=Math.max(0,...Object.values(s.gp))});
  const jug=pa.filter(p=>p.Estado=='Jugado').length;
  resumen={goles,jug,prom:jug?(goles/jug).toFixed(1):'0',gol:Object.values(S).filter(s=>s.g).length};
}
const MAX=20;
const topN=(k,txt,bar,f=s=>s.g>0)=>Object.values(S).filter(f).sort(k).slice(0,MAX).map(s=>({s,txt:txt(s),bar:bar(s)}));
const CATS={
  gol:['⚽ Goleadores',()=>topN((a,b)=>b.g-a.g,s=>s.g+(s.g==1?' gol':' goles'),s=>s.g)],
  prom:['📈 Promedio',()=>topN((a,b)=>b.g/Math.max(b.n,1)-a.g/Math.max(a.n,1)||b.g-a.g,s=>(s.g/Math.max(s.n,1)).toFixed(2)+' por partido',s=>s.g/Math.max(s.n,1))],
  hat:['🎩 Hat-trick (3 en un partido)',()=>topN((a,b)=>b.hat-a.hat||b.mx-a.mx||b.g-a.g,s=>s.hat+(s.hat==1?' hat-trick':' hat-tricks')+' · máx. '+s.mx+' goles en un partido',s=>s.hat*10+s.mx,s=>s.hat>0)],
  pg:['🔥 Partidos con gol',()=>topN((a,b)=>b.pg-a.pg||b.g-a.g,s=>s.pg+(s.pg==1?' partido':' partidos')+' anotando',s=>s.pg)]
};

/* ---------- escena ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<=760?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x85bfea);scene.fog=new THREE.Fog(0x9ac5dd,110,240);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.5,400);
scene.add(new THREE.HemisphereLight(0xbfe8c0,0x0a1d10,.9));
const sun=new THREE.DirectionalLight(0xfff4da,.95);sun.position.set(-25,50,20);sun.castShadow=true;
const shadowSize=innerWidth<=760?512:1024;sun.shadow.mapSize.set(shadowSize,shadowSize);Object.assign(sun.shadow.camera,{left:-45,right:45,top:35,bottom:-35,near:10,far:120});scene.add(sun);

const PW=74,PH=48.6;
function campoTex(){
  const K=1.5,c=document.createElement('canvas');c.width=1400*K;c.height=920*K;const x=c.getContext('2d');x.scale(K,K);
  for(let i=0;i<14;i++){const gr=x.createLinearGradient(0,0,0,920);const a1=i%2?'#2a7a2d':'#348a3a',a2=i%2?'#276f2a':'#30823a';gr.addColorStop(0,a1);gr.addColorStop(.5,a2);gr.addColorStop(1,a1);x.fillStyle=gr;x.fillRect(i*100,0,100,920)}
  let sd=7;const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let n=0;n<9000;n++){x.fillStyle=rr()<.5?'rgba(255,255,255,.05)':'rgba(0,30,0,.08)';x.fillRect(rr()*1400,rr()*920,1+rr()*2,3+rr()*7)}
  x.strokeStyle='rgba(255,255,255,.92)';x.fillStyle='rgba(255,255,255,.95)';x.lineWidth=5;x.lineJoin='round';const m=40;
  x.strokeRect(m,m,1320,840);x.beginPath();x.moveTo(700,m);x.lineTo(700,880);x.stroke();x.beginPath();x.arc(700,460,95,0,7);x.stroke();
  x.beginPath();x.arc(700,460,7,0,7);x.fill();
  [[m,1],[1360,-1]].forEach(([px,s])=>{x.strokeRect(s>0?px:px-230,250,230,420);x.strokeRect(s>0?px:px-95,360,95,200);
    const cx=s>0?m+165:1360-165;x.beginPath();x.arc(cx,460,6,0,7);x.fill();
    x.beginPath();if(s>0)x.arc(cx,460,95,-.82,.82);else x.arc(cx,460,95,Math.PI-.82,Math.PI+.82);x.stroke()});
  [[m,m,0],[1360,m,Math.PI/2],[1360,880,Math.PI],[m,880,Math.PI*1.5]].forEach(([cx,cy,a0])=>{x.beginPath();x.arc(cx,cy,14,a0,a0+Math.PI/2);x.stroke()});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
const campo=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshStandardMaterial({map:campoTex(),roughness:.95}));
campo.rotation.x=-Math.PI/2;campo.receiveShadow=true;scene.add(campo);
const suelo=new THREE.Mesh(new THREE.CircleGeometry(220,48),new THREE.MeshStandardMaterial({color:0x203e22,roughness:1}));
suelo.rotation.x=-Math.PI/2;suelo.position.y=-.05;scene.add(suelo);

(function(){
  const netC=document.createElement('canvas');netC.width=netC.height=32;const nx=netC.getContext('2d');nx.strokeStyle='rgba(255,255,255,.9)';nx.lineWidth=2;nx.strokeRect(0,0,32,32);
  const netT=new THREE.CanvasTexture(netC);netT.wrapS=netT.wrapT=THREE.RepeatWrapping;netT.anisotropy=4;
  const netMat=new THREE.MeshBasicMaterial({map:netT,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false});
  const netGeo=(()=>{const D=2.4,H=3.8,B=2.6,Z=4.2,P=[],U=[],I=[];
    const q=(A,B2,C,E,w,h)=>{const n=P.length/3;[A,B2,C,E].forEach(p=>P.push(p[0],p[1],p[2]));U.push(0,0,w,0,w,h,0,h);I.push(n,n+1,n+2,n,n+2,n+3)};
    q([0,H,-Z],[0,H,Z],[D,B,Z],[D,B,-Z],18.7,5.3);q([D,B,-Z],[D,B,Z],[D,0,Z],[D,0,-Z],18.7,5.8);
    q([0,H,-Z],[D,B,-Z],[D,0,-Z],[0,0,-Z],5.3,8.4);q([0,H,Z],[D,B,Z],[D,0,Z],[0,0,Z],5.3,8.4);
    const gm=new THREE.BufferGeometry();gm.setAttribute('position',new THREE.Float32BufferAttribute(P,3));gm.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));gm.setIndex(I);return gm})();
  const postGeo=new THREE.CylinderGeometry(.13,.13,3.8,12),barGeo=new THREE.CylinderGeometry(.13,.13,8.7,12);
  [-1,1].forEach(d=>{const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});
    [-4.2,4.2].forEach(z=>{const p=new THREE.Mesh(postGeo,m);p.position.set(0,1.9,z);p.castShadow=true;g.add(p)});
    const bar=new THREE.Mesh(barGeo,m);bar.rotation.x=Math.PI/2;bar.position.y=3.8;bar.castShadow=true;g.add(bar);
    const net=new THREE.Mesh(netGeo,netMat);net.renderOrder=1;g.add(net);
    g.position.x=d*(PW/2-1.6);g.scale.x=d;scene.add(g)});
})();

/* Entorno aproximado inspirado en la foto: vegetación, mallas, luminarias y juegos. */
const entorno=new THREE.Group();scene.add(entorno);
const madera=new THREE.MeshStandardMaterial({color:0x65513b,roughness:1});
function cilindro(r,h,material,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,7),material);m.position.set(x,y,z);entorno.add(m);return m;}
const metal=new THREE.MeshStandardMaterial({color:0x798a83,roughness:.65});
// Malla perimetral: líneas compartidas para mantener ligero el modelo.
const netPoints=[];
function tramoMalla(x1,z1,x2,z2){
 const w=Math.hypot(x2-x1,z2-z1),h=5.2,dx=(x2-x1)/w,dz=(z2-z1)/w;

    const col=new THREE.Mesh(new THREE.BoxGeometry(sp*.78,1,sp*.78),new THREE.MeshStandardMaterial({color:COLS[r-1]||0x1d4a22,roughness:.5,metalness:r<4?.5:0}));
    col.position.set(px,0,0);col.scale.y=.01;col.castShadow=true;col.receiveShadow=true;col.userData={h};grupo.add(col);
    const et=texto([['#'+r,46,r<4?'#ffe27a':'#cfe3b9',34],[x.txt.split(' ')[0],84,'#ddc530',112]],256,150);et.scale.set(sp*.7,sp*.41,1);et.position.set(px,h*.5,sp*.5);et.visible=false;grupo.add(et);
    const f=await figura(x.s,k);if(mi!=gen)return;
    f.col=col;f.rank=r;f.et=et;f.base=px;f.g.position.set(px,0,0);grupo.add(f.g);figs.push(f);hits.push(f.hit);
    if(r==1){const haz=new THREE.Mesh(new THREE.CylinderGeometry(.6,3.2,16,24,1,true),new THREE.MeshBasicMaterial({color:0xfff2a8,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));haz.position.set(px,8,0);grupo.add(haz);f.haz=haz}
  }
  const asp=innerWidth/innerHeight,ancho=Math.min(N*sp+8,62),mitad=Math.ceil(N*sp/2);cam.metaD=Math.min(105,Math.max(34,ancho/(2*.4245*asp)));meta.d=sel?meta.d:cam.metaD;if(!sel)objetivo.set(0,5,0);
  $('rec').min=-mitad;$('rec').max=mitad;$('rec').value=0;
  if(sel&&!figs.find(f=>f.s===sel))elegir(null);
}

/* ---------- cámara y controles ---------- */
const cam={th:0,ph:1.18,d:60,o:new THREE.Vector3(0,5,0)},meta={th:0,ph:1.18,d:60},objetivo=new THREE.Vector3(0,5,0);
const ptr=new Map();let mov=0,pinch=0,idle=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});mov=0;idle=0;if(ptr.size==2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;idle=0;
  if(ptr.size==2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptr.values()],n=Math.hypot(a.x-b.x,a.y-b.y);meta.d=Math.min(110,Math.max(9,meta.d*pinch/n));pinch=n;mov=99;return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;mov+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;meta.th-=dx*.006;meta.ph=Math.min(1.45,Math.max(.3,meta.ph-dy*.005))});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(mov<8&&!ptr.size){ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);const h=ray.intersectObjects(hits)[0];elegir(h?h.object.userData.f.s:null)}});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();meta.d=Math.min(110,Math.max(9,meta.d*(1+e.deltaY*.001)))},{passive:false});
const ray=new THREE.Raycaster();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

/* ---------- ficha del jugador ---------- */
function elegir(s){
  sel=s;document.body.classList.toggle('sel',!!s);
  document.querySelectorAll('#cont .fila').forEach(e=>e.classList.toggle('on',!!s&&lista[+e.dataset.i]&&lista[+e.dataset.i].s===s));
  figs.forEach(f=>f.et.visible=!!s&&f.s===s);
  if(!s){meta.d=cam.metaD||60;objetivo.set(+$('rec').value,5,0);return}
  meta.d=12;meta.ph=1.12;meta.th=0;
  const j=s.j,partidos=Object.entries(s.gp).map(([id,n])=>{const p=PA[id],rv=p?T[p.Equipo_Local==j.Equipo?p.Equipo_Visita:p.Equipo_Local]:null;return {p,n,rv}}).sort((a,b)=>tf(b.p&&b.p.Fecha)-tf(a.p&&a.p.Fecha));
  $('card').innerHTML=`<button id="x" aria-label="Cerrar">×</button><div class="cab"><img src="${esc(j.Foto||s.t.URL)}" alt=""><div><h2>${esc(j.Nombre)}</h2><div class="ds">${j.Apodo?'“'+esc(j.Apodo)+'” · ':''}${j.Numero?'#'+esc(j.Numero)+' · ':''}${esc(j.Posicion||'Jugador')}</div><div class="ds" style="color:#cfe3b9">${esc(s.t.Nombre)}</div></div></div>
  <div class="grid">${[['Goles',s.g],['Partidos',s.n],['Promedio',s.n?(s.g/s.n).toFixed(2):'—'],['Hat-tricks',s.hat],['Amarillas',s.am],['Rojas',s.ro]].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
  ${s.cpj?`<div class="grid" style="grid-template-columns:repeat(2,1fr)"><div><b>${s.conc}</b><span>Goles recibidos</span></div><div><b>${(s.conc/s.cpj).toFixed(2)}</b><span>Por partido</span></div></div>`:''}
  <div class="tit">Goles por partido</div>${partidos.map(x=>`<div class="fila" style="cursor:default"><div class="m">${x.rv?'vs '+esc(x.rv.Nombre):'Partido '+esc(x.p&&x.p.ID_Partido)}<small>${esc((x.p&&x.p.Fecha)||'')} · J${esc((x.p&&x.p.Jornada)||'?')}</small></div><em>${x.n} ⚽</em></div>`).join('')+(s.gx?`<div class="fila" style="cursor:default"><div class="m">Sin partido identificado<small>ID viejo en la hoja Eventos</small></div><em>${s.gx} ⚽</em></div>`:'')||'<div class="fila" style="cursor:default">Todavía sin goles</div>'}`;
  $('x').onclick=()=>elegir(null);
}
function vistaGeneral(){elegir(null);meta.th=0;meta.ph=1.18;idle=0;}
function zoomCamara(dir){meta.d=Math.min(110,Math.max(9,meta.d*(dir<0?.82:1.22)));idle=0;}
$('vista-general').onclick=vistaGeneral;
$('acercar').onclick=()=>zoomCamara(-1);
$('alejar').onclick=()=>zoomCamara(1);
addEventListener('keydown',e=>{if(e.key==='Escape'){vistaGeneral();document.body.classList.remove('ab')}});
$('btnL').onclick=()=>document.body.classList.toggle('ab');

/* ---------- animación ---------- */
const reloj=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function animar(){
  requestAnimationFrame(animar);const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  figs.forEach(f=>{
    f.col.scale.y+=(f.col.userData.h-f.col.scale.y)*Math.min(1,dt*(reduce?30:3));const h=f.col.scale.y;f.col.position.y=h/2;
    f.fase+=dt*3;const s=Math.sin(f.fase),fest=f.rank<=3||f.s===sel;
    f.g.position.y=h+(fest&&!reduce?Math.abs(Math.sin(f.fase*1.2))*(f.rank==1?.14:.08):0);
    f.pI.rotation.x=s*.08;f.pD.rotation.x=-s*.08;f.cab.position.y=f.cy+Math.sin(f.fase)*.008;
    if(fest){f.bI.rotation.z=-1.85-s*.08;f.bD.rotation.z=1.85+s*.08}else{f.bI.rotation.z=f.bz[0];f.bD.rotation.z=f.bz[1]}
    f.codos.forEach(c=>c.rotation.x=fest?-.12:0);f.rodillas.forEach(k=>k.rotation.x=fest?.08:0);
    f.et.position.y=h*.5;
    if(f.haz){f.haz.position.y=h+8;f.haz.material.opacity=.12+Math.sin(t*2)*.03}
  });
  if(sel){const f=figs.find(x=>x.s===sel);if(f)objetivo.set(f.base,f.g.position.y+2,0)}
  idle+=dt;if(!sel&&!reduce&&idle>5&&!ptr.size){objetivo.x=Math.sin(t*.09)*Math.min(46,+$('rec').max);$('rec').value=objetivo.x;meta.th=Math.sin(t*.12)*.3}
  const k=Math.min(1,dt*4);cam.th+=(meta.th-cam.th)*k;cam.ph+=(meta.ph-cam.ph)*k;cam.d+=(meta.d-cam.d)*k;cam.o.lerp(objetivo,k);
  camera.position.set(cam.o.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.o.y+cam.d*Math.cos(cam.ph)-2,cam.o.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  if(innerWidth<=760 && sel){camera.setViewOffset(innerWidth,innerHeight,0,innerHeight*.16,innerWidth,innerHeight)}else if(camera.view?.enabled){camera.clearViewOffset()}
  camera.lookAt(cam.o);renderer.render(scene,camera);
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    const g=k=>fetch(SHEET+GID[k]).then(r=>r.text()).then(csv);
    const [eq,pa,ju,pr,ev]=await Promise.all([g('eq'),g('pa'),g('ju'),g('pr'),g('ev')]);
    eq.forEach(e=>T[e.ID_Equipo]=e);calcular(ju,pr,ev,pa);
    $('res').innerHTML=[[resumen.goles,'goles'],[resumen.jug,'partidos jugados'],[resumen.prom,'goles por partido'],[resumen.gol,'jugadores con gol'],[Math.min(MAX,resumen.gol),'se muestran']].map(([v,k])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');
    $('tabs').innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-k="${k}">${v[0]}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;sel=null;document.body.classList.remove('sel');dibujar()});
    $('rec').oninput=e=>{idle=0;objetivo.x=+e.target.value};
    await dibujar();$('msg').remove();animar();
  }catch(e){$('msg').textContent='No se pudo cargar la hoja: '+e.message}
})();
</script>
