  const opt=m=>`<option value="${esc(m.id)}">ID ${esc(m.id)} · ${esc(nomE(m.a))} vs ${esc(nomE(m.b))}</option>`,recL=Object.values(D.rec_).sort((x,y)=>(+x.id)-(+y.id));
  const selHTML=`<div class="selbox"><label for="selPart"><b>Ver las jornadas de los equipos de un partido:</b> elige su ID</label><br><select id="selPart"><option value="">— selecciona un ID de partido —</option>${D.sinJ.length?`<optgroup label="Sin jornada disponible">${D.sinJ.map(opt).join('')}</optgroup>`:''}${recL.length?`<optgroup label="Recomendados">${recL.map(opt).join('')}</optgroup>`:''}</select><div id="detPart" class="detpart"></div></div>`;
  const sin=D.sinJ.map(m=>`<li><b>${esc(D.E[m.a].nombre)}</b> vs <b>${esc(D.E[m.b].nombre)}</b> <small>(ID ${esc(m.id)})</small></li>`).join('');
  document.getElementById('r15').innerHTML=`<div class="r15-top"><div class="kpis"><div><b>${D.act.length}</b><span>equipos activos</span></div><div><b>${D.jug}</b><span>jugados</span></div><div><b>${D.prog}</b><span>programados</span></div><div><b>${D.rec}</b><span>recomendados</span></div><div><b>${D.NJ}</b><span>jornadas</span></div></div><div><button class="dl" id="act">Actualizar ahora</button> <button class="dl" id="dl">Descargar PNG</button></div></div>
  <p class="est" id="est"></p>
  <div class="wrap" id="wrap"><table class="r15t" style="table-layout:fixed;width:${40+190+D.NJ*120}px"><colgroup><col style="width:40px"><col style="width:190px">${Array.from({length:D.NJ},()=>'<col style="width:120px">').join('')}</colgroup><thead><tr><th class="sticky">ID</th><th class="sticky">EQUIPO</th>${cab}</tr></thead><tbody>${filas}</tbody><tfoot>${pie}</tfoot></table></div>
  <div class="leg"><span class="rc g">Ganó</span><span class="rc e">Empató</span><span class="rc p">Perdió</span><span class="rc q">Programado</span><span class="rc r">Recomendado</span><span class="rc at">Jornada atrasada</span><span class="rc c">Cubierta</span><span class="rc v">Sin rival</span></div>
  <h3 class="sh">¿Qué significa cada casilla?</h3>
  <ul class="explica">
    <li><span class="rc g">Ganó</span><span class="rc e">Empató</span><span class="rc p">Perdió</span> partido ya jugado, con marcador e ID.</li>
    <li><span class="rc q">Programado</span> partido que <b>ya está en tu hoja</b> con jornada y fecha.</li>
    <li><span class="rc r">Recomendado</span> propuesta del sistema: aún <b>no está programado</b>; se recalcula solo con lo que haya en la hoja.</li>
    <li><span class="rc at">Jornada atrasada</span> la jornada ya pasó y el partido todavía no se juega.</li>
    <li><span class="rc c">Cubre</span> el equipo no jugó esa jornada, pero la liga la toma como jugada contra otro equipo (Deportivo Azul en la J1, contra Puebla 450). No hay partido ni ID.</li>
    <li><span class="rc d">Descansó</span> jornada sin partido fijada a mano (Galácticos en la J1).</li>
    <li><span class="rc v">Sin rival</span> el equipo tiene esa jornada vacía y no hay a quién ponerle: los que le faltan ya tienen esa jornada ocupada con otro partido, o ya jugaron contra él. Abajo sale el motivo de cada una.</li>
  </ul>
  <p class="nota"><b>Al pie de cada jornada:</b> <b>En fecha</b> = jugados el domingo de esa jornada · <b>Adelantados</b> = jugados antes de su domingo · <b>Atrasados</b> = jugados después de su domingo · <b>Faltan</b> = programados y recomendados que todavía no se juegan (⏩ = programado antes de su domingo). Cada ID es un partido; cuenta una sola vez aunque salga en la fila de los dos equipos.</p>
  <p class="nota">Cada jornada es un domingo (J1 = 20/09/2026). Un equipo juega una sola vez por jornada; los juegos contra equipos en baja (Ballenitas y Dream team) también ocupan su jornada. Equipos ordenados por ID.</p>
  <h3 class="sh">Partidos por domingo</h3><p class="nota">Aquí salen todos los partidos de cada domingo, aunque en la tabla de arriba aparezcan en otra columna porque su <b>jornada</b> es otra (por ejemplo, un partido del 01/11 que paga la J2).</p>${dom||'<p class="nota">No hay partidos programados ni recomendados.</p>'}
  ${hu.length?`<h3 class="sh">Casillas sin rival: por qué</h3><ul class="nota">${hu.join('')}</ul>`:''}
  ${D.sinJ.length?`<h3 class="sh">Cruces sin jornada disponible</h3><ul class="nota">${sin}</ul>`:'<h3 class="sh">Consultar un partido por ID</h3>'}${selHTML}`;
  document.getElementById('dl').onclick=descargar;document.getElementById('act').onclick=()=>cargar(true);
  const sp=document.getElementById('selPart');if(sp){sp.onchange=()=>{PART_SEL=sp.value;mostrarPart(D)};if(PART_SEL&&[...sp.options].some(o=>o.value==PART_SEL))sp.value=PART_SEL;else PART_SEL='';mostrarPart(D)}
}
async function descargar(){
  const w=document.getElementById('wrap'),ant=w.style.overflow,antH=w.style.maxHeight;w.style.overflow='visible';w.style.maxHeight='none';
  try{const cv=await html2canvas(w,{scale:2,backgroundColor:'#ffffff',width:w.scrollWidth,windowWidth:w.scrollWidth+40});const a=document.createElement('a');a.download='reporte-15-jornadas.png';a.href=cv.toDataURL('image/png');a.click()}
  catch(e){alert('No se pudo generar la imagen: '+e.message)}finally{w.style.overflow=ant;w.style.maxHeight=antH}
}
async function leer(gid){
  try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('export');return csv(await r.text())}
  catch(e){const r=await fetch(PUB+gid+'&t='+Date.now(),{cache:'no-store'});return csv(await r.text())}
}
let cargando=false;
async function cargar(manual){
  if(cargando)return;cargando=true;
  try{const [pa,eq]=await Promise.all([leer(GID_PA),leer(GID_EQ)]);pintar(armar(pa,eq,new Date()));
    const h=new Date();document.getElementById('est').innerHTML='Actualizado <b>'+p2(h.getHours())+':'+p2(h.getMinutes())+':'+p2(h.getSeconds())+'</b> · se actualiza solo cada minuto con tu hoja de partidos'}
  catch(e){if(!DATOS)document.getElementById('r15').textContent='No se pudo cargar la información: '+e.message}
  finally{cargando=false}
}
cargar();setInterval(cargar,REFRESCO_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargar()});
}else module.exports={armar,csv};
</script>
