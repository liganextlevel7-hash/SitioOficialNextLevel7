const GID={pa:'1362473459',eq:'1894947293'};

const PLAN={"20":[5,4,13,"13/12/2026","9:00",1],"21":[14,6,12,"06/12/2026","10:00",1],"22":[7,16,11,"29/11/2026","9:00",1],"25":[1,2,12,"06/12/2026","9:00",1],"26":[3,14,4,"03/01/2027","12:00",2],"36":[4,10,10,"22/11/2026","9:00",2],"37":[17,6,8,"08/11/2026","9:00",2],"39":[8,13,15,"27/12/2026","11:00",1],"42":[13,2,8,"08/11/2026","12:00",2],"43":[3,10,15,"27/12/2026","10:00",1],"44":[5,14,11,"29/11/2026","9:00",2],"49":[10,1,8,"08/11/2026","10:00",2],"50":[2,4,11,"29/11/2026","11:00",2],"52":[17,5,12,"06/12/2026","11:00",2],"53":[6,16,14,"20/12/2026","12:00",1],"54":[7,9,8,"08/11/2026","11:00",2],"55":[12,8,14,"20/12/2026","10:00",2],"57":[16,1,10,"22/11/2026","10:00",2],"58":[2,3,9,"15/11/2026","11:00",2],"61":[6,9,9,"15/11/2026","10:00",1],"62":[7,10,13,"13/12/2026","10:00",1],"63":[12,14,10,"22/11/2026","12:00",2],"64":[17,13,10,"22/11/2026","11:00",1],"65":[1,17,13,"13/12/2026","10:00",2],"66":[14,2,13,"13/12/2026","12:00",2],"68":[9,4,14,"20/12/2026","10:00",1],"69":[5,10,14,"20/12/2026","12:00",2],"71":[8,16,13,"13/12/2026","9:00",2],"73":[9,1,15,"27/12/2026","12:00",2],"74":[2,6,10,"22/11/2026","9:00",1],"75":[3,7,12,"06/12/2026","11:00",1],"76":[4,8,12,"06/12/2026","12:00",2],"77":[13,5,9,"15/11/2026","10:00",2],"80":[12,17,15,"27/12/2026","9:00",2],"83":[6,3,11,"29/11/2026","12:00",2],"85":[5,16,8,"08/11/2026","11:00",1],"87":[8,17,9,"15/11/2026","12:00",1],"88":[12,9,11,"29/11/2026","10:00",2],"89":[1,7,14,"20/12/2026","11:00",1],"91":[8,3,10,"22/11/2026","10:00",1],"92":[4,6,15,"27/12/2026","9:00",1],"94":[17,10,11,"29/11/2026","10:00",1],"95":[16,12,7,"08/11/2026","9:00",1],"96":[13,14,14,"20/12/2026","9:00",2],"99":[4,12,9,"15/11/2026","11:00",1],"101":[14,7,9,"15/11/2026","9:00",1],"102":[13,9,12,"06/12/2026","9:00",2],"103":[10,16,9,"15/11/2026","12:00",2],"105":[1,13,11,"29/11/2026","12:00",1],"106":[17,2,14,"20/12/2026","11:00",2],"108":[7,5,10,"22/11/2026","11:00",2],"110":[8,14,8,"08/11/2026","10:00",1],"112":[12,10,12,"06/12/2026","12:00",1],"114":[2,5,15,"27/12/2026","10:00",2],"115":[9,3,13,"13/12/2026","12:00",1],"119":[12,13,13,"13/12/2026","11:00",2],"120":[14,16,15,"27/12/2026","11:00",2],"121":[1,18,9,"15/11/2026","9:00",2],"122":[16,18,12,"06/12/2026","10:00",2],"123":[3,18,14,"20/12/2026","9:00",1],"124":[4,18,8,"08/11/2026","12:00",1],"127":[6,18,13,"13/12/2026","11:00",1],"128":[8,18,11,"29/11/2026","11:00",1],"129":[7,18,15,"27/12/2026","12:00",1],"134":[9,18,10,"22/11/2026","12:00",1],"135":[14,18,2,"03/01/2027","10:00",1],"16":[14,17,7,"01/11/2026","11:00",2],"27":[16,4,6,"01/11/2026","10:00",2],"29":[13,6,7,"01/11/2026","10:00",1],"32":[10,9,7,"01/11/2026","12:00",2],"33":[1,5,7,"01/11/2026","9:00",2],"46":[7,8,7,"01/11/2026","12:00",1],"67":[3,12,8,"01/11/2026","9:00",1],"130":[2,18,7,"01/11/2026","11:00",1]};
const SIN=[[40,9,14],[116,4,17],[125,10,18],[126,17,18],[136,5,18]];   /* cruces que ya no caben en ninguna jornada: [id, local, visita] */
/* Reglas (las mismas de partidos.js y del reporte por equipo) */
const CORR={'28':['5','12'],'70':['6','7']};   /* correcciones de captura: el 28 era Rivera vs Amigos y el 70 Real Alcoholicos vs Chautenco */
const BAJA_FORZADA=['11','15'];                 /* Atletico Ballenitas y Dream team están en baja */
const COBERTURA={1:{'17':'9'}};                 /* Deportivo Azul no jugó la J1: se toma como jugada contra Puebla 450 */
const DESC_MANUAL={1:['18']};                   /* Galácticos descansó en la J1 */
const JORNADA_FIJA={'132':5,'133':6};            /* partidos de Galácticos que la hoja trae sin jornada */
const J0=new Date(2026,8,20),NJ=15;
const p2=n=>String(n).padStart(2,'0');
const fechaJ=j=>{const d=new Date(J0.getTime()+7*86400000*(j-1));return p2(d.getDate())+'/'+p2(d.getMonth()+1)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift().map(x=>x.trim());return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
function armar(pa,eq){
  const E={};eq.forEach(e=>E[String(e.ID_Equipo).trim()]=e);
  const baja=id=>BAJA_FORZADA.includes(id)||!E[id]||(E[id].Status||'').trim().toLowerCase()!='activo';
  const P=pa.map(p=>{const q={...p},id=String(p.ID_Partido).trim(),c=CORR[id];q.ID_Partido=id;q.Equipo_Local=String(p.Equipo_Local).trim();q.Equipo_Visita=String(p.Equipo_Visita).trim();if(c){q.Equipo_Local=c[0];q.Equipo_Visita=c[1]}return q});
  /* jornada de cada partido: los jugados usan la de la hoja (o la del plan si no tienen); los pendientes del plan usan la del plan */
  const jor=p=>p.Estado=='Jugado'?(+p.Jornada||JORNADA_FIJA[p.ID_Partido]||(PLAN[p.ID_Partido]?PLAN[p.ID_Partido][2]:0)):(PLAN[p.ID_Partido]?PLAN[p.ID_Partido][2]:(+p.Jornada||0));
  const jug=P.filter(p=>p.Estado=='Jugado'),jugId=new Set(jug.map(p=>p.ID_Partido));
  const activos=Object.keys(E).filter(id=>!baja(id)),st={};activos.forEach(id=>st[id]={pts:0,gf:0,gc:0,pj:0});
  jug.forEach(p=>{const gl=+p.Goles_Local||0,gv=+p.Goles_Visita||0;[[p.Equipo_Local,gl,gv],[p.Equipo_Visita,gv,gl]].forEach(([t,a,b])=>{const s=st[t];if(!s)return;s.pj++;s.gf+=a;s.gc+=b;s.pts+=a>b?3:a==b?1:0})});
  const orden=activos.slice().sort((a,b)=>st[b].pts-st[a].pts||(st[b].gf-st[b].gc)-(st[a].gf-st[a].gc)||st[b].gf-st[a].gf||E[a].Nombre.localeCompare(E[b].Nombre));
  const celdas={};
  orden.forEach(t=>{celdas[t]=[];for(let j=1;j<=NJ;j++){
    const mios=P.filter(p=>jor(p)==j&&(p.Equipo_Local==t||p.Equipo_Visita==t)),pj=mios.find(p=>p.Estado=='Jugado');let c;
    if(pj){const loc=pj.Equipo_Local==t,gf=+(loc?pj.Goles_Local:pj.Goles_Visita)||0,gc=+(loc?pj.Goles_Visita:pj.Goles_Local)||0,r=loc?pj.Equipo_Visita:pj.Equipo_Local;
      let pen='';if(gf==gc&&pj.Ganado_Por=='Penales'&&pj.Penales)pen=String(pj.Penales).trim()==t?'gana pen.':'pierde pen.';if(pj.Ganado_Por=='Default')pen='default';
      c={k:gf>gc?'g':gf<gc?'p':'e',id:pj.ID_Partido,r,txt:gf+'-'+gc,fecha:pj.Fecha,pen,baja:baja(r)}}
    else if(COBERTURA[j]&&COBERTURA[j][t]) c={k:'c',r:COBERTURA[j][t],txt:'cubre'};
    else if(DESC_MANUAL[j]&&DESC_MANUAL[j].includes(t)) c={k:'d',txt:'descansó'};
    else{
      let rec=null;
      for(const id of Object.keys(PLAN)){const x=PLAN[id];if(x[2]==j&&(x[0]==t||x[1]==t)&&!jugId.has(id)){const fila=P.find(p=>p.ID_Partido==id)||{};rec={id,r:x[0]==t?x[1]:x[0],fecha:fila.Fecha||x[3],hora:fila.Hora||x[4]};break}}
      if(!rec){const pe=mios.find(p=>p.Estado!='Jugado'&&!baja(p.Equipo_Local==t?p.Equipo_Visita:p.Equipo_Local));if(pe)rec={id:pe.ID_Partido,r:pe.Equipo_Local==t?pe.Equipo_Visita:pe.Equipo_Local,fecha:pe.Fecha,hora:pe.Hora}}
      c=rec?{k:'r',id:rec.id,r:rec.r,txt:'vs',fecha:rec.fecha,hora:rec.hora}:{k:'v',txt:'sin rival'}}
    celdas[t].push(c)}});
  return {E,orden,st,celdas,jug:jug.length,rec:Object.keys(PLAN).filter(id=>!jugId.has(id)).length,baja};
}
if(typeof document!=='undefined'){
const ab=n=>(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/).map(w=>w.slice(0,3)).slice(0,2).join(' ').toUpperCase();
function celdaHTML(c,D){
  const nom=c.r?(D.E[c.r]?D.E[c.r].Nombre:'Equipo '+c.r):'',logo=c.r&&D.E[c.r]&&D.E[c.r].URL?`<img src="${esc(D.E[c.r].URL)}" alt="" onerror="this.style.opacity=.2">`:'';
  if(c.k=='v')return `<td class="rc v" title="Esta jornada se queda sin rival: no hay con quién cuadrarla"><span class="tx">sin rival</span></td>`;
  if(c.k=='d')return `<td class="rc d" title="Descanso fijado a mano"><span class="tx">descansó</span></td>`;
  if(c.k=='c')return `<td class="rc c" title="Se toma como jugada contra ${esc(nom)}">${logo}<span class="tx">cubre</span><small>${esc(ab(nom))}</small></td>`;
  if(c.k=='r')return `<td class="rc r" title="Recomendado: ${esc(nom)} · ID ${esc(c.id)} · ${esc(c.fecha||'')} ${esc(c.hora||'')}">${logo}<b>${esc(ab(nom))}</b><small>#${esc(c.id)} · ${esc((c.fecha||'').slice(0,5))}</small></td>`;
  return `<td class="rc ${c.k}" title="${esc(nom)} · ID ${esc(c.id)} · ${esc(c.fecha||'')}${c.pen?' · '+c.pen:''}${c.baja?' · equipo en baja':''}">${logo}<b>${esc(c.txt)}</b><small>#${esc(c.id)}${c.pen?' · '+(c.pen=='default'?'def.':'pen.'):''}${c.baja?' · baja':''}</small></td>`;

function pintar(D){
  const cab=Array.from({length:NJ},(_,i)=>`<th class="jh">J${i+1}<small>${fechaJ(i+1)}</small></th>`).join('');
  let filas='';

    filas+=`<tr class="${rk==1?'lider':''}">${zona}<td class="no sticky"><span class="rk r${Math.min(rk,4)}">${rk}</span></td><td class="eq sticky"><img src="${esc(e.URL||'')}" alt="" onerror="this.style.opacity=.2"><span>${esc(e.Nombre)}</span></td>${D.celdas[t].map(c=>celdaHTML(c,D)).join('')}</tr>`});
  const sin=SIN.map(([id,a,b])=>`<li><b>${esc(D.E[a]?D.E[a].Nombre:a)}</b> vs <b>${esc(D.E[b]?D.E[b].Nombre:b)}</b> <small>(ID ${id})</small></li>`).join('');
  document.getElementById('r15').innerHTML=`<div class="r15-top"><div class="kpis"><div><b>${D.orden.length}</b><span>equipos activos</span></div><div><b>${D.jug}</b><span>partidos jugados</span></div><div><b>${D.rec}</b><span>partidos recomendados</span></div><div><b>${NJ}</b><span>jornadas</span></div></div><button class="dl" id="dl">Descargar PNG para imprimir</button></div>
  <div class="wrap" id="wrap"><table class="r15t"><thead><tr><th class="zh"></th><th class="sticky">NO</th><th class="sticky">EQUIPO</th>${cab}</tr></thead><tbody>${filas}</tbody></table></div>
  <div class="leg"><span class="rc g">Ganó</span><span class="rc e">Empató</span><span class="rc p">Perdió</span><span class="rc r">Recomendado</span><span class="rc c">Cubierta</span><span class="rc v">Sin rival</span></div>
  <p class="nota">Cada jornada es un domingo (J1 = 20/09/2026, J15 = 27/12/2026). Los juegos contra equipos en baja (Atletico Ballenitas y Dream team) cuentan como esa jornada jugada. Pasa el cursor (o toca) una celda para ver rival, ID, fecha y hora.</p>
  <h3 class="sh">Cruces que ya no caben en ninguna jornada</h3><ul class="nota">${sin}</ul>`;
  document.getElementById('dl').onclick=descargar;
}
async function descargar(){
  const w=document.getElementById('wrap'),ant=w.style.overflow;w.style.overflow='visible';
  try{const cv=await html2canvas(w,{scale:2,backgroundColor:'#0b1530',width:w.scrollWidth,windowWidth:w.scrollWidth+40});const a=document.createElement('a');a.download='reporte-15-jornadas.png';a.href=cv.toDataURL('image/png');a.click()}
  catch(e){alert('No se pudo generar la imagen: '+e.message)}finally{w.style.overflow=ant}
}
(async()=>{try{
  const [pa,eq]=await Promise.all([fetch(SHEET+GID.pa).then(r=>r.text()),fetch(SHEET+GID.eq).then(r=>r.text())]);
  pintar(armar(csv(pa),csv(eq)));
}catch(e){document.getElementById('r15').textContent='No se pudo cargar la información: '+e.message}})();
}else module.exports={armar,csv};
