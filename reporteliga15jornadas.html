    if(l==NUEVO&&v&&v!=NUEVO)fix[p.ID_Partido]=v;else if(v==NUEVO&&l&&l!=NUEVO)fix[p.ID_Partido]=l;else if(!v&&l&&l!=NUEVO)fix[p.ID_Partido]=l;else if(!l&&v&&v!=NUEVO)fix[p.ID_Partido]=v});
  const libres=[];D.celdas[NUEVO].forEach((c,i)=>{if(c.k=='v')libres.push(i+1)});
  const fixtures=Object.keys(fix).filter(id=>!D.baja(fix[id])&&D.celdas[fix[id]]).map(id=>{const r=fix[id],cel=j=>D.celdas[r][j-1].k;
    return {id,r,ambos:libres.filter(j=>cel(j)=='v'),ocupados:libres.filter(j=>cel(j)=='r')}}).sort((a,b)=>+a.id-+b.id);
  return {fixtures,libres};
}
if(typeof document!=='undefined'){
const eqMini=(id,D)=>{const e=D.E[id];return `<span class="em">${e&&e.URL?`<img src="${esc(e.URL)}" alt="" onerror="this.style.opacity=.2">`:'<span class="lg">⚽</span>'}<b>${esc(e?e.Nombre:'Equipo '+id)}</b></span>`};
const idp=id=>`<span class="idp">ID ${esc(id)}</span>`;
function celdaHTML(c,D){
  const r=c.r&&D.E[c.r]?D.E[c.r]:null,nom=r?r.Nombre:(c.r?'Equipo '+c.r:''),
        logo=r&&r.URL?`<img src="${esc(r.URL)}" alt="" onerror="this.style.opacity=.2">`:'<span class="lg">⚽</span>',
        rival=`<div class="rv">${logo}<span class="rn">${esc(nom)}</span></div>`;
  if(c.k=='v')return `<td class="rc v" title="Esta jornada se queda sin rival: no hay con quién cuadrarla"><span class="tx">SIN RIVAL</span><small>por programar</small></td>`;
  if(c.k=='d')return `<td class="rc d" title="Descanso fijado a mano"><span class="tx">DESCANSÓ</span></td>`;
  if(c.k=='c')return `<td class="rc c" title="Se toma como jugada contra ${esc(nom)}">${rival}<b class="mk">CUBRE</b><small>se toma como jugada</small></td>`;
  if(c.k=='r')return `<td class="rc r" title="Por jugar: ${esc(nom)} · ID ${esc(c.id)} · ${esc(c.fecha||'')} ${esc(c.hora||'')}">${rival}<b class="mk">VS</b>${idp(c.id)}<small>${esc((c.fecha||'').slice(0,5))} · ${esc(c.hora||'')}</small></td>`;
  return `<td class="rc ${c.k}" title="${esc(nom)} · ID ${esc(c.id)} · ${esc(c.fecha||'')}${c.pen?' · '+c.pen:''}${c.baja?' · equipo en baja':''}">${rival}<b class="mk">${esc(c.txt)}</b>${idp(c.id)}<small>${esc((c.fecha||'').slice(0,5))}${c.pen?' · '+(c.pen=='default'?'default':c.pen):''}${c.baja?' · baja':''}</small></td>`;
}
const horaMin=h=>{const m=String(h||'').match(/(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:0};
const fechaN=f=>{const p=String(f||'').split('/');return p.length==3?+p[2]*10000+ +p[1]*100+ +p[0]:0};
function seccionFaltan(D){
  const js=Object.keys(D.faltan).map(Number).sort((a,b)=>a-b);
  if(!js.length)return '<p class="nota">No quedan partidos por jugar.</p>';

      `<div class="fm${m.l==NUEVO||m.v==NUEVO?' nuevo':''}"><div class="fm-t">${idp(m.id)}<small>${esc(m.fecha)} · ${esc(m.hora)} · Campo ${esc(m.campo)}</small></div><div class="fm-e">${eqMini(m.l,D)}<span class="vs">vs</span>${eqMini(m.v,D)}</div></div>`).join('')+`</div>`}).join('')+`</div>`;
}
function seccionNuevo(D){

    :`<p class="dob">⚠️ Galácticos no tiene jornadas libres para este cruce; habría que mover otro partido.</p>`)+`</div>`).join('');
  const lib=R.libres.length?`<p class="nota">Jornadas donde Galácticos está libre: ${jl(R.libres)}.</p>`:'<p class="nota">Galácticos no tiene jornadas libres.</p>';

}
function pintar(D){

  <div class="wrap" id="wrap"><table class="r15t"><thead><tr><th class="sticky">ID</th><th class="sticky">EQUIPO</th>${cab}</tr></thead><tbody>${filas}</tbody></table></div>
  <div class="leg"><span class="rc g">Ganó</span><span class="rc e">Empató</span><span class="rc p">Perdió</span><span class="rc r">Por jugar (VS)</span><span class="rc c">Cubierta</span><span class="rc v">Sin rival</span></div>
  <p class="nota">Equipos en orden de ID. Cada celda muestra el rival, el marcador (o VS si falta jugarlo) y el ID del partido. Cada jornada es un domingo (J1 = 20/09/2026, J15 = 27/12/2026). Los juegos contra equipos en baja (Atletico Ballenitas y Dream team) cuentan como esa jornada jugada.</p>
  <h3 class="sh">Partidos que faltan por jornada</h3>${seccionFaltan(D)}

  document.getElementById('dl').onclick=descargar;
}
async function descargar(){

function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}const h=r.shift().map(x=>x.trim());return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
function armar(pa,eq){
  const E={};eq.forEach(e=>E[String(e.ID_Equipo).trim()]=e);
  const baja=id=>BAJA_FORZADA.includes(id)||!E[id]||(E[id].Status||'').trim().toLowerCase()!='activo';
  const P=pa.map(p=>{const q={...p},id=String(p.ID_Partido).trim(),c=CORR[id];q.ID_Partido=id;q.Equipo_Local=String(p.Equipo_Local).trim();q.Equipo_Visita=String(p.Equipo_Visita).trim();if(c){q.Equipo_Local=c[0];q.Equipo_Visita=c[1]}return q});
  /* jornada de cada partido: los jugados usan la de la hoja (o la del plan si no tienen); los pendientes del plan usan la del plan */
  const jor=p=>p.Estado=='Jugado'?(+p.Jornada||JORNADA_FIJA[p.ID_Partido]||(PLAN[p.ID_Partido]?PLAN[p.ID_Partido][2]:0)):(PLAN[p.ID_Partido]?PLAN[p.ID_Partido][2]:(+p.Jornada||0));
  const jug=P.filter(p=>p.Estado=='Jugado'),jugId=new Set(jug.map(p=>p.ID_Partido));
  const activos=Object.keys(E).filter(id=>!baja(id)),st={};activos.forEach(id=>st[id]={pts:0,gf:0,gc:0,pj:0});
  jug.forEach(p=>{const gl=+p.Goles_Local||0,gv=+p.Goles_Visita||0;[[p.Equipo_Local,gl,gv],[p.Equipo_Visita,gv,gl]].forEach(([t,a,b])=>{const s=st[t];if(!s)return;s.pj++;s.gf+=a;s.gc+=b;s.pts+=a>b?3:a==b?1:0})});
  const orden=activos.slice().sort((a,b)=>Number(a)-Number(b));   /* equipos en orden de ID, no de clasificación */
  const celdas={};
  orden.forEach(t=>{celdas[t]=[];for(let j=1;j<=NJ;j++){
    const mios=P.filter(p=>jor(p)==j&&(p.Equipo_Local==t||p.Equipo_Visita==t)),pj=mios.find(p=>p.Estado=='Jugado');let c;
    if(pj){const loc=pj.Equipo_Local==t,gf=+(loc?pj.Goles_Local:pj.Goles_Visita)||0,gc=+(loc?pj.Goles_Visita:pj.Goles_Local)||0,r=loc?pj.Equipo_Visita:pj.Equipo_Local;
      let pen='';if(gf==gc&&pj.Ganado_Por=='Penales'&&pj.Penales)pen=String(pj.Penales).trim()==t?'gana pen.':'pierde pen.';if(pj.Ganado_Por=='Default')pen='default';
      c={k:gf>gc?'g':gf<gc?'p':'e',id:pj.ID_Partido,r,txt:gf+'-'+gc,fecha:pj.Fecha,pen,baja:baja(r)}}

      if(!rec){const pe=mios.find(p=>p.Estado!='Jugado'&&!baja(p.Equipo_Local==t?p.Equipo_Visita:p.Equipo_Local));if(pe)rec={id:pe.ID_Partido,r:pe.Equipo_Local==t?pe.Equipo_Visita:pe.Equipo_Local,fecha:pe.Fecha,hora:pe.Hora}}
      c=rec?{k:'r',id:rec.id,r:rec.r,txt:'vs',fecha:rec.fecha,hora:rec.hora}:{k:'v',txt:'sin rival'}}
    celdas[t].push(c)}});

  const sig={};orden.forEach(t=>{const k=celdas[t].findIndex(c=>c.k=='r');sig[t]=k>=0?{j:k+1,...celdas[t][k]}:null});
  const faltan={};Object.keys(PLAN).filter(id=>!jugId.has(id)).forEach(id=>{const x=PLAN[id],fila=P.find(p=>p.ID_Partido==id)||{};

/* Con quién puede jugar el equipo nuevo (Galácticos): sus cruces sin jornada y las jornadas donde está libre */
const NUEVO='18';
function recomendar(D){
  if(!D.E[NUEVO]||!D.celdas[NUEVO])return null;
  const fix={};
  SIN.forEach(([id,a,b])=>{a=String(a);b=String(b);if(a==NUEVO||b==NUEVO)fix[String(id)]=a==NUEVO?b:a});
  D.P.forEach(p=>{if(p.Estado=='Jugado'||PLAN[p.ID_Partido])return;const l=p.Equipo_Local,v=p.Equipo_Visita;
    if(l==NUEVO&&v&&v!=NUEVO)fix[p.ID_Partido]=v;else if(v==NUEVO&&l&&l!=NUEVO)fix[p.ID_Partido]=l;else if(!v&&l&&l!=NUEVO)fix[p.ID_Partido]=l;else if(!l&&v&&v!=NUEVO)fix[p.ID_Partido]=v});
  const libres=[];D.celdas[NUEVO].forEach((c,i)=>{if(c.k=='v')libres.push(i+1)});
  const fixtures=Object.keys(fix).filter(id=>!D.baja(fix[id])&&D.celdas[fix[id]]).map(id=>{const r=fix[id],cel=j=>D.celdas[r][j-1].k;
    return {id,r,ambos:libres.filter(j=>cel(j)=='v'),ocupados:libres.filter(j=>cel(j)=='r')}}).sort((a,b)=>+a.id-+b.id);
  return {fixtures,libres};
}

const horaMin=h=>{const m=String(h||'').match(/(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:0};

function seccionFaltan(D){

function seccionNuevo(D){
