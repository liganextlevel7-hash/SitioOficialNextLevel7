<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Correcciones · Next Level 7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101914;color:#edf5ed;font:16px system-ui}main{max-width:1350px;margin:auto;padding:24px}h1{margin:.2em 0}.tag{color:#b2e568;font-weight:700}textarea,input,select,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #54745e}textarea,input,select{background:#182820;color:white}textarea{width:100%;min-height:110px}button{background:#b2e568;color:#142216;font-weight:700;cursor:pointer;margin:4px}section{margin:18px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:left;border-bottom:1px solid #395141}input{width:100%;min-width:105px}td:nth-child(2) input{min-width:210px}td img{width:40px;height:40px;object-fit:cover;vertical-align:middle}td small{display:block;color:#ffd396}#status{min-height:1.4em;color:#ffd396}dialog{max-width:720px;width:90%;background:#182820;color:white;border:1px solid #54745e}
</style>
<main><div class="tag">NEXT LEVEL 7</div><h1>Correcciones de jugadores</h1>
<section id="setup"><p>Entra con el código de tu equipo en Registro de Jugadores y selecciona <strong>Correcciones de mi equipo</strong>.</p><a style="color:#b2e568" href="./registro-jugadores.html">Ir a Registro de Jugadores</a></section>
<section id="work" hidden><label>Equipo <select id="team"></select></label><button id="send" type="button">Actualizar</button><p id="guide"></p><div id="summary"></div><div class="scroll"><table id="grid"></table></div></section>
<p id="status" role="status"></p></main>
<script>
const byId=id=>document.getElementById(id);
const originalHeader=['ID_Jugador','Nombre','Equipo','Numero','Posicion','Logo','Foto','URL_Foto','Apodo'];
const header=[...originalHeader,'Observaciones','Estatus'];
const positions=['Portero','Defensa','Medio','Mediocampista','Delantero','Director Técnico'];
const editable=new Set([1,3,4,6,8,9,10]);
// Pega aquí la URL /exec de la aplicación web de Apps Script.
const ENVIO_URL='';
let rows=[];
function imageURL(s){try{return /^https?:$/.test(new URL(s).protocol)}catch{return false}}
const checks=[
 ['Nombre por confirmar',r=>r[1].split(/\s+/).filter(w=>w.length>1).length<3||/^(sin nombre|jugador\s+\d+)$/i.test(r[1])],
 ['Sin número',r=>!r[3]],
 ['Sin posición',r=>!r[4]],
 ['Posición por revisar',r=>!!r[4]&&!positions.some(p=>p.toLowerCase()===r[4].toLowerCase())],
 ['Sin foto',r=>!r[6]||r[6]===r[7]],
 ['Sin apodo (opcional)',r=>!r[8]]
];
const cellChecks={1:[0],3:[1],4:[2,3],6:[4],8:[5]};
function current(){return rows.filter(r=>r[2]===byId('team').value)}
function summarize(){
 const list=current();
 byId('summary').textContent=list.length+' registros · '+checks.map(([label,test])=>label+': '+list.filter(test).length).join(' · ');
}
function render(){
 const grid=byId('grid');grid.replaceChildren();
 const head=grid.createTHead().insertRow();
 for(const h of header){const th=document.createElement('th');th.scope='col';th.textContent=h;head.append(th)}
 const body=grid.createTBody();
 for(const r of current()){
  const tr=body.insertRow();
  r.forEach((value,i)=>{
   const td=tr.insertCell();
   if(i===5||i===6){
    const img=document.createElement('img');img.alt=i===5?'Logo':'Retrato';img.loading='lazy';img.hidden=!imageURL(value);
    if(!img.hidden)img.src=value;
    td.append(img);
   }
   if(!editable.has(i)){
    if(i===7&&imageURL(value)){const a=document.createElement('a');a.href=value;a.textContent='Ver enlace';a.target='_blank';a.rel='noopener';a.style.color='#b2e568';td.append(a)}
    else if(i!==5||!imageURL(value))td.append(value);
    return;
   }
   const input=document.createElement(i===9?'textarea':i===10?'select':'input');
   if(i===9){input.rows=2;input.style.minHeight='64px';input.style.minWidth='220px';input.placeholder='Ej. Es otro jugador con el mismo nombre'}
   if(i===10){
    input.append(new Option('Por confirmar',''),new Option('Activo','Activo'),new Option('Baja','Baja'));
    if(value&&!['Activo','Baja'].includes(value))input.append(new Option(value,value));
   }
   input.value=value;
   input.setAttribute('aria-label',header[i]+' de '+r[0]);
   if(i===3)input.inputMode='numeric';
   if(i===4)input.setAttribute('list','positions');
   if(i===6)input.placeholder='Enlace de la foto';
   const note=document.createElement('small');
   const mark=()=>{note.textContent=(cellChecks[i]||[]).filter(j=>checks[j][1](r)).map(j=>checks[j][0]).join(' · ')};
   input.oninput=()=>{r[i]=input.value.trim();mark();summarize()};
   input.onchange=()=>{if(i!==6)return;const img=td.querySelector('img');img.hidden=!imageURL(r[i]);if(img.hidden)img.removeAttribute('src');else img.src=r[i]};
   mark();td.append(input,note);
  });
 }
 summarize();
}
function start(data){
 if(!data.length)throw Error('La tabla no contiene jugadores.');
 rows=data;
 const teams=[...new Set(rows.map(r=>r[2]))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
 byId('team').replaceChildren(...teams.map(id=>new Option('Equipo '+id,id)));
 byId('work').hidden=false;render();
 byId('guide').textContent='Corrige los datos de tu plantel y pulsa Actualizar.';
}
byId('team').onchange=render;
byId('send').onclick=()=>{
 if(!ENVIO_URL){byId('status').textContent='El administrador aún debe activar el guardado.';return}
 const codigo=localStorage.getItem('nl7_codigo_equipo');
 if(!codigo){byId('status').textContent='Vuelve a entrar con el código de tu equipo.';return}
 const form=document.createElement('form');
 form.action=ENVIO_URL;
 form.method='POST';
 form.target='_blank';
 form.rel='noopener';
 for(const [name,value] of Object.entries({equipo:byId('team').value,codigo,filas:JSON.stringify(current())})){
  const input=document.createElement('input');
  input.type='hidden';
  input.name=name;
  input.value=value;
  form.append(input);
 }
 document.body.append(form);
 form.submit();
 form.remove();
};
if(location.hash==='#mi-equipo'){
 byId('setup').hidden=true;
 try{
  const plantel=JSON.parse(sessionStorage.getItem('nl7_plantel_correcciones'));
  if(!Array.isArray(plantel)||!plantel.length)throw Error();
  start(plantel.map(r=>header.map((_,i)=>r[i]||'')));
  if(!ENVIO_URL){
   byId('send').disabled=true;
   byId('status').textContent='El administrador aún debe activar el guardado.';
  }
 }catch{
  byId('setup').hidden=false;
  byId('status').textContent='Abre esta ficha desde Correcciones de mi equipo en Registro de Jugadores.';
 }
}
</script></html>
