<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jugadores | Liga Next Level 7</title>
<link rel="stylesheet" href="styles.css">
<style>

body.standings{--green:#a4e55f;--gold:#e0bb58;--text:#eef5e8;--muted:#a4b398;--line:#ffffff13;background:radial-gradient(ellipse at 50% 10%,#30451b44,transparent 65%),linear-gradient(#0a110af2,#0c120bf5),url('fondodominical.png') center/cover fixed;color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
.standings *{box-sizing:border-box;}.standings a:focus-visible,.standings button:focus-visible{outline:3px solid var(--gold);outline-offset:4px;}
.standings .standings-header{max-width:1160px;margin:auto;padding:26px 24px 20px;text-align:left;}
.standings .brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.standings .brand-logos{display:flex;align-items:center;gap:16px;}.standings .brand-logos .logo-liga{width:65px;height:75px;max-width:none;object-fit:contain;filter:none;}
.standings .brand-label strong{font-size:17px;display:block;letter-spacing:-.4px;}.standings .brand-label small{font-size:10px;letter-spacing:2px;color:#b1c79e;display:block;margin-top:6px;}
.standings nav{margin:0;display:flex;gap:9px;flex-wrap:wrap;}.standings nav a{font-size:12px;border:1px solid #9fe75133;border-radius:9px;padding:11px 15px;background:#162113;color:#d0e0c2;margin:0;box-shadow:none;}.standings nav a:hover{transform:none;background:#263e18;color:#e3f8d0;box-shadow:none;}
.standings .page-heading{margin-top:26px;border-top:1px solid var(--line);padding-top:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
.standings .eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:9px;}
.standings h1{font-size:clamp(30px,4vw,44px);line-height:1.1;letter-spacing:-1.4px;color:#f1f6eb;text-shadow:none;margin:0;}
.standings .subtitulo{font-size:13px;color:var(--muted);font-weight:400;margin:10px 0 0;line-height:1.5;}
.standings .season-label{font-size:11px;color:#bad59f;border:1px solid #b1db7333;background:#21341a;padding:8px 12px;border-radius:20px;white-space:nowrap;}
/* Adornos de temporada del torneo. */
.standings .brand-season{display:none;position:relative;flex:0 0 48px;width:48px;height:39px;}
.standings .brand-season[data-season="navidad"]{display:block;flex-basis:114px;width:114px;height:69px;filter:drop-shadow(0 3px 5px #0008);}
.standings .season-holidays{display:none;width:100%;height:100%;object-fit:contain;}
.standings .brand-season[data-season="navidad"] .season-holidays{display:block;}
@media(max-width:480px){.standings .brand-season[data-season="navidad"]{flex-basis:90px;width:90px;height:56px;}}
.standings .season-icon{display:none;}
.standings .brand-season[data-season="reyes"],.standings .brand-season[data-season="candelaria"]{display:grid;place-items:center;border:1px solid #e0bb5855;border-radius:50%;background:#352917;color:#fbe1a1;}
.standings .brand-season[data-season="reyes"] .season-reyes,.standings .brand-season[data-season="candelaria"] .season-candelaria{display:block;font-size:22px;line-height:1;}
.standings .standings-header[data-season="navidad"] .page-heading{border-top-color:#e0bb5866;}
@media(max-width:375px){.standings .brand-season{margin-left:-8px;transform:scale(.8);}}
@media print{.standings .brand-season[data-season]{display:none;}}
.standings .christmas-snow{display:none;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.standings[data-season="navidad"] .christmas-snow{display:block;}
.standings .standings-header,.standings .contenedor-jugadores,.standings .standings-footer{position:relative;}
.standings .snowflake{position:absolute;top:0;left:var(--left);width:var(--size);height:var(--size);border-radius:50%;background:#f9fdff;opacity:var(--opacity);animation:snowfall var(--duration) linear var(--delay) infinite;will-change:transform;}
@keyframes snowfall{from{transform:translate3d(0,-12px,0);}to{transform:translate3d(var(--drift),calc(100vh + 12px),0);}}
@media(prefers-reduced-motion:reduce){.standings[data-season="navidad"] .christmas-snow{display:none;}.standings .snowflake{animation:none;}}
@media print{.standings[data-season="navidad"] .christmas-snow{display:none;}}
@media(max-width:700px){.standings .standings-header{padding:18px 16px;}.standings .brand-row{align-items:flex-start;flex-wrap:wrap;gap:14px;}.standings .brand-logos{gap:10px;flex-wrap:wrap;}.standings .brand-logos .logo-liga{width:48px;height:56px;}.standings .brand-label strong{font-size:15px;}.standings .brand-label small{font-size:9px;letter-spacing:1.3px;}.standings .page-heading{margin-top:20px;padding-top:20px;}}
</style>
</head>

<script>
(() => {
  const header = document.querySelector('.standings-header');
  const ornament = header.querySelector('.brand-season');
  const snow = document.querySelector('.christmas-snow');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const pueblaDate = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Mexico_City',
    month: '2-digit',
    day: '2-digit'
  });

  function updateSeason() {
    const [month, day] = pueblaDate.format(new Date()).split('/').map(Number);
    const date = month * 100 + day;
    let season = '';
    if (date >= 1120 || date <= 104) season = 'navidad';
    else if (date >= 105 && date <= 107) season = 'reyes';
    else if (date === 202) season = 'candelaria';

    header.dataset.season = season;
    ornament.dataset.season = season;
    document.body.dataset.season = season;

    if (season !== 'navidad' || reducedMotion.matches) {
      if (snow.firstChild) snow.replaceChildren();
      return;
    }

    if (snow.firstChild) return;
    const flakes = document.createDocumentFragment();
    const count = window.matchMedia('(max-width: 600px)').matches ? 24 : 42;
    for (let index = 0; index < count; index++) {
      const flake = document.createElement('i');
      flake.className = 'snowflake';
      const duration = 9 + Math.random() * 15;
      flake.style.setProperty('--left', Math.random() * 100 + '%');
      flake.style.setProperty('--size', 2 + Math.random() * 4 + 'px');
      flake.style.setProperty('--opacity', 0.25 + Math.random() * 0.55);
      flake.style.setProperty('--drift', Math.random() * 100 - 50 + 'px');
      flake.style.setProperty('--duration', duration + 's');
      flake.style.setProperty('--delay', -Math.random() * duration + 's');
      flakes.append(flake);
    }
    snow.append(flakes);
  }

  updateSeason();
  reducedMotion.addEventListener('change', updateSeason);
  window.addEventListener('pageshow', updateSeason);
  document.addEventListener('visibilitychange', updateSeason);
  window.setInterval(updateSeason, 60_000);
})();
</script>
